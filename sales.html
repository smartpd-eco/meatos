<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>매출현황</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 12px; }
  .kpis { display:flex; gap:8px; margin-bottom:14px; }
  .kpi { flex:1; background:#fff; border-radius:12px; padding:14px 8px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .kpi b { display:block; font-size:20px; } .kpi .amt { font-size:13px; color:#166534; font-weight:700; margin-top:2px; } .kpi span { font-size:12px; color:#6b7280; }
  .card { background:#fff; border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:15px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .card h2 .r { font-weight:400; color:#6b7280; font-size:13px; }
  /* 월별 캘린더 */
  .calwrap { overflow-x:auto; }
  table.cal { width:100%; border-collapse:collapse; font-size:12px; min-width:520px; }
  table.cal th, table.cal td { border:1px solid #e5e7eb; padding:4px; text-align:right; vertical-align:top; height:52px; }
  table.cal thead th { background:#374151; color:#fff; text-align:center; height:auto; padding:6px; font-weight:700; }
  table.cal thead th.sun { color:#fecaca; } table.cal thead th.sat { color:#bfdbfe; }
  table.cal td.empty { background:#fafafa; }
  table.cal td.daycell { cursor:pointer; }
  table.cal td.daycell:hover { background:#eff6ff; }
  table.cal td.today { background:#fef9c3; }
  table.cal td .dn { text-align:left; color:#6b7280; font-weight:700; }
  table.cal td.sun .dn { color:#dc2626; }
  table.cal td .da { color:#166534; font-weight:800; font-size:12px; margin-top:6px; }
  table.cal .sumcol { background:#f8fafc; font-weight:800; text-align:right; color:#111827; }
  table.cal tfoot td { background:#111827; color:#fff; font-weight:800; }
  table.cal tfoot .mtot-l { text-align:center; }
  /* 매출 내역 */
  table.lst { width:100%; border-collapse:collapse; font-size:14px; }
  table.lst th, table.lst td { border-bottom:1px solid #eef2f7; padding:9px 6px; text-align:left; white-space:nowrap; }
  table.lst th { background:#f8fafc; color:#374151; } table.lst td.num,table.lst th.num { text-align:right; }
  table.lst td.name { white-space:normal; font-weight:600; }
  .muted { color:#6b7280; padding:12px; text-align:center; }
  .link { color:#2563eb; cursor:pointer; font-weight:700; font-size:13px; }
  /* 판매입력 모달 */
  .modal { position:fixed; inset:0; z-index:100000; background:rgba(0,0,0,.5); display:none; align-items:flex-start; justify-content:center; padding:16px; overflow:auto; }
  .modal.open { display:flex; }
  .mbox { background:#fff; border-radius:16px; padding:18px; width:100%; max-width:460px; margin-top:40px; }
  .mhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .mhead b { font-size:17px; } .mhead button { border:none; background:#e5e7eb; border-radius:8px; padding:6px 12px; font-weight:700; cursor:pointer; }
  .frm { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .frm .full { grid-column:1 / -1; }
  label { font-size:12px; color:#6b7280; display:block; }
  input, select { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; margin-top:4px; }
  button.primary { display:block; width:100%; margin-top:12px; padding:14px; font-size:16px; font-weight:800; border:none; border-radius:12px; background:#16a34a; color:#fff; cursor:pointer; }
  .msg { font-size:13px; margin-top:8px; }
</style>
</head>
<body>
  <h1>💰 매출현황</h1>

  <div class="kpis">
    <div class="kpi"><b id="k-m">-</b><div class="amt" id="k-m-amt">-</div><span>이번 달</span></div>
    <div class="kpi"><b id="k-w">-</b><div class="amt" id="k-w-amt">-</div><span>이번 주</span></div>
    <div class="kpi"><b id="k-d">-</b><div class="amt" id="k-d-amt">-</div><span>오늘</span></div>
  </div>

  <div class="card">
    <h2>📅 월별 매출 <span class="r" id="cal-ym"></span></h2>
    <div class="calwrap"><div id="cal" class="muted">불러오는 중…</div></div>
  </div>

  <div class="card" id="listCard">
    <h2>🧾 매출 내역 <span class="r" id="list-scope">(최신순)</span></h2>
    <div id="list-reset" style="margin-bottom:6px;display:none"><span class="link" id="reset-btn">← 전체 보기</span></div>
    <div style="overflow-x:auto"><table class="lst">
      <thead><tr><th>날짜</th><th>채널</th><th class="name">품목</th><th class="num">수량</th><th class="num">단가</th><th class="num">금액</th></tr></thead>
      <tbody id="tb"><tr><td colspan="6" class="muted">불러오는 중…</td></tr></tbody>
    </table></div>
  </div>

  <!-- 판매 입력 모달 (헤더 '판매입력' 아이콘으로 열림) -->
  <div class="modal" id="inputModal">
    <div class="mbox">
      <div class="mhead"><b>➕ 판매 입력</b><button id="mclose">닫기</button></div>
      <div class="frm">
        <div class="full"><label>품목명<input id="f-item" type="text" placeholder="예: 삼겹살" /></label></div>
        <div><label>수량<input id="f-qty" type="number" step="0.01" placeholder="0" /></label></div>
        <div><label>단가(원)<input id="f-price" type="number" step="1" placeholder="0" /></label></div>
        <div><label>금액(원)<input id="f-amt" type="number" step="1" placeholder="자동 계산" /></label></div>
        <div><label>판매일<input id="f-date" type="date" /></label></div>
        <div><label>채널<select id="f-channel"><option value="STORE">🏪 매장(POS)</option><option value="COUPANG">🛵 쿠팡이츠</option><option value="MEATBONGA">🥩 정육본가</option><option value="ETC">기타</option></select></label></div>
        <div class="full"><label>메모<input id="f-memo" type="text" placeholder="선택" /></label></div>
      </div>
      <button class="primary" id="saveBtn">💾 매출 저장</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

<script src="header.js"></script>
<script>
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const ANON = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const TENANT = window.MEATOS_TENANT || "881f6cc1-b552-468c-b9b4-152edb464e61";
const H = { apikey: ANON, Authorization: "Bearer " + ANON };
const HW = { ...H, "Content-Type": "application/json" };
const won = (v) => Number(v||0).toLocaleString("ko-KR");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
function pad(n){ return String(n).padStart(2,"0"); }
function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
const today = fmt(new Date());
const CHAN = { STORE:{label:"🏪 매장",bg:"#dcfce7",fg:"#166534"}, COUPANG:{label:"🛵 쿠팡이츠",bg:"#e0f2fe",fg:"#075985"}, MEATBONGA:{label:"🥩 정육본가",bg:"#fce7f3",fg:"#9d174d"}, ETC:{label:"기타",bg:"#f3f4f6",fg:"#374151"} };
function chanBadge(c){ const i=CHAN[c]||CHAN.ETC; return "<span style='background:"+i.bg+";color:"+i.fg+";padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap'>"+i.label+"</span>"; }

document.getElementById("f-date").value = today;

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

// 금액 자동 계산
let amtTouched = false;
document.getElementById("f-amt").addEventListener("input", ()=>{ amtTouched = true; });
function recalc(){ if(amtTouched) return; const q=Number(document.getElementById("f-qty").value)||0, p=Number(document.getElementById("f-price").value)||0; if(q&&p) document.getElementById("f-amt").value = Math.round(q*p); }
document.getElementById("f-qty").addEventListener("input", recalc);
document.getElementById("f-price").addEventListener("input", recalc);

function weekStart(){ const d=new Date(); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return fmt(d); }
function monthStart(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-01"; }

let ALL = [];
async function load(){
  try{
    let r = await fetch(REST+"/sales_record?tenant_id=eq."+TENANT+"&select=id,sale_date,item_name,quantity,unit_price,amount,channel,created_at&order=sale_date.desc,created_at.desc&limit=1000",{headers:H});
    if(!r.ok){ // channel 컬럼 미생성 등 → 없이 재시도
      r = await fetch(REST+"/sales_record?tenant_id=eq."+TENANT+"&select=id,sale_date,item_name,quantity,unit_price,amount,created_at&order=sale_date.desc,created_at.desc&limit=1000",{headers:H});
    }
    ALL = r.ok ? await r.json() : [];
  }catch(e){ ALL = []; }
  renderKpis(); renderList(); renderCalendar();   // 실패해도 항상 렌더(로딩 멈춤 방지)
}
async function jget(path){ try{ const r=await fetch(REST+path,{headers:H}); return r.ok?await r.json():null; }catch(e){ return null; } }
function setKpi(m,w,d){
  document.getElementById("k-m").textContent=m.cnt+"건"; document.getElementById("k-m-amt").textContent=won(m.amt)+"원";
  document.getElementById("k-w").textContent=w.cnt+"건"; document.getElementById("k-w-amt").textContent=won(w.amt)+"원";
  document.getElementById("k-d").textContent=d.cnt+"건"; document.getElementById("k-d-amt").textContent=won(d.amt)+"원";
}
function sumRange(from){ const rows=ALL.filter(x=>x.sale_date>=from); return { cnt:rows.length, amt:rows.reduce((s,x)=>s+(Number(x.amount)||0),0) }; }
async function renderKpis(){
  const ds = await jget("/daily_sales_summary?company_id=eq."+TENANT+"&day=gte."+monthStart()+"&select=day,order_cnt,amount");
  if(Array.isArray(ds)){
    const agg=(from)=>{ const r=ds.filter(x=>x.day>=from); return { cnt:r.reduce((s,x)=>s+(x.order_cnt||0),0), amt:r.reduce((s,x)=>s+(Number(x.amount)||0),0) }; };
    setKpi(agg(monthStart()), agg(weekStart()), agg(today)); return;
  }
  setKpi(sumRange(monthStart()), sumRange(weekStart()), sumRange(today));
}

// 월별 매출 캘린더 (이번 달)
function renderCalendar(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const ym = y+"-"+pad(m+1);
  document.getElementById("cal-ym").textContent = "("+ym+")";
  const startDow=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const byDay={};
  ALL.forEach(x=>{ if(x.sale_date && x.sale_date.slice(0,7)===ym){ byDay[x.sale_date]=(byDay[x.sale_date]||0)+(Number(x.amount)||0); } });
  let html="<table class='cal'><thead><tr><th class='sun'>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th class='sat'>토</th><th class='sumcol'>계</th></tr></thead><tbody>";
  let day=1, monthTotal=0;
  for(let w=0; w<6 && day<=dim; w++){
    html+="<tr>"; let weekTotal=0;
    for(let dow=0; dow<7; dow++){
      if((w===0 && dow<startDow) || day>dim){ html+="<td class='empty'></td>"; }
      else{
        const dsv=ym+"-"+pad(day), amt=byDay[dsv]||0;
        weekTotal+=amt; monthTotal+=amt;
        html+="<td class='daycell"+(dsv===today?" today":"")+(dow===0?" sun":"")+"' data-d='"+dsv+"'><div class='dn'>"+day+"</div>"+(amt?"<div class='da'>"+won(amt)+"</div>":"")+"</td>";
        day++;
      }
    }
    html+="<td class='sumcol'>"+(weekTotal?won(weekTotal):"")+"</td></tr>";
  }
  html+="</tbody><tfoot><tr><td colspan='7' class='mtot-l'>월매출 총합계</td><td class='sumcol'>"+won(monthTotal)+"</td></tr></tfoot></table>";
  const host=document.getElementById("cal"); host.className=""; host.innerHTML=html;
  host.querySelectorAll("td.daycell").forEach(td=>td.addEventListener("click",()=>filterDay(td.dataset.d)));
}
function filterDay(dsv){
  document.getElementById("list-scope").textContent="("+dsv+")";
  document.getElementById("list-reset").style.display="block";
  renderList(ALL.filter(x=>x.sale_date===dsv));
  document.getElementById("listCard").scrollIntoView({behavior:"smooth", block:"start"});
}
document.getElementById("reset-btn").addEventListener("click", ()=>{
  document.getElementById("list-scope").textContent="(최신순)";
  document.getElementById("list-reset").style.display="none";
  renderList();
});

function renderList(rows){
  rows = rows || ALL;
  const tb=document.getElementById("tb");
  if(!rows.length){ tb.innerHTML="<tr><td colspan='6' class='muted'>매출 내역이 없습니다.</td></tr>"; return; }
  tb.innerHTML = rows.map(x=>"<tr><td>"+esc(x.sale_date)+"</td><td>"+chanBadge(x.channel)+"</td><td class='name'>"+esc(x.item_name)+"</td><td class='num'>"+(x.quantity!=null?won(x.quantity):"-")+"</td><td class='num'>"+(x.unit_price!=null?won(x.unit_price):"-")+"</td><td class='num'>"+won(x.amount)+"</td></tr>").join("");
}
load();

// ===== 판매 입력 모달 =====
const modal=document.getElementById("inputModal");
function openInput(){ modal.classList.add("open"); document.getElementById("f-item").focus(); }
function closeInput(){ modal.classList.remove("open"); }
document.getElementById("mclose").addEventListener("click", closeInput);
modal.addEventListener("click", (e)=>{ if(e.target===modal) closeInput(); });
document.addEventListener("meatos:openSaleInput", openInput);   // 헤더 아이콘에서 호출
if(new URLSearchParams(location.search).get("input")==="1") setTimeout(openInput, 150);

document.getElementById("saveBtn").addEventListener("click", async ()=>{
  const msg=document.getElementById("msg");
  const item=(document.getElementById("f-item").value||"").trim();
  if(!item){ msg.style.color="#b91c1c"; msg.textContent="품목명을 입력하세요."; return; }
  const q=document.getElementById("f-qty").value, p=document.getElementById("f-price").value, a=document.getElementById("f-amt").value;
  const row={ tenant_id:TENANT, sale_date:document.getElementById("f-date").value||today, item_name:item,
    quantity: q!==""?Number(q):null, unit_price: p!==""?Number(p):null,
    amount: a!==""?Number(a):(q&&p?Math.round(Number(q)*Number(p)):0),
    channel: document.getElementById("f-channel").value,
    memo:(document.getElementById("f-memo").value||"").trim()||null };
  msg.style.color="#6b7280"; msg.textContent="저장 중…";
  try{
    const r=await fetch(REST+"/sales_record",{method:"POST",headers:{...HW,Prefer:"return=minimal"},body:JSON.stringify(row)});
    if(!r.ok) throw new Error(r.status+": "+(await r.text()).slice(0,150));
    msg.style.color="#166534"; msg.textContent="✓ 매출 저장 완료";
    document.getElementById("f-item").value=""; document.getElementById("f-qty").value=""; document.getElementById("f-price").value=""; document.getElementById("f-amt").value=""; document.getElementById("f-memo").value=""; amtTouched=false;
    load();
    setTimeout(()=>{ closeInput(); msg.textContent=""; }, 700);
  }catch(e){ msg.style.color="#b91c1c"; msg.textContent="저장 실패: "+e.message; }
});
</script>
</body>
</html>
