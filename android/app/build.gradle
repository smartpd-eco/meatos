plugins {
    id 'com.android.application'
}

// 버전: GitHub Actions에서 빌드할 때마다 1씩 올라간다 (Play는 올릴 때마다 versionCode가 커야 함).
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// 서명 키: CI에서는 환경변수(GitHub Secrets), PC에서는 keystore/keystore.properties (깃에 안 올라감)
def keystorePath = System.getenv("MEATOS_KEYSTORE")
def keystorePassword = System.getenv("MEATOS_KEYSTORE_PASSWORD")
def keyAliasName = System.getenv("MEATOS_KEY_ALIAS") ?: "meatos-upload"
def localProps = rootProject.file("keystore/keystore.properties")
if (!keystorePath && localProps.exists()) {
    def p = new Properties()
    localProps.withInputStream { p.load(it) }
    keystorePath = rootProject.file("keystore/" + p.getProperty("storeFile")).path
    keystorePassword = p.getProperty("storePassword")
    keyAliasName = p.getProperty("keyAlias") ?: keyAliasName
}
def hasSigning = keystorePath && keystorePassword && new File(keystorePath).exists()

android {
    namespace 'kr.meatos.app'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.meatos.app'
        minSdk 24
        targetSdk 36
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
}
