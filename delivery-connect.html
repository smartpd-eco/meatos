<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>쿠팡이츠 매출 연동 · 정육비서</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827;padding:14px}
  h1{font-size:20px;margin:2px 0 4px}
  .sub{color:#6b7280;font-size:13px;margin-bottom:14px;line-height:1.55}
  .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card h2{font-size:15px;margin:0 0 10px}
  .brand{font-size:22px;font-weight:900;color:#1a8f5a;letter-spacing:-.02em;margin:2px 0 16px}
  label{display:block;font-size:13px;font-weight:800;color:#111827;margin-top:14px}
  .req{color:#2563eb;font-size:12px;margin-left:4px}
  input[type=text],input[type=password]{width:100%;margin-top:8px;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
  .pw{position:relative}
  .pw button{position:absolute;right:8px;top:50%;transform:translateY(-30%);border:0;background:transparent;font-size:18px;cursor:pointer;color:#6b7280}
  .consent{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;font-weight:700;color:#374151}
  .consent input{width:18px;height:18px}
  button.primary{display:block;width:100%;margin-top:16px;padding:15px;font-size:16px;font-weight:800;border:0;border-radius:12px;background:#16a34a;color:#fff;cursor:pointer}
  button.primary:disabled{background:#cbd5e1;cursor:not-allowed}
  .secnote{margin-top:12px;font-size:12px;color:#6b7280;line-height:1.5}
  .msg{margin-top:10px;font-size:13px;font-weight:700}
  .status{border-radius:10px;padding:12px;font-weight:800;font-size:14px}
  .status.out{background:#fef2f2;color:#b91c1c}
  .status.ok{background:#dcfce7;color:#166534}
  .status.pending{background:#fef9c3;color:#854d0e}
  .muted{color:#6b7280;font-size:13px;line-height:1.6}
  .notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:12px;font-size:13px;line-height:1.6}
  .notice b{color:#b45309}
</style>
</head>
<body>
  <h1>🛵 쿠팡이츠 매출 연동</h1>
  <div class="sub">쿠팡이츠 <b>매출·정산·입금 예정</b>을 자동으로 불러와 매출현황에 함께 보여주는 기능입니다.</div>

  <div class="card">
    <h2>현재 제공하지 않는 기능입니다</h2>
    <div class="muted">쿠팡이츠 매출 자동 연동은 매출 집계사와의 정식 연동을 마친 뒤 제공할 예정입니다. 지금은 쿠팡이츠 계정 정보를 입력받지 않습니다.</div>
    <div class="muted" style="margin-top:10px">판매 내역은 <a href="sales.html">매출현황</a>에서 확인할 수 있습니다.</div>
  </div>

<script src="header.js"></script>
</body>
</html>
