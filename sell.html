<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>판매 스캔 · 정육비서</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 4px; }
  .sub { color:#6b7280; font-size:13px; margin-bottom:12px; }
  .scan { background:#111827; border-radius:14px; padding:16px; margin-bottom:12px; }
  .scan input { width:100%; padding:16px; font-size:20px; font-weight:800; text-align:center; border:2px solid #16a34a; border-radius:12px; }
  .scan .hint { color:#9ca3af; font-size:12px; text-align:center; margin-top:8px; }
  .kpis { display:flex; gap:8px; margin-bottom:12px; }
  .kpi { flex:1; background:#fff; border-radius:12px; padding:12px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .kpi b { display:block; font-size:18px; } .kpi span { color:#6b7280; font-size:12px; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:15px; margin:0 0 10px; }
  label { font-size:12px; color:#6b7280; display:block; margin-top:8px; }
  input.f, select.f { width:100%; padding:11px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; margin-top:4px; }
  button.primary { width:100%; margin-top:12px; padding:13px; font-size:16px; font-weight:800; border:none; border-radius:10px; background:#16a34a; color:#fff; cursor:pointer; }
  button.gray { background:#e5e7eb; color:#111827; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { border-bottom:1px solid #eef2f7; padding:9px 6px; text-align:left; white-space:nowrap; }
  th { background:#f8fafc; color:#374151; } td.num,th.num { text-align:right; }
  td.name { white-space:normal; font-weight:600; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#166534; color:#fff; padding:12px 20px; border-radius:999px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:100000; display:none; max-width:92vw; text-align:center; }
  .toast.warn { background:#92400e; }
  .muted { color:#6b7280; padding:10px; text-align:center; }
  .unmapped-tag { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:#fef3c7; color:#92400e; font-size:11px; font-weight:800; }
  .map-link { margin-left:6px; border:0; background:none; color:#2563eb; font-weight:800; font-size:12px; cursor:pointer; padding:0; }
</style>
</head>
<body>
  <h1>판매 스캔</h1>
  <div class="sub" id="product-status">저울 라벨을 찍으면 금액이 바로 매출로 기록됩니다.</div>

  <div class="scan">
    <input id="scan" type="text" inputmode="numeric" aria-label="상품 바코드 스캔" placeholder="여기를 누르고 바코드를 스캔하세요" autocomplete="off" />
    <div class="hint">품목 등록이 없어도 저울 라벨 금액은 바로 매출로 잡힙니다. 품목은 나중에 한 번만 지정하면 됩니다.</div>
  </div>

  <div class="kpis">
    <div class="kpi"><b id="k-cnt">0</b><span>이 화면에서 기록한 판매</span></div>
    <div class="kpi"><b id="k-amt">0</b><span>합계(원)</span></div>
  </div>

  <div class="card" id="learn" style="display:none">
    <h2 id="l-title">🏷️ 품목 지정</h2>
    <div style="color:#6b7280;font-size:13px" id="l-desc">바코드 <b id="l-code"></b> — 어떤 품목인가요? 한 번만 지정하면 지난 판매까지 자동으로 바뀝니다.</div>
    <label>품목<input class="f" id="l-name" list="prodlist" placeholder="예: 냉장 삼겹살" /></label>
    <datalist id="prodlist"></datalist>
    <label id="l-price-label">100g당 단가(원)<input class="f" id="l-price" type="number" step="1" placeholder="예: 2500" /></label>
    <button class="primary" id="l-save">지정하기</button>
    <button class="primary gray" id="l-cancel" style="margin-top:8px">닫기</button>
  </div>

  <div class="card" id="confirm" style="display:none">
    <h2>⚖️ 판매 확인</h2>
    <div style="font-weight:800" id="c-name"></div>
    <label>중량(kg)<input class="f" id="c-qty" type="number" step="0.001" /></label>
    <label>금액(원)<input class="f" id="c-amt" type="number" step="1" /></label>
    <button class="primary" id="c-save">매출 기록 (Enter)</button>
  </div>

  <div class="card">
    <h2>방금 기록한 판매 <span style="font-weight:400;color:#6b7280;font-size:13px">(취소·반품은 매출현황에서 판매취소)</span></h2>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>시간</th><th class="name">품목</th><th class="num">중량(kg)</th><th class="num">금액</th></tr></thead>
      <tbody id="tb"><tr><td colspan="4" class="muted">스캔을 시작하세요.</td></tr></tbody>
    </table></div>
  </div>

  <div class="toast" id="toast"></div>

<script src="header.js"></script>
<script src="src/data/product-name-substitution.js?v=20260804-species-storage-1"></script>
<script>
// Rev 1.2 — 매출 우선. 판매 1건은 서버 함수(record_web_scan_sale) 한 번으로 매출+재고를 함께 저장한다.
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const TENANT = window.MEATOS_TENANT || "881f6cc1-b552-468c-b9b4-152edb464e61";
const COMPANY = window.MEATOS_CONTEXT?.companyId || TENANT;
const STORE = window.MEATOS_CONTEXT?.storeId || null;
const H = window.MEATOS_API_HEADERS;
const HW = { ...H, "Content-Type": "application/json", Prefer: "return=minimal" };
const won = (v) => Number(v||0).toLocaleString("ko-KR");
const kg = (v) => v==null ? "-" : (Math.round((Number(v)||0)*1000)/1000).toLocaleString("ko-KR");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
function nowHm(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

const scanEl = document.getElementById("scan");
function focusScan(){ try{ scanEl.focus(); }catch(e){} }
focusScan(); document.addEventListener("click", (e)=>{ if(!e.target.closest("input,select,button")) focusScan(); });

let MAPS = {};      // barcode_key -> mapping row
let PRODUCTS = [];  // 품목 대표 이름 목록(재고현황과 같은 AI 통합 기준)
let session = { cnt:0, amt:0 };

const PN = window.MEATOS_PRODUCT_NAMES || null;
function resolveName(raw){
  if(PN){
    try{
      const r = PN.resolve(raw, {});
      if(r && r.displayName) return { key:String(r.key||raw), displayName:r.displayName };
    }catch(e){}
  }
  return { key:String(raw||""), displayName:String(raw||"") };
}

let toastTimer=null;
function toast(msg, warn){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast"+(warn?" warn":""); t.style.display="block";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display="none", warn?3200:2200);
}

async function loadMaps(){
  try{ const storeFilter=STORE ? "&or=(store_id.eq."+encodeURIComponent(STORE)+",store_id.is.null)" : "&store_id=is.null";
    const r=await fetch(REST+"/product_barcode?tenant_id=eq."+TENANT+storeFilter+"&select=barcode_key,raw_product_name,unit,default_price,weigh_type,company_id,store_id&limit=5000",{headers:H});
    if(r.ok){ (await r.json()).forEach(m=>MAPS[m.barcode_key]=m); } }catch(e){}
}
// 품목 이름 후보: 재고 유무와 관계없이 지금까지 입고·판매된 품목의 대표 이름 (기초재고 없이 시작해도 OK)
async function loadProducts(){
  try{
    const storeFilter=STORE?"&store_id=eq."+encodeURIComponent(STORE):"";
    const invRequest = fetch(REST+"/inventory_movement?tenant_id=eq."+TENANT+storeFilter+"&is_active=eq.true&select=raw_product_name&limit=5000",{headers:H});
    if(PN){ try{ await PN.loadRemoteLearning({restUrl:REST, headers:H, tenantId:TENANT}); }catch(e){} }
    const r = await invRequest;
    if(!r.ok) return;
    const names=new Set();
    (await r.json()).forEach(row=>{ const n=resolveName(row.raw_product_name).displayName; if(n) names.add(n); });
    Object.values(MAPS).forEach(m=>{ if(m.raw_product_name) names.add(m.raw_product_name); });
    PRODUCTS=[...names].sort((a,b)=>a.localeCompare(b,"ko"));
    document.getElementById("prodlist").innerHTML = PRODUCTS.map(p=>"<option value=\""+esc(p)+"\">").join("");
  }catch(e){ PRODUCTS=[]; }
}
loadMaps().then(loadProducts).then(openFromQuery);

// KR 매장/저울 바코드: 13자리, '2' 시작이면 품목코드(2~7) + 금액(8~12)
function parseScanCode(code){
  const raw = String(code).trim();
  const d = raw.replace(/\D/g,"");
  if(d.length===13 && /^2/.test(d)){ return { key: d.slice(1,7), embedded: Number(d.slice(7,12)), instore:true, raw:d }; }
  return { key: raw, embedded: null, instore:false, raw };
}
function autoWeighType(p){ return p.instore ? "PRICE_EMBED" : "FIXED"; }

let PENDING = null;

scanEl.addEventListener("keydown", (e)=>{
  if(e.key!=="Enter") return;
  e.preventDefault();
  const code = scanEl.value.trim(); scanEl.value="";
  if(!code) return;
  handleScan(code);
});

function handleScan(code){
  const p = parseScanCode(code);
  const map = MAPS[p.key];
  if(map && map.weigh_type==="MANUAL"){ openConfirm(map, p); return; }
  if(map || p.instore){ recordSale(p.raw); return; }     // 지정된 품목 또는 저울 라벨 → 바로 매출 기록
  openLearn(p, false);                                    // 금액 정보가 없는 일반 바코드만 먼저 지정
}

function friendlyError(code){
  const text=String(code||"");
  if(/APPROVED_COMPANY_REQUIRED|STORE_REQUIRED/.test(text)) return "사업장 연동 후 판매를 기록할 수 있습니다.";
  if(/AUTH_REQUIRED|JWT/.test(text)) return "로그인이 필요합니다.";
  if(/SALE_VALUE_REQUIRED/.test(text)) return "판매 금액을 확인할 수 없습니다. 품목 단가를 확인하세요.";
  if(/INVALID_BARCODE/.test(text)) return "바코드 형식이 아닙니다.";
  return text||"저장 실패";
}

// 서버 함수 1회 호출 = 매출 + 재고(품목 지정된 경우) 함께 저장
async function recordSale(barcode, quantity, amount){
  const body = { p_barcode:String(barcode), p_external_transaction_id:"WEB-"+Date.now()+"-"+String(barcode).slice(-12) };
  if(quantity!=null) body.p_quantity=quantity;
  if(amount!=null) body.p_sale_amount=amount;
  try{
    const r=await fetch(REST+"/rpc/record_web_scan_sale",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(body)});
    const result=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(result.message||result.code||("HTTP "+r.status));
    if(!result.ok){
      if(result.error==="BARCODE_NOT_MAPPED"){ openLearn(parseScanCode(barcode), false); return; }
      throw new Error(result.error||"저장 실패");
    }
    if(result.duplicate){ toast("이미 기록된 판매입니다."); return; }
    session.cnt++; session.amt+=Number(result.amount)||0;
    document.getElementById("k-cnt").textContent=session.cnt;
    document.getElementById("k-amt").textContent=won(session.amt);
    addRow(result.product, result.quantity, result.amount, result.unmapped ? result.productCode : null);
    if(result.unmapped) toast("✓ "+won(result.amount)+"원 매출 기록 · 품목은 나중에 지정해도 됩니다");
    else if(result.stockWarning) toast("✓ "+result.product+" "+won(result.amount)+"원 · 재고 수량 확인 필요", true);
    else if(!parseScanCode(barcode).instore) toast("✓ "+result.product+" · "+won(result.amount)+"원");
    else toast("✓ "+result.product+(result.quantity!=null?" "+kg(result.quantity)+"kg":"")+" · "+won(result.amount)+"원");
  }catch(e){
    toast("⚠ "+friendlyError(e.message), true);
  }
  focusScan();
}

function openLearn(p, mapOnly){
  PENDING = { ...p, mapOnly };
  document.getElementById("confirm").style.display="none";
  document.getElementById("learn").style.display="block";
  document.getElementById("l-code").textContent = p.instore ? ("품목코드 "+p.key) : p.raw;
  document.getElementById("l-save").textContent = mapOnly ? "지정하기 (지난 판매에도 반영)" : "지정하고 판매 기록";
  const existing = MAPS[p.key];
  document.getElementById("l-name").value = existing ? existing.raw_product_name : "";
  const priceLabel = document.getElementById("l-price-label");
  const priceInput = document.getElementById("l-price");
  if(p.instore){
    priceLabel.firstChild.textContent="100g당 단가(원)"; priceInput.placeholder="예: 2500";
    priceInput.value = existing && existing.default_price ? Math.round(existing.default_price/10) : "";
  } else {
    priceLabel.firstChild.textContent="개당 가격(원)"; priceInput.placeholder="예: 3900";
    priceInput.value = existing && existing.default_price ? existing.default_price : "";
  }
  document.getElementById("learn").scrollIntoView({behavior:"smooth", block:"center"});
  document.getElementById("l-name").focus();
}
document.getElementById("l-cancel").addEventListener("click", ()=>{ document.getElementById("learn").style.display="none"; focusScan(); });
document.getElementById("l-save").addEventListener("click", async ()=>{
  let name=document.getElementById("l-name").value.trim();
  if(!name){ alert("품목 이름을 입력하세요."); return; }
  // 거래처마다 다른 이름은 재고현황과 같은 대표 이름으로 통일
  const canonical=resolveName(name).displayName||name;
  if(canonical!==name && confirm("'"+canonical+"' 이름으로 통일해서 지정할까요?")) name=canonical;
  if(PRODUCTS.length>0 && !PRODUCTS.includes(name) && !confirm("처음 보는 품목 이름입니다. '"+name+"'으로 지정할까요?")) return;
  const price0=document.getElementById("l-price").value;
  if(price0===""){ alert(PENDING.instore ? "100g당 단가를 입력하세요. (중량 계산에 사용)" : "개당 가격을 입력하세요."); return; }
  const weigh_type=autoWeighType(PENDING);
  const typed=Number(price0)||null;
  const price = typed==null ? null : (weigh_type==="FIXED" ? typed : typed*10);  // 저울 상품은 원/kg 로 저장
  const map={ tenant_id:TENANT, company_id:COMPANY, store_id:STORE, barcode_key:String(PENDING.key), raw_product_name:name, unit:"kg", default_price:price, weigh_type };
  try{
    const r=await fetch(REST+"/product_barcode?on_conflict=tenant_id,barcode_key",{
      method:"POST",
      headers:{...HW,Prefer:"resolution=merge-duplicates,return=representation"},
      body:JSON.stringify(map)
    });
    if(!r.ok) throw new Error(await r.text());
    const saved=await r.json();
    MAPS[PENDING.key]=saved[0]||map;
    if(!PRODUCTS.includes(name)){ PRODUCTS.push(name); document.getElementById("prodlist").insertAdjacentHTML("beforeend","<option value=\""+esc(name)+"\">"); }
  }catch(e){ alert("지정 실패: "+e.message); return; }
  document.getElementById("learn").style.display="none";
  document.querySelectorAll("[data-pending-code='"+PENDING.key+"']").forEach(td=>{ td.innerHTML=esc(name); });
  if(PENDING.mapOnly){ toast("✓ '"+name+"' 지정 완료 · 지난 미분류 판매에도 반영됐습니다"); focusScan(); return; }
  recordSale(PENDING.raw);
});

function openConfirm(map, p){
  PENDING = { map, p };
  document.getElementById("learn").style.display="none";
  document.getElementById("confirm").style.display="block";
  document.getElementById("c-name").textContent = map.raw_product_name;
  const price=Number(map.default_price)||0;
  document.getElementById("c-qty").value="";
  document.getElementById("c-amt").value="";
  const qEl=document.getElementById("c-qty"); qEl.focus();
  qEl.oninput = ()=>{ if(price>0) document.getElementById("c-amt").value=Math.round((Number(qEl.value)||0)*price); };
}
document.getElementById("c-save").addEventListener("click", ()=>{
  const qty=Number(document.getElementById("c-qty").value)||0;
  const amt=Number(document.getElementById("c-amt").value)||0;
  if(qty<=0){ alert("중량을 입력하세요."); return; }
  document.getElementById("confirm").style.display="none";
  recordSale(PENDING.p.raw, qty, amt);
});
document.getElementById("c-qty").addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("c-save").click(); } });

function addRow(name, qty, amt, pendingCode){
  const tb=document.getElementById("tb");
  if(tb.querySelector(".muted")) tb.innerHTML="";
  const tr=document.createElement("tr");
  const nameCell = pendingCode
    ? "<td class='name' data-pending-code='"+esc(pendingCode)+"'>"+esc(name)+"<span class='unmapped-tag'>품목 미지정</span><button class='map-link' type='button' data-code='"+esc(pendingCode)+"'>지정</button></td>"
    : "<td class='name'>"+esc(name)+"</td>";
  tr.innerHTML="<td>"+nowHm()+"</td>"+nameCell+"<td class='num'>"+kg(qty)+"</td><td class='num'>"+won(amt)+"</td>";
  tb.insertBefore(tr, tb.firstChild);
}
document.getElementById("tb").addEventListener("click",(e)=>{
  const b=e.target.closest(".map-link"); if(!b) return;
  openLearn({ key:b.dataset.code, embedded:null, instore:true, raw:b.dataset.code }, true);
});

// 오늘의 돈 화면의 "품목 지정" 버튼: sell.html?code=123456
function openFromQuery(){
  const code=(new URLSearchParams(location.search).get("code")||"").replace(/[^0-9A-Za-z._-]/g,"");
  if(code) openLearn({ key:code, embedded:null, instore:/^[0-9]{6}$/.test(code), raw:code }, true);
}
</script>
</body>
</html>
