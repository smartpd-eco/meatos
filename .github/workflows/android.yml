# (원본 위치: .github/workflows/android.yml — 이 파일을 거기로 복사해서 사용)
# 정육비서 안드로이드 앱 빌드 (GitHub 클라우드에서 실행 — PC에 안드로이드 스튜디오 불필요)
# 결과물: Actions 실행 화면 맨 아래 Artifacts 의 "meatos-android-번호" (zip)
#   - app-release.aab : 구글 플레이에 올리는 파일
#   - app-release.apk : 휴대폰에 바로 설치해 보는 테스트용 파일
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 Secret이 없습니다. 저장소 Settings → Secrets 에 등록하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/meatos-upload.jks"

      - name: 앱 빌드 (aab + apk)
        env:
          MEATOS_KEYSTORE: ${{ runner.temp }}/meatos-upload.jks
          MEATOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEATOS_KEY_ALIAS: meatos-upload
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: 서명 확인
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
          ls -la app/build/outputs/bundle/release/ app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: meatos-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
