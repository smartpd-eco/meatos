<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>알림현황</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 4px; }
  .sub { color:#6b7280; font-size:13px; margin-bottom:12px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .bar a { flex:1; text-align:center; padding:12px; border-radius:10px; background:#16a34a; color:#fff; text-decoration:none; font-weight:700; }
  .bar a.alt { background:#e5e7eb; color:#111827; }
  .kpis { display:flex; gap:8px; margin-bottom:14px; }
  .kpi { flex:1; border-radius:12px; padding:14px 8px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .kpi b { display:block; font-size:22px; } .kpi span { font-size:12px; }
  .k-exp { background:#fee2e2; color:#b91c1c; } .k-danger { background:#ffedd5; color:#c2410c; } .k-warn { background:#fef9c3; color:#a16207; }
  .card { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); border-left:6px solid #d1d5db; }
  .card.exp { border-left-color:#dc2626; } .card.danger { border-left-color:#ea580c; } .card.warn { border-left-color:#ca8a04; }
  .r1 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .nm { font-weight:800; font-size:15px; }
  .badge { padding:2px 10px; border-radius:999px; font-weight:800; font-size:12px; white-space:nowrap; }
  .b-exp { background:#fee2e2; color:#b91c1c; } .b-danger { background:#ffedd5; color:#c2410c; } .b-warn { background:#fef9c3; color:#a16207; } .b-ok { background:#dcfce7; color:#166534; }
  .meta { color:#6b7280; font-size:13px; margin-top:4px; }
  .muted { color:#6b7280; font-size:14px; padding:16px; text-align:center; }
  .tracelink { color:#2563eb; text-decoration:none; font-weight:700; }
  .sechdr { font-weight:800; margin:14px 0 6px; }
  #trace-print-area { display:none; }
  @media print {
    body.trace-printing > *:not(#trace-print-area) { display:none !important; }
    #trace-print-area { display:block !important; padding:8px 4px; }
  }
</style>
</head>
<body>
  <h1>🔔 알림현황</h1>
  <div class="sub">유통기한 임박·만료 품목입니다. 도축일(없으면 입고일) 기준 자동 계산.</div>
  <div class="bar"><a href="sanitation.html">📋 정육일지</a><a href="stock.html" class="alt">📦 재고</a><a href="policy.html" class="alt">⚙️ 기준</a><a href="/" class="alt">🏠 홈</a></div>

  <div id="log-status" style="margin-bottom:12px"></div>

  <div class="kpis">
    <div class="kpi k-exp"><b id="k-exp">-</b><span>만료</span></div>
    <div class="kpi k-danger"><b id="k-danger">-</b><span>위험(D-1)</span></div>
    <div class="kpi k-warn"><b id="k-warn">-</b><span>임박(D-3)</span></div>
  </div>

  <div id="list"><p class="muted">불러오는 중...</p></div>

<script>
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const ANON_KEY = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const TENANT_ID = "881f6cc1-b552-468c-b9b4-152edb464e61";
const H = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY };
const won = (v) => Number(v||0).toLocaleString("ko-KR");
const kg = (v) => (Math.round((Number(v)||0)*100)/100).toLocaleString("ko-KR");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
function dLeft(exp){ const d=new Date(exp+"T00:00:00"); if(isNaN(d)) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function localToday(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
async function loadLogStatus(){
  const host=document.getElementById("log-status");
  try{
    const r=await fetch(REST+"/daily_sanitation_logs?tenant_id=eq."+TENANT_ID+"&work_date=eq."+localToday()+"&select=id,worker_name&limit=1",{headers:H});
    const written = r.ok && (await r.json()).length>0;
    if(written){
      host.innerHTML="<div style='background:#dcfce7;color:#166534;border-radius:12px;padding:14px;font-weight:800'>🟢 오늘 정육일지가 작성되었습니다.</div>";
    } else {
      host.innerHTML="<div style='background:#fee2e2;color:#b91c1c;border-radius:12px;padding:14px'><div style='font-weight:800;margin-bottom:8px'>🔴 오늘 정육일지를 작성해주세요.</div><a href='sanitation.html' style='display:block;text-align:center;padding:12px;border-radius:10px;background:#16a34a;color:#fff;text-decoration:none;font-weight:800'>📋 정육일지 작성하기</a></div>";
    }
  }catch(e){ host.innerHTML=""; }
}
loadLogStatus();

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

async function load(){
  try{
    const url = REST+"/inventory_movement?tenant_id=eq."+TENANT_ID+"&expiry_date=not.is.null&select=raw_product_name,quantity,unit,movement_date,slaughter_date,expiry_date,supplier_name,trace_no&order=expiry_date.asc&limit=1000";
    const r = await fetch(url,{headers:H});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const rows = (await r.json()).map(m=>({ ...m, n: dLeft(m.expiry_date) })).filter(m=>m.n!==null);
    const exp = rows.filter(m=>m.n<0), danger = rows.filter(m=>m.n>=0&&m.n<=1), warn = rows.filter(m=>m.n>=2&&m.n<=3);
    document.getElementById("k-exp").textContent = exp.length;
    document.getElementById("k-danger").textContent = danger.length;
    document.getElementById("k-warn").textContent = warn.length;
    const alerts = rows.filter(m=>m.n<=3).sort((a,b)=>a.n-b.n); // 만료+임박, 급한 순
    const el = document.getElementById("list");
    if(!alerts.length){ el.innerHTML = "<p class='muted'>✓ 유통기한 임박·만료 품목이 없습니다.</p>"; return; }
    el.innerHTML = "<div class='sechdr'>⚠️ 확인 필요 "+alerts.length+"건</div>" + alerts.map(m=>{
      let cls, bcls, label;
      if(m.n<0){ cls="exp";bcls="b-exp";label="만료 "+(-m.n)+"일 지남"; }
      else if(m.n<=1){ cls="danger";bcls="b-danger";label="D-"+m.n; }
      else { cls="warn";bcls="b-warn";label="D-"+m.n; }
      const trace = m.trace_no ? " · <a href='#' class='tracelink' data-no=\""+esc(m.trace_no)+"\">이력 🔎</a>" : "";
      return "<div class='card "+cls+"'><div class='r1'><span class='nm'>"+esc(m.raw_product_name||"-")+"</span><span class='badge "+bcls+"'>"+label+"</span></div>"+
        "<div class='meta'>유통기한 "+esc(m.expiry_date)+" · 중량 "+kg(m.quantity)+"kg · "+esc(m.supplier_name||"-")+trace+"</div></div>";
    }).join("");
  }catch(e){ document.getElementById("list").innerHTML = "<p class='muted'>불러오기 실패: "+esc(e.message)+"</p>"; }
}
load();

// 이력번호 조회 패널
const TRACE_FN = "https://pkrsiqjzllyiafwpskll.functions.supabase.co/trace-lookup";
function _ymd(s){ s=String(s||""); return /^\d{8}$/.test(s)?s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8):s; }
function _trow(l,v){ return v?"<div style='display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9'><span style='color:#6b7280'>"+l+"</span><b style='text-align:right'>"+esc(v)+"</b></div>":""; }
function _species(s){ return String(s||"").replace("PIG","돼지").replace("CATTLE","소").replace("|LOT_NO"," 묶음").replace("|PIG_NO"," 이력").replace("|CATTLE_NO"," 개체"); }
function _importBody(t,i){
  const warn=(i.salePrhibt==="Y"||i.recallTarget==="Y")?"<div style='background:#fee2e2;color:#b91c1c;border-radius:10px;padding:10px;font-weight:800;margin-bottom:8px'>⚠️ 판매금지·회수대상 이력입니다. 판매 전 확인하세요."+(i.recallContent?"<div style='font-weight:600;font-size:13px;margin-top:4px'>"+esc(i.recallContent)+"</div>":"")+"</div>":"";
  return "<div style='font-size:15px;font-weight:800;margin-bottom:2px'>이력번호 "+esc(t)+"</div>"+
    "<div style='display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;margin-bottom:8px'>🌍 수입 축산물</div>"+warn+
    _trow("품목", i.itemNm)+_trow("부위", i.partNm)+
    _trow("🌍 원산지", i.nationNm)+
    _trow("🔪 도축장", i.butcheryPlaceNm)+_trow("도축기간", i.butcheryYmd)+
    _trow("🏭 가공장", i.processPlaceNm)+_trow("가공기간", i.processYmd)+
    _trow("수출업체", i.exporterNm)+_trow("수입업체", i.importerNm)+
    _trow("B/L 번호", i.blNo)+_trow("소비기한", i.consumeYmd)+
    "<div style='margin-top:10px'><a href='https://www.meatwatch.go.kr' target='_blank' style='color:#2563eb;font-size:13px'>MEATWATCH 공식 조회 ›</a></div>";
}
function _tm(){ let m=document.getElementById("trace-modal"); if(!m){ m=document.createElement("div"); m.id="trace-modal"; m.style.cssText="position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px"; m.innerHTML="<div style='background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:85vh;overflow:auto;padding:16px'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'><b style='font-size:17px'>🔎 축산물 이력정보</b><span style='display:flex;gap:6px'><button id='trace-print' onclick='_printTrace()' style='border:none;background:#2563eb;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700'>🖨️ 출력</button><button id='trace-close' style='border:none;background:#e5e7eb;border-radius:8px;padding:6px 12px;font-weight:700'>닫기</button></span></div><div id='trace-body'></div></div>"; document.body.appendChild(m); m.addEventListener("click",e=>{if(e.target===m)m.style.display="none";}); m.querySelector("#trace-close").addEventListener("click",()=>m.style.display="none"); } return m; }
let _curTraceNo="", _curTraceInfo=null;
function _pv(v){ return (v==null||v==="")?"-":esc(v); }
function _printDoc(i){
  const now=new Date().toLocaleString("ko-KR",{year:"2-digit",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"});
  let inner;
  if(i.source==="import"){
    inner=
    "<div class='thead'><span>"+now+"</span><span>수입이력정보 조회</span></div>"+
    "<div class='tbox'><span class='tl'>이력번호</span><span class='tn'>"+_pv(i.traceNo)+"</span></div>"+
    "<div class='sc'>기본정보 <em>품목명은 수입신고시점의 품목정보입니다.</em></div>"+
    "<table><tr><th>이력번호</th><td>"+_pv(i.traceNo)+"</td><th>선하증권번호</th><td>"+_pv(i.blNo)+"</td></tr>"+
    "<tr><th>수입축산물 품목명</th><td colspan='3'>"+_pv(i.itemNm)+"</td></tr></table>"+
    "<div class='sc'>원산지정보</div>"+
    "<table><tr><th>원산지 국가</th><td colspan='3'>"+_pv(i.nationNm)+"</td></tr></table>"+
    "<div class='sc'>수입이력정보</div>"+
    "<table><tr><th>수출국 도축장</th><td>"+_pv(i.butcheryPlaceNm)+"</td><th>수출국 도축일자</th><td>"+_pv(_ymd(i.butcheryYmd))+"</td></tr>"+
    "<tr><th>수출국 가공장</th><td>"+_pv(i.processPlaceNm)+"</td><th>수출국 가공일자</th><td>"+_pv(i.processYmd)+"</td></tr>"+
    "<tr><th>수출업체</th><td>"+_pv(i.exporterNm)+"</td><th>수입업체</th><td>"+_pv(i.importerNm)+"</td></tr>"+
    "<tr><th>수입일자</th><td colspan='3'>"+_pv(i.importDt)+"</td></tr>"+
    "<tr><th>부위명(코드)</th><td colspan='3'>"+_pv(i.partNm)+(i.partCode?"("+esc(i.partCode)+")":"")+"</td></tr></table>"+
    "<p class='note'>※ 본 자료는 참고용 자료로서 법적 책임소재에 대한 증빙자료로 사용될 수 없습니다.</p>";
  } else {
    const sp=_species(i.species||"");
    inner=
    "<div class='thead'><span>"+now+"</span><span>이력번호 조회</span></div>"+
    "<div class='brand'>🐄 축산물이력제 &nbsp;<b>"+_pv(sp)+" 이력번호 조회</b></div>"+
    "<div class='sc'>사육정보</div>"+
    "<table><tr><th>이력번호</th><td>"+_pv(i.traceNo)+"</td><th>농장식별번호</th><td>"+_pv(i.farmId)+"</td></tr>"+
    "<tr><th>농장경영자</th><td>"+_pv(i.farmerNm)+"</td><th>농장소재지</th><td>"+_pv(i.farmAddr)+"</td></tr>"+
    "<tr><th>축종</th><td colspan='3'>"+_pv(sp)+"</td></tr></table>"+
    "<div class='sc'>도축정보</div>"+
    "<table><tr><th>도축장</th><td>"+_pv(i.butcheryPlaceNm)+"</td><th>소재지</th><td>"+_pv(i.butcheryPlaceAddr)+"</td></tr>"+
    "<tr><th>도축일자</th><td>"+_pv(_ymd(i.butcheryYmd))+"</td><th>도축검사결과</th><td>"+(i.butcheryResult==="Y"?"합격":_pv(i.butcheryResult))+"</td></tr></table>"+
    ((i.grade||i.insfat)?("<div class='sc'>등급정보</div><table><tr><th>등급</th><td>"+_pv(i.grade)+"</td><th>근내지방도</th><td>"+_pv(i.insfat)+"</td></tr></table>"):"")+
    "<div class='sc'>식육포장처리 정보</div>"+
    "<table><tr><th>번호</th><th>업소명(등급)</th><th>소재지</th></tr>"+
    "<tr><td>1</td><td>"+_pv(i.processPlaceNm)+"</td><td>"+_pv(i.processPlaceAddr)+"</td></tr></table>"+
    "<div class='sc'>유통과정 정보</div>"+
    "<div class='flow'><span class='st'>사육</span><span class='ar'>›</span><span class='st'>도축</span><span class='ar'>›</span><span class='st'>가공</span><span class='ar'>›</span><span class='st cur'>판매</span></div>";
  }
  return "<style>"+
    "#trace-print-area{font-family:system-ui,'Malgun Gothic',sans-serif;color:#111827}"+
    "#trace-print-area .thead{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:14px}"+
    "#trace-print-area .tbox{display:flex;align-items:center;gap:16px;border:1px solid #cbd5e1;border-radius:6px;padding:14px 18px;margin-bottom:18px}"+
    "#trace-print-area .tbox .tl{color:#2563eb;font-weight:800;font-size:15px}"+
    "#trace-print-area .tbox .tn{border:2px solid #2563eb;border-radius:6px;padding:8px 22px;font-size:20px;font-weight:800;letter-spacing:1px}"+
    "#trace-print-area .brand{font-size:17px;font-weight:800;margin-bottom:14px}"+
    "#trace-print-area .sc{font-size:14px;font-weight:800;border-bottom:2px solid #16a34a;padding-bottom:5px;margin:16px 0 0}"+
    "#trace-print-area .sc em{font-size:11px;color:#ea580c;font-weight:600;font-style:normal;margin-left:6px}"+
    "#trace-print-area table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}"+
    "#trace-print-area th,#trace-print-area td{border:1px solid #e5e7eb;padding:8px 10px;text-align:left;vertical-align:middle}"+
    "#trace-print-area th{background:#f8fafc;color:#374151;font-weight:700;white-space:nowrap;width:120px}"+
    "#trace-print-area .note{color:#dc2626;font-size:11px;text-align:center;margin-top:18px}"+
    "#trace-print-area .flow{display:flex;align-items:center;justify-content:center;gap:6px;padding:22px 0}"+
    "#trace-print-area .flow .st{width:74px;height:74px;border-radius:50%;border:2px solid #cbd5e1;color:#6b7280;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}"+
    "#trace-print-area .flow .st.cur{background:#16a34a;border-color:#16a34a;color:#fff}"+
    "#trace-print-area .flow .ar{color:#9ca3af;font-size:22px;font-weight:800}"+
    "</style><div class='doc'>"+inner+"</div>";
}
function _printTrace(){
  const i=_curTraceInfo;
  if(!i || !(i.source==="import"||i.butcheryPlaceNm||i.farmerNm||i.processPlaceNm)){ alert("출력할 이력정보가 없습니다."); return; }
  let a=document.getElementById("trace-print-area");
  if(!a){ a=document.createElement("div"); a.id="trace-print-area"; document.body.appendChild(a); }
  a.innerHTML=_printDoc(i);
  const old=document.title;
  document.title="축산물이력_"+String(_curTraceNo||"").replace(/[^0-9A-Za-z]/g,"");
  document.body.classList.add("trace-printing");
  window.print();
  setTimeout(function(){ document.body.classList.remove("trace-printing"); document.title=old; }, 800);
}
async function openTrace(no){ const t=String(no||"").trim(); if(!t) return; _curTraceNo=t; const m=_tm(),body=m.querySelector("#trace-body"); body.innerHTML="<div style='color:#6b7280;padding:20px;text-align:center'>이력번호 "+esc(t)+"<br>조회 중...</div>"; m.style.display="flex";
  try{ const r=await fetch(TRACE_FN+"?traceNo="+encodeURIComponent(t),{headers:{Authorization:"Bearer "+ANON_KEY,apikey:ANON_KEY},signal:AbortSignal.timeout(30000)}); const b=await r.json(),i=b.info||{}; _curTraceInfo=i;
    if((b.source||i.source)==="import"){ body.innerHTML=_importBody(t,i); return; }
    if(!b.ok){ body.innerHTML="<div style='padding:6px 2px'>이 번호의 <b>국내</b> 이력정보가 없습니다.</div><div style='margin-top:12px'><a href='https://www.meatwatch.go.kr' target='_blank' style='display:block;text-align:center;padding:12px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:700'>수입 이력 조회(MEATWATCH)</a></div>"; return; }
    body.innerHTML="<div style='font-size:15px;font-weight:800;margin-bottom:6px'>이력번호 "+esc(t)+"</div>"+_trow("축종",_species(i.species))+_trow("🔪 도축장",i.butcheryPlaceNm)+_trow("도축장 주소",i.butcheryPlaceAddr)+_trow("도축일자",_ymd(i.butcheryYmd))+_trow("도축검사",i.butcheryResult==="Y"?"합격":i.butcheryResult)+_trow("등급",i.grade)+_trow("🏠 농장주소",i.farmAddr)+_trow("사육자",i.farmerNm)+_trow("포장처리업소",i.processPlaceNm);
  }catch(e){ body.innerHTML="<div style='padding:10px;color:#b91c1c'>조회 실패: "+esc(e.name==="TimeoutError"?"시간 초과":e.message)+"</div>"; } }
document.addEventListener("click",function(e){ const a=e.target.closest&&e.target.closest(".tracelink"); if(a){ e.preventDefault(); openTrace(a.dataset.no); } });
</script>
</body>
</html>
