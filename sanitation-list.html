<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>정육일지 목록</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 10px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .bar a { flex:1; text-align:center; padding:12px; border-radius:10px; background:#e5e7eb; color:#111827; text-decoration:none; font-weight:700; }
  .bar a.g { background:#16a34a; color:#fff; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .filters button { padding:8px 12px; border:1px solid #d1d5db; border-radius:999px; background:#fff; font-weight:700; cursor:pointer; }
  .filters button.on { background:#111827; color:#fff; border-color:#111827; }
  .range { display:flex; gap:6px; margin-bottom:10px; }
  .range input { flex:1; padding:8px; border:1px solid #d1d5db; border-radius:8px; }
  #q { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; margin-bottom:12px; }
  .card { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; justify-content:space-between; align-items:center; }
  .card .l b { font-size:15px; } .card .l small { color:#6b7280; display:block; }
  .card button { padding:8px 12px; border:none; border-radius:8px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; }
  .muted { color:#6b7280; padding:14px; text-align:center; }
  /* 상세 */
  #detail { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .back { color:#2563eb; cursor:pointer; font-weight:700; display:inline-block; margin-bottom:10px; }
  .dh { display:flex; gap:16px; flex-wrap:wrap; border-bottom:2px solid #111827; padding-bottom:10px; margin-bottom:12px; }
  .dh div small { color:#6b7280; display:block; font-size:12px; } .dh div b { font-size:16px; }
  .sec { margin-bottom:14px; } .sec h3 { font-size:15px; margin:0 0 6px; border-left:4px solid #16a34a; padding-left:8px; }
  .chk { display:inline-block; width:48%; padding:4px 0; font-size:14px; }
  .ok { color:#166534; } .no { color:#9ca3af; }
  .sig { display:flex; gap:20px; margin-top:12px; border-top:1px solid #e5e7eb; padding-top:10px; }
  @media print { .noprint{display:none!important;} body{background:#fff;padding:0;} #detail{box-shadow:none;} }
</style>
</head>
<body>
<script src="header.js"></script>
  <h1>📚 정육일지 목록</h1>
  <div class="bar noprint"><a href="sanitation.html" class="g">📋 오늘 작성</a></div>

  <div id="listView">
    <div class="filters noprint">
      <button data-p="today">오늘</button>
      <button data-p="week" class="on">이번주</button>
      <button data-p="month">이번달</button>
      <button data-p="all">전체</button>
    </div>
    <div class="range noprint"><input id="from" type="date"><input id="to" type="date"><button onclick="applyRange()" style="padding:8px 12px;border:none;border-radius:8px;background:#111827;color:#fff;font-weight:700">조회</button></div>
    <input id="q" class="noprint" placeholder="담당자 검색" />
    <div id="list"><p class="muted">불러오는 중...</p></div>
  </div>

  <div id="detailView" style="display:none">
    <span class="back noprint" id="back">‹ 목록</span>
    <div id="detail"></div>
    <button class="noprint" style="display:block;width:100%;margin-top:12px;padding:16px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;font-size:16px" id="printBtn">🖨️ 인쇄 / PDF 저장</button>
  </div>

<script>
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const ANON_KEY = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const TENANT_ID = window.MEATOS_TENANT || "881f6cc1-b552-468c-b9b4-152edb464e61";
const H = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
function pad(n){ return String(n).padStart(2,"0"); }
function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

let ALL = [];
function periodRange(p){
  const now=new Date(); const t=fmt(now);
  if(p==="today") return [t,t];
  if(p==="week"){ const d=new Date(now); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return [fmt(d), t]; }
  if(p==="month"){ return [fmt(new Date(now.getFullYear(),now.getMonth(),1)), t]; }
  return [null,null]; // all
}
async function loadRange(from,to){
  let url=REST+"/daily_sanitation_logs?tenant_id=eq."+TENANT_ID+"&select=id,work_date,worker_name,work_shift,created_at&order=work_date.desc,created_at.desc&limit=500";
  if(from) url+="&work_date=gte."+from;
  if(to) url+="&work_date=lte."+to;
  try{
    const r=await fetch(url,{headers:H}); if(!r.ok) throw new Error("HTTP "+r.status);
    ALL=await r.json(); renderList(ALL);
  }catch(e){ document.getElementById("list").innerHTML="<p class='muted'>불러오기 실패: "+esc(e.message)+"</p>"; }
}
function renderList(rows){
  const el=document.getElementById("list");
  if(!rows.length){ el.innerHTML="<p class='muted'>작성된 정육일지가 없습니다.</p>"; return; }
  el.innerHTML=rows.map(r=>"<div class='card'><div class='l'><b>"+esc(r.work_date)+"</b><small>담당자 "+esc(r.worker_name||"-")+" · "+esc(r.work_shift||"")+"</small></div><button data-id='"+r.id+"'>보기</button></div>").join("");
  el.querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>openDetail(b.dataset.id)));
}
document.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  const [f,t]=periodRange(b.dataset.p); loadRange(f,t);
}));
function applyRange(){ const f=document.getElementById("from").value||null, t=document.getElementById("to").value||null; document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("on")); loadRange(f,t); }
document.getElementById("q").addEventListener("input",e=>{ const q=e.target.value.trim(); renderList(q?ALL.filter(r=>String(r.worker_name||"").includes(q)):ALL); });

const SEC=[["check_personal","① 개인 위생"],["check_equipment","② 작업장 위생"],["check_inventory","④ 원료육 점검"],["check_store","⑤ 매장 위생"],["check_sale","⑥ 판매 전 점검"]];
function secHtml(title,obj){
  const items=Object.keys(obj||{});
  if(!items.length) return "";
  return "<div class='sec'><h3>"+esc(title)+"</h3>"+items.map(k=>"<span class='chk "+(obj[k]?"ok":"no")+"'>"+(obj[k]?"☑":"☐")+" "+esc(k)+"</span>").join("")+"</div>";
}
async function openDetail(id){
  const d=ALL.find(x=>x.id===id);
  const det=document.getElementById("detail"); det.innerHTML="<p class='muted'>불러오는 중...</p>";
  document.getElementById("listView").style.display="none"; document.getElementById("detailView").style.display="block"; window.scrollTo(0,0);
  try{
    const r=await fetch(REST+"/daily_sanitation_logs?id=eq."+id+"&select=*",{headers:H});
    const m=(await r.json())[0]; if(!m){ det.innerHTML="<p class='muted'>기록을 찾을 수 없습니다.</p>"; return; }
    det.dataset.date=m.work_date;
    let html="<div style='text-align:center;font-size:20px;font-weight:800;margin-bottom:8px'>정육일지 (위생·작업 점검)</div>";
    html+="<div class='dh'><div><small>작성일</small><b>"+esc(m.work_date)+"</b></div><div><small>담당자</small><b>"+esc(m.worker_name||"-")+"</b></div><div><small>근무조</small><b>"+esc(m.work_shift||"-")+"</b></div></div>";
    html+=secHtml(SEC[0][1],m.check_personal)+secHtml(SEC[1][1],m.check_equipment);
    html+="<div class='sec'><h3>③ 냉장고 점검</h3><span class='chk'>냉장 "+(m.fridge_temp!=null?m.fridge_temp+"℃":"-")+"</span><span class='chk'>냉동 "+(m.freezer_temp!=null?m.freezer_temp+"℃":"-")+"</span><span class='chk "+((m.check_refrigerator&&m.check_refrigerator["온도 정상"])?"ok":"no")+"'>"+((m.check_refrigerator&&m.check_refrigerator["온도 정상"])?"☑":"☐")+" 온도 정상</span></div>";
    html+=secHtml(SEC[2][1],m.check_inventory)+secHtml(SEC[3][1],m.check_store)+secHtml(SEC[4][1],m.check_sale);
    if(m.ai_snapshot) html+="<div class='sec'><h3>⑦ AI 자동 점검</h3><span class='chk'>유통기한 임박 "+esc(m.ai_snapshot.expiry||"-")+"</span><span class='chk'>OCR 검토 "+esc(m.ai_snapshot.ocr||"-")+"</span></div>";
    if(m.memo) html+="<div class='sec'><h3>⑧ 특이사항</h3><div style='font-size:14px'>"+esc(m.memo)+"</div></div>";
    const sg=m.signature||{};
    html+="<div class='sig'><div>담당자: <b>"+esc(sg.worker||"-")+"</b></div><div>관리자: <b>"+esc(sg.manager||"-")+"</b></div></div>";
    html+="<div style='text-align:right;color:#6b7280;font-size:12px;margin-top:8px'>출력일 "+fmt(new Date())+" · MEATOS</div>";
    det.innerHTML=html;
  }catch(e){ det.innerHTML="<p class='muted'>실패: "+esc(e.message)+"</p>"; }
}
document.getElementById("back").addEventListener("click",()=>{ document.getElementById("detailView").style.display="none"; document.getElementById("listView").style.display="block"; });
document.getElementById("printBtn").addEventListener("click",()=>{ const dt=document.getElementById("detail").dataset.date||fmt(new Date()); const old=document.title; document.title="정육일지_"+dt.replace(/-/g,""); window.print(); setTimeout(()=>document.title=old,500); });

// 기본: 이번주
(function(){ const [f,t]=periodRange("week"); loadRange(f,t); })();
</script>
</body>
</html>
