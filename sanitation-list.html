<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>축산물 월별 위생 점검표 · 정육비서</title>
  <style>
    :root {
      --brand:#c91624; --ink:#172033; --muted:#687386; --line:#dfe4eb;
      --surface:#fff; --page:#f4f6f9; --good:#16803c; --normal:#b66a00;
      --bad:#c91624; --blue:#2367d1;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; }
    button { font:inherit; }
    .page { width:min(1480px,calc(100% - 28px)); margin:0 auto; padding:22px 0 46px; }
    .hero,.summary-card,.sheet,.advice { background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 8px 28px rgba(23,32,51,.06); }
    .hero { padding:20px 22px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; }
    h1 { margin:0 0 5px; font-size:clamp(22px,3vw,32px); letter-spacing:-.04em; }
    .sub { margin:0; color:var(--muted); }
    .month-nav { display:flex; align-items:center; gap:10px; }
    .month-nav button { width:44px; height:44px; border:1px solid #ccd4df; border-radius:12px; background:#fff; font-size:24px; cursor:pointer; }
    #month-label { min-width:132px; text-align:center; font-size:21px; font-weight:900; }
    .actions { justify-self:end; display:flex; gap:8px; }
    .btn { min-height:44px; border:0; border-radius:11px; padding:0 15px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    .btn-secondary { background:#edf1f6; color:var(--ink); }
    .btn-primary { background:var(--brand); color:#fff; }
    .btn-blue { background:var(--blue); color:#fff; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
    .summary-card { padding:16px; text-align:center; }
    .summary-card span { display:block; color:var(--muted); font-size:13px; font-weight:700; }
    .summary-card strong { display:block; margin-top:4px; font-size:27px; letter-spacing:-.03em; }
    .summary-card.target strong { color:var(--good); }
    .summary-card.warn strong { color:var(--bad); }
    .sheet { overflow:hidden; }
    .sheet-title { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line); }
    .sheet-title h2 { margin:0; font-size:18px; }
    .sheet-title small { color:var(--muted); }
    .table-scroll { overflow:auto; max-height:68vh; }
    table { border-collapse:separate; border-spacing:0; min-width:1550px; width:100%; }
    th,td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:7px 4px; text-align:center; font-size:12px; }
    thead th { position:sticky; top:0; z-index:4; background:#edf1f6; color:#465164; }
    th.item-head,td.item-name { position:sticky; left:0; z-index:3; min-width:238px; max-width:238px; text-align:left; padding-left:10px; background:#fff; font-weight:750; }
    thead th.item-head { z-index:6; background:#e8edf4; }
    td.item-name small { display:block; color:var(--muted); margin-bottom:2px; }
    td.score-cell { min-width:39px; font-weight:900; }
    .score-10 { color:var(--good); background:#f0fbf3; }
    .score-5 { color:var(--normal); background:#fff9ec; }
    .score-1 { color:var(--bad); background:#fff1f2; }
    .daily-total th,.daily-total td { background:#f7f9fc; font-weight:900; }
    .daily-total th { position:sticky; left:0; z-index:3; text-align:left; padding-left:10px; }
    .daily-total td.target { color:var(--good); }
    .daily-total td.low { color:var(--bad); }
    .advice { margin-top:14px; padding:18px 20px; }
    .advice h2 { margin:0 0 8px; font-size:18px; }
    #ai-advice { border-left:4px solid var(--blue); background:#f1f6ff; color:#24436f; padding:14px 16px; border-radius:10px; line-height:1.6; font-weight:750; }
    .method { margin-top:10px; color:var(--muted); font-size:13px; line-height:1.55; }
    .loading { padding:30px; text-align:center; color:var(--muted); }
    .mobile-calendar-wrap { display:none; }
    .mobile-calendar {
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:7px;
      padding:14px;
    }
    .calendar-weekday { padding:5px 0; text-align:center; color:var(--muted); font-size:12px; font-weight:850; }
    .calendar-day {
      position:relative;
      min-height:68px;
      padding:8px 5px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      color:var(--ink);
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      font-weight:850;
    }
    .calendar-day.empty { visibility:hidden; pointer-events:none; }
    .calendar-day.today { border:2px solid var(--blue); }
    .calendar-day.completed { border-color:var(--blue); background:var(--blue); color:#fff; box-shadow:0 5px 12px rgba(35,103,209,.22); }
    .calendar-day.low { background:var(--blue); border-color:var(--blue); }
    .calendar-date { font-size:13px; }
    .calendar-score { min-height:21px; font-size:15px; font-weight:950; }
    .calendar-day:not(.completed) .calendar-score { color:#a2aabb; font-size:11px; }
    .calendar-help { margin:0; padding:0 15px 15px; color:var(--muted); font-size:12px; line-height:1.5; text-align:center; }
    @page { size:A4 landscape; margin:8mm; }
    @media print {
      header,.mt-header,.guest-banner,.noprint { display:none!important; }
      .mobile-calendar-wrap { display:none!important; }
      .desktop-month-table { display:table!important; }
      body { background:#fff; }
      .page { width:100%; padding:0; }
      .hero,.summary-card,.sheet,.advice { box-shadow:none; border-radius:0; }
      .hero { display:block; padding:5px 8px; }
      h1 { font-size:18px; }
      .sub { font-size:10px; }
      .summary { margin:5px 0; gap:4px; }
      .summary-card { padding:5px; }
      .summary-card strong { font-size:16px; }
      .sheet-title { padding:5px 8px; }
      .table-scroll { overflow:visible; max-height:none; }
      table { min-width:0; table-layout:fixed; }
      th,td { font-size:6.5px; padding:2px 1px; }
      th.item-head,td.item-name { position:static; min-width:0; max-width:none; width:150px; padding-left:3px; }
      thead th { position:static; }
      td.score-cell { min-width:0; }
      .daily-total th { position:static; padding-left:3px; }
      .advice { margin-top:5px; padding:6px 8px; }
      .advice h2 { font-size:12px; margin-bottom:3px; }
      #ai-advice { padding:5px 7px; font-size:9px; }
      .method { font-size:8px; margin-top:3px; }
    }
    @media screen and (max-width:820px) {
      .page { width:calc(100% - 18px); padding-top:12px; }
      .hero { grid-template-columns:1fr; gap:13px; padding:17px 16px; }
      .hero h1 { font-size:23px; }
      .hero .sub { font-size:13px; line-height:1.5; }
      .month-nav { justify-content:center; }
      #month-label { font-size:20px; }
      .actions { justify-self:stretch; }
      .actions .btn { flex:1; padding:0 8px; font-size:13px; }
      .summary { grid-template-columns:repeat(2,1fr); }
      .summary-card { padding:12px 8px; }
      .summary-card strong { font-size:22px; }
      .sheet-title { padding:15px; }
      .sheet-title h2 { font-size:17px; }
      .sheet-title small { display:none; }
      .table-scroll { overflow:visible; max-height:none; }
      .desktop-month-table { display:none; }
      .mobile-calendar-wrap { display:block; }
      .advice { padding:16px; }
    }
  </style>
</head>
<body>
  <script src="header.js"></script>
  <main class="page">
    <section class="hero">
      <div>
        <h1>축산물 월별 위생 점검표</h1>
        <p class="sub">일별 평가가 자동 연동되며 날짜별 점수와 취약 항목을 한눈에 확인합니다.</p>
      </div>
      <div class="month-nav noprint" aria-label="조회 월 이동">
        <button id="previous-month" type="button" aria-label="이전 달">‹</button>
        <strong id="month-label"></strong>
        <button id="next-month" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="actions noprint">
        <a class="btn btn-secondary" href="sanitation.html">축산물 일일 위생 점검표</a>
        <button class="btn btn-blue" id="print-button" type="button">축산물 월별 위생 점검표 인쇄</button>
      </div>
    </section>

    <section class="summary">
      <div class="summary-card"><span>점검 완료일</span><strong id="completed-days">0일</strong></div>
      <div class="summary-card"><span>월 누적 점수</span><strong id="accumulated-score">0점</strong></div>
      <div class="summary-card target"><span>월 평균</span><strong id="average-score">-</strong></div>
      <div class="summary-card warn"><span>80점 미만</span><strong id="low-days">0일</strong></div>
    </section>

    <section class="sheet">
      <div class="sheet-title">
        <h2 id="print-title">축산물 월별 위생 점검표</h2>
        <small>1=매우 잘됨(10점) · 2=보통(5점) · 3=불량(1점)</small>
      </div>
      <div class="table-scroll" id="table-host"><div class="loading">축산물 월별 위생 점검표를 불러오는 중입니다.</div></div>
    </section>

    <section class="advice">
      <h2>AI 월간 위생관리 조언</h2>
      <div id="ai-advice">점검 기록을 분석하는 중입니다.</div>
      <div class="method">80점 이상을 목표로 하되, 총점이 높아도 1점 항목은 즉시 개선 대상으로 관리하세요. 점검 누락일도 위생관리 공백으로 확인해야 합니다.</div>
    </section>
  </main>

  <script src="src/data/sanitation-scoring.js"></script>
  <script>
    const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
    const TENANT_ID = window.MEATOS_TENANT || "881f6cc1-b552-468c-b9b4-152edb464e61";
    const H = window.MEATOS_API_HEADERS;
    const scoring = window.MEATOS_SANITATION;
    const byId = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
    let cursor = new Date();
    cursor = new Date(cursor.getFullYear(), cursor.getMonth(), 1);

    function pad(value) { return String(value).padStart(2, "0"); }
    function monthKey() { return `${cursor.getFullYear()}-${pad(cursor.getMonth() + 1)}`; }
    function monthRange() {
      const start = `${monthKey()}-01`;
      const endDate = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
      return { start, end:`${monthKey()}-${pad(endDate.getDate())}`, days:endDate.getDate() };
    }
    function latestByDate(rows) {
      const result = new Map();
      (rows || []).forEach((row) => {
        const current = result.get(row.work_date);
        if (!current || String(row.created_at || "") > String(current.created_at || "")) result.set(row.work_date, row);
      });
      return result;
    }
    function scoreFor(row, itemId) {
      const item = Array.isArray(row?.evaluation_items)
        ? row.evaluation_items.find((entry) => entry?.id === itemId)
        : null;
      return Number(item?.points) || 0;
    }
    function scoreClass(points) { return points === 10 ? "score-10" : points === 5 ? "score-5" : points === 1 ? "score-1" : ""; }
    function ratingFor(row, itemId) {
      const item = Array.isArray(row?.evaluation_items)
        ? row.evaluation_items.find((entry) => entry?.id === itemId)
        : null;
      return Number(item?.rating) || "";
    }

    function render(rows) {
      const range = monthRange();
      const logs = latestByDate(rows);
      const valid = [...logs.values()].filter((row) => Number.isFinite(Number(row.total_score)));
      const total = valid.reduce((sum, row) => sum + Number(row.total_score || 0), 0);
      const average = valid.length ? total / valid.length : 0;
      const lowDays = valid.filter((row) => Number(row.total_score) < 80).length;
      byId("completed-days").textContent = `${valid.length}일`;
      byId("accumulated-score").textContent = `${total.toLocaleString("ko-KR")}점`;
      byId("average-score").textContent = valid.length ? `${average.toFixed(1)}점` : "-";
      byId("low-days").textContent = `${lowDays}일`;

      const dayHeaders = Array.from({length:range.days}, (_, index) => `<th>${index + 1}</th>`).join("");
      const bodyRows = scoring.ITEMS.map((item) => {
        const cells = Array.from({length:range.days}, (_, index) => {
          const day = `${monthKey()}-${pad(index + 1)}`;
          const row = logs.get(day);
          const points = scoreFor(row, item.id);
          const rating = ratingFor(row, item.id);
          const title = points ? `${day} · ${item.short} · ${rating}번(${points}점)` : `${day} · 미작성`;
          return `<td class="score-cell ${scoreClass(points)}" title="${esc(title)}">${points || ""}</td>`;
        }).join("");
        return `<tr><td class="item-name"><small>${esc(item.group)}</small>${esc(item.text)}</td>${cells}</tr>`;
      }).join("");
      const totalCells = Array.from({length:range.days}, (_, index) => {
        const day = `${monthKey()}-${pad(index + 1)}`;
        const score = Number(logs.get(day)?.total_score);
        return `<td class="${Number.isFinite(score) ? (score >= 80 ? "target" : "low") : ""}">${Number.isFinite(score) ? score : ""}</td>`;
      }).join("");

      const weekdayHeaders = ["일","월","화","수","목","금","토"]
        .map((day) => `<div class="calendar-weekday">${day}</div>`).join("");
      const firstWeekday = new Date(cursor.getFullYear(), cursor.getMonth(), 1).getDay();
      const leadingBlanks = Array.from({length:firstWeekday}, () => '<span class="calendar-day empty" aria-hidden="true"></span>').join("");
      const todayKey = (() => {
        const today = new Date();
        return `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
      })();
      const calendarDays = Array.from({length:range.days}, (_, index) => {
        const dayNumber = index + 1;
        const day = `${monthKey()}-${pad(dayNumber)}`;
        const row = logs.get(day);
        const score = Number(row?.total_score);
        const completed = Number.isFinite(score);
        const classes = ["calendar-day", completed ? "completed" : "", completed && score < 80 ? "low" : "", day === todayKey ? "today" : ""].filter(Boolean).join(" ");
        const label = completed ? `${dayNumber}일, 축산물 일일 위생 점검표 ${score}점, 상세 보기` : `${dayNumber}일, 미점검, 축산물 일일 위생 점검표 열기`;
        return `<a class="${classes}" href="sanitation.html?date=${day}" aria-label="${esc(label)}">
          <span class="calendar-date">${dayNumber}</span>
          <strong class="calendar-score">${completed ? `${score}점` : "미점검"}</strong>
        </a>`;
      }).join("");

      byId("table-host").innerHTML = `<div class="mobile-calendar-wrap" aria-label="${esc(byId("print-title").textContent)} 달력">
        <div class="mobile-calendar">${weekdayHeaders}${leadingBlanks}${calendarDays}</div>
        <p class="calendar-help">파란색 날짜는 점검이 완료된 날입니다. 날짜를 누르면 해당 축산물 일일 위생 점검표를 확인할 수 있습니다.</p>
      </div>
      <table class="desktop-month-table" aria-label="${esc(byId("print-title").textContent)}">
        <thead><tr><th class="item-head">점검 항목 / 날짜</th>${dayHeaders}</tr></thead>
        <tbody>${bodyRows}<tr class="daily-total"><th>일일 총점 / 100점</th>${totalCells}</tr></tbody>
      </table>`;

      const advice = scoring.monthlyAdvice(valid);
      const missingText = valid.length < range.days ? ` · 이달 현재 점검 완료 ${valid.length}일입니다.` : "";
      byId("ai-advice").textContent = advice + missingText;
    }

    async function loadMonth() {
      const ym = monthKey();
      const range = monthRange();
      byId("month-label").textContent = `${cursor.getFullYear()}년 ${cursor.getMonth() + 1}월`;
      byId("print-title").textContent = `${cursor.getFullYear()}년 ${cursor.getMonth() + 1}월 축산물 월별 위생 점검표`;
      byId("table-host").innerHTML = '<div class="loading">축산물 월별 위생 점검표를 불러오는 중입니다.</div>';
      try {
        const url = `${REST}/daily_sanitation_logs?tenant_id=eq.${TENANT_ID}&work_date=gte.${range.start}&work_date=lte.${range.end}&select=id,work_date,worker_name,evaluation_items,total_score,ai_advice,created_at&order=work_date.asc,created_at.desc`;
        const response = await fetch(url, { headers:H });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        byId("table-host").innerHTML = `<div class="loading">불러오기 실패: ${esc(error.message)}</div>`;
        byId("ai-advice").textContent = "AI 조언: 월별 데이터를 불러온 뒤 취약 항목을 분석할 수 있습니다.";
      }
      document.title = `${ym.replace("-", "년 ")}월 축산물 월별 위생 점검표 · 정육비서`;
    }

    byId("previous-month").addEventListener("click", () => { cursor.setMonth(cursor.getMonth() - 1); loadMonth(); });
    byId("next-month").addEventListener("click", () => { cursor.setMonth(cursor.getMonth() + 1); loadMonth(); });
    byId("print-button").addEventListener("click", () => window.print());
    loadMonth();
  </script>
</body>
</html>
