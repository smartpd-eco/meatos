<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>거래명세서 스캔 (단순)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: #111827; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  button, label.filebtn { display: block; width: 100%; padding: 18px; font-size: 18px; font-weight: 700;
    border: none; border-radius: 12px; background: #16a34a; color: #fff; text-align: center; cursor: pointer; }
  input[type=file] { display: none; }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; background: #f9fafb; font-size: 15px; }
  .steps li b { margin-right: 8px; }
  .wait { color: #b45309; } .ok { color: #15803d; } .err { color: #b91c1c; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid #e5e7eb; padding: 8px 6px; text-align: left; }
  td.num, th.num { text-align: right; }
  .total { font-size: 18px; font-weight: 800; margin-top: 10px; }
  #preview { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
  .muted { color: #6b7280; font-size: 13px; }
  pre.raw { white-space: pre-wrap; font-size: 12px; background:#111827; color:#e5e7eb; padding:10px; border-radius:8px; overflow:auto; }
</style>
</head>
<body>
  <h1>거래명세서 스캔 · 단순 테스트</h1>

  <div class="card">
    <label class="filebtn" for="file">📷 사진 찍기 / 파일 선택</label>
    <input id="file" type="file" accept="image/*" capture="environment" />
    <img id="preview" alt="미리보기" />
    <p class="muted" id="hint">한 장을 선택하면 자동으로 서버 인식을 시작합니다.</p>
  </div>

  <div class="card">
    <ol class="steps" id="steps">
      <li id="s1"><b>①</b> 사진 선택 <span></span></li>
      <li id="s2"><b>②</b> 이미지 준비(축소) <span></span></li>
      <li id="s3"><b>③</b> 서버 인식(Gemini) <span></span></li>
      <li id="s4"><b>④</b> 결과 표시 <span></span></li>
    </ol>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div id="docFields" class="muted"></div>
    <table id="tbl">
      <thead><tr><th>품목</th><th class="num">수량</th><th class="num">단가</th><th class="num">공급가액</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="total" id="totalLine"></div>
    <details style="margin-top:10px"><summary class="muted">원본 응답(JSON) 보기</summary><pre class="raw" id="raw"></pre></details>
  </div>

<script>
// ---- 설정 (공개 값) ----
const FUNCTION_URL = "https://pkrsiqjzllyiafwpskll.functions.supabase.co/analyze-invoice";
const ANON_KEY = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const MAX_DIM = 1600;
const TIMEOUT_MS = 60000;

// ---- 옛 서비스워커/캐시 제거 (이 페이지는 캐시 안 씀) ----
(async () => {
  try {
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch (e) { /* ignore */ }
})();

const won = (v) => Number(v ?? 0).toLocaleString("ko-KR") + "원";
function setStep(id, text, cls) {
  const el = document.querySelector("#" + id + " span");
  el.textContent = text ? " — " + text : "";
  el.className = cls || "";
}

document.getElementById("file").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  ["s2","s3","s4"].forEach((s) => setStep(s, "", ""));
  document.getElementById("resultCard").style.display = "none";
  setStep("s1", file.name + " (" + Math.round(file.size/1024) + "KB)", "ok");

  // 미리보기 + 축소
  setStep("s2", "축소 중...", "wait");
  let dataUrl;
  try {
    dataUrl = await downscale(file);
    const img = document.getElementById("preview");
    img.src = dataUrl; img.style.display = "block";
    setStep("s2", "완료 (" + Math.round(dataUrl.length/1024) + "KB 전송)", "ok");
  } catch (e) {
    setStep("s2", "실패: " + e.message, "err"); return;
  }

  // 서버 인식
  setStep("s3", "인식 중... (최대 60초)", "wait");
  const t0 = performance.now();
  const timer = setInterval(() => setStep("s3", "인식 중... " + Math.round((performance.now()-t0)/1000) + "초", "wait"), 1000);
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    const res = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + ANON_KEY, "apikey": ANON_KEY },
      signal: ctrl.signal,
      body: JSON.stringify({ providerId: "gemini-2.5-flash", imageDataUrl: dataUrl, documentId: "scan", tenantId: "SMARTPD_DEV", supplierName: "", localOcrText: "", unresolvedFields: [] })
    });
    clearTimeout(to); clearInterval(timer);
    const bodyText = await res.text();
    let body; try { body = JSON.parse(bodyText); } catch { body = { raw: bodyText }; }
    if (!res.ok || body.ok === false) {
      setStep("s3", "서버 오류 " + res.status + ": " + (body.message || bodyText).slice(0,180), "err");
      document.getElementById("raw").textContent = bodyText;
      document.getElementById("resultCard").style.display = "block";
      document.querySelector("#tbl tbody").innerHTML = "";
      return;
    }
    setStep("s3", "완료 (" + Math.round((performance.now()-t0)/1000) + "초)", "ok");
    render(body.result || body);
  } catch (e) {
    clearInterval(timer);
    setStep("s3", (e.name === "AbortError" ? "시간 초과(60초)" : "실패: " + e.message), "err");
  }
});

async function downscale(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, MAX_DIM / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  return c.toDataURL("image/jpeg", 0.85);
}

function render(result) {
  const items = Array.isArray(result.lineItems) ? result.lineItems : [];
  const f = result.documentFields || {};
  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = "";
  items.forEach((it) => {
    const tr = document.createElement("tr");
    const name = [it.rawProductName, it.origin].filter(Boolean).join(" · ");
    tr.innerHTML = "<td>" + esc(name || "-") + "</td>"
      + "<td class='num'>" + esc((it.quantity ?? "") + " " + (it.unit ?? "")) + "</td>"
      + "<td class='num'>" + (it.unitPrice != null ? won(it.unitPrice) : "-") + "</td>"
      + "<td class='num'>" + (it.supplyAmount != null ? won(it.supplyAmount) : "-") + "</td>";
    tbody.appendChild(tr);
  });
  document.getElementById("docFields").textContent =
    "공급자: " + (f.supplierName || "-") + " | 일자: " + (f.invoiceDate || "-");
  document.getElementById("totalLine").textContent = "문서 합계: " + won(f.totalAmount);
  document.getElementById("raw").textContent = JSON.stringify(result, null, 2);
  document.getElementById("resultCard").style.display = "block";
  setStep("s4", items.length + "개 품목 표시", items.length ? "ok" : "err");
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[m])); }
</script>
</body>
</html>
