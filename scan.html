<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>거래명세서 스캔</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: #111827; padding: 14px; }
  h1 { font-size: 19px; margin: 2px 0 12px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label.filebtn { display: block; width: 100%; padding: 18px; font-size: 18px; font-weight: 700;
    border: none; border-radius: 12px; background: #16a34a; color: #fff; text-align: center; cursor: pointer; }
  input[type=file] { display: none; }
  .steps { list-style: none; padding: 0; margin: 0; display:flex; flex-wrap:wrap; gap:6px; }
  .steps li { padding: 6px 10px; border-radius: 999px; background: #f1f5f9; font-size: 12px; color:#475569; }
  .steps li.wait { background:#fef3c7; color:#92400e; } .steps li.ok { background:#dcfce7; color:#166534; } .steps li.err { background:#fee2e2; color:#991b1b; }
  #preview { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
  .muted { color: #6b7280; font-size: 13px; }

  /* 거래명세서 양식 */
  .invoice { border: 2px solid #b91c1c; border-radius: 8px; overflow: hidden; }
  .invoice-title { background:#b91c1c; color:#fff; text-align:center; font-size:18px; font-weight:800; padding:8px; letter-spacing:4px; }
  .invoice-head { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid #e5e7eb; }
  .invoice-head > div { padding:8px 10px; font-size:13px; }
  .invoice-head > div + div { border-left:1px solid #f1f5f9; }
  .invoice-head b { display:block; color:#6b7280; font-weight:600; font-size:11px; margin-bottom:2px; }
  .invoice-head .val { font-size:15px; font-weight:700; }
  .tbl-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  th, td { border:1px solid #e5e7eb; padding:7px 6px; text-align:center; white-space:nowrap; }
  th { background:#fef2f2; color:#7f1d1d; font-weight:700; }
  td.name { text-align:left; white-space:normal; min-width:150px; }
  td.num { text-align:right; }
  tr.mismatch td { background:#fff7ed; }
  td[contenteditable] { cursor: text; }
  td[contenteditable]:hover { background:#fffef0; }
  td[contenteditable]:focus { background:#fef9c3; outline:none; box-shadow: inset 0 0 0 2px #eab308; }
  .tracelink { color:#2563eb; text-decoration:none; font-weight:700; white-space:nowrap; }
  .edit-hint { font-size:12px; color:#2563eb; padding:6px 4px 0; }
  tfoot td { font-weight:800; background:#f9fafb; }
  .foot-note { font-size:12px; color:#92400e; padding:8px 4px 0; }
  .badge-ok { color:#166534; } .badge-warn { color:#b45309; }
  #trace-print-area { display:none; }
  @media print {
    body.trace-printing > *:not(#trace-print-area) { display:none !important; }
    #trace-print-area { display:block !important; padding:8px 4px; }
  }
</style>
</head>
<body>
  <h1>📄 거래명세서 스캔</h1>
  <div style="margin:-6px 0 12px"><a href="records.html" style="color:#2563eb;text-decoration:none;font-weight:700">📋 저장된 명세서 목록 보기 ›</a></div>

  <div class="card">
    <label class="filebtn" for="file">📷 사진 찍기 / 파일 선택</label>
    <input id="file" type="file" accept="image/*" />
    <img id="preview" alt="미리보기" />
    <ul class="steps" id="steps" style="margin-top:12px">
      <li id="s1">① 사진</li><li id="s2">② 준비</li><li id="s3">③ 인식</li><li id="s4">④ 표시</li>
    </ul>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="invoice">
      <div class="invoice-title">거 래 명 세 서</div>
      <div class="invoice-head">
        <div><b>공급자</b><span class="val" id="f-supplier">-</span></div>
        <div><b>거래일자</b><span class="val" id="f-date">-</span></div>
      </div>
      <div class="tbl-wrap">
        <table id="tbl">
          <thead><tr>
            <th>No</th><th>상품명 및 등급</th><th>원산지</th><th>단위</th>
            <th>중량(kg)</th><th>단가</th><th>공급가액</th><th>이력번호</th>
          </tr></thead>
          <tbody></tbody>
          <tfoot>
            <tr><td colspan="6">합계금액</td><td class="num" id="f-total">-</td><td></td></tr>
          </tfoot>
        </table>
      </div>
    </div>
    <div class="edit-hint">✏️ 값이 틀리면 셀을 눌러 바로 고치세요. 중량·단가를 고치면 공급가액이 자동 계산됩니다.</div>
  <div class="foot-note" id="f-note"></div>
    <button id="saveBtn" style="display:block;width:100%;margin-top:14px;padding:16px;font-size:17px;font-weight:700;border:none;border-radius:12px;background:#2563eb;color:#fff;cursor:pointer">💾 저장 + 재고 반영</button>
    <div id="saveMsg" class="muted" style="margin-top:8px"></div>
    <details style="margin-top:10px"><summary class="muted">원본 응답(JSON)</summary><pre style="white-space:pre-wrap;font-size:11px" id="raw"></pre></details>
  </div>

<script>
const FUNCTION_URL = "https://pkrsiqjzllyiafwpskll.functions.supabase.co/analyze-invoice";
const ANON_KEY = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const MAX_DIM = 1600, TIMEOUT_MS = 60000;

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

let LINES = [];
let DOC = {};
let FILE_NAME = "scan.jpg";
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const TENANT_ID = "881f6cc1-b552-468c-b9b4-152edb464e61"; // SMARTPD_DEV
const won = (v) => v == null || v === "" ? "-" : Number(v).toLocaleString("ko-KR");
const num = (s) => Number(String(s).replace(/[^0-9.]/g, "")) || 0;

// 셀 직접 수정(검수): 값을 고치면 메모리에 반영, 중량·단가 수정 시 공급가액 자동 계산
document.querySelector("#tbl tbody").addEventListener("input", (e) => {
  const td = e.target.closest("td[data-f]"); if (!td) return;
  const r = +td.dataset.r, f = td.dataset.f; if (!LINES[r]) return;
  LINES[r][f] = ["quantity","unitPrice","supplyAmount"].includes(f) ? num(td.textContent) : td.textContent.trim();
  if (f === "quantity" || f === "unitPrice") {
    const sup = Math.round((Number(LINES[r].quantity)||0) * (Number(LINES[r].unitPrice)||0));
    LINES[r].supplyAmount = sup;
    const cell = document.querySelector("#tbl tbody tr[data-r='"+r+"'] td[data-f='supplyAmount']");
    if (cell && document.activeElement !== cell) cell.textContent = won(sup);
  }
});

// 매입 저장: ocr_document + ocr_line_item 에 기록
document.getElementById("saveBtn").addEventListener("click", async () => {
  const btn = document.getElementById("saveBtn"), msg = document.getElementById("saveMsg");
  if (!LINES.length) { msg.style.color = "#b91c1c"; msg.textContent = "저장할 품목이 없습니다."; return; }
  btn.disabled = true; msg.style.color = "#6b7280"; msg.textContent = "저장 중...";
  const H = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY, "Content-Type": "application/json" };
  const code = "SCAN-" + Date.now();
  const dateOk = /^\d{4}-\d{2}-\d{2}$/.test(DOC.invoiceDate || "");
  const docRow = {
    tenant_id: TENANT_ID, document_code: code,
    original_file_path: "scan/" + code, original_file_hash: code,
    file_name: FILE_NAME, mime_type: "image/jpeg", document_status: "POSTED",
    parsed_json: { documentFields: DOC, lineItems: LINES },
    invoice_date: dateOk ? DOC.invoiceDate : null,
    total_amount: Number(DOC.totalAmount) || 0
  };
  try {
    const r1 = await fetch(REST + "/ocr_document", { method: "POST", headers: { ...H, Prefer: "return=representation" }, body: JSON.stringify(docRow) });
    const t1 = await r1.text();
    if (!r1.ok) throw new Error("문서 " + r1.status + ": " + t1.slice(0, 150));
    const docId = JSON.parse(t1)[0].id;
    const lineRows = LINES.map((it, i) => ({
      tenant_id: TENANT_ID, ocr_document_id: docId, line_no: i + 1,
      raw_product_name: (it.rawProductName && String(it.rawProductName).trim()) || "-",
      raw_quantity: Number(it.quantity) || 0, raw_unit: it.unit || null,
      raw_unit_price: Number(it.unitPrice) || 0, raw_amount: Number(it.supplyAmount) || 0,
      raw_origin: it.origin || null, raw_grade: it.grade || null,
      confidence: Number(it.confidence) || 0
    }));
    const r2 = await fetch(REST + "/ocr_line_item", { method: "POST", headers: H, body: JSON.stringify(lineRows) });
    if (!r2.ok) throw new Error("품목 " + r2.status + ": " + (await r2.text()).slice(0, 150));
    // 저장과 동시에 재고 반영(IN) + 도축일/유통기한 계산
    msg.textContent = "유통기한 계산 중...";
    const exp = await computeExpiryForLines(LINES, dateOk ? DOC.invoiceDate : null);
    const mv = LINES.map((it, i) => ({
      tenant_id: TENANT_ID, movement_type: "IN",
      raw_product_name: (it.rawProductName && String(it.rawProductName).trim()) || "-",
      origin: it.origin || null, unit: it.unit || null,
      quantity: Number(it.quantity) || 0, unit_price: Number(it.unitPrice) || 0, amount: Number(it.supplyAmount) || 0,
      trace_no: it.traceOrImportNo || null, supplier_name: DOC.supplierName || null,
      ocr_document_id: docId, ocr_line_no: i + 1, movement_date: dateOk ? DOC.invoiceDate : null,
      slaughter_date: exp[i].slaughter_date, expiry_date: exp[i].expiry_date
    }));
    const r3 = await fetch(REST + "/inventory_movement", { method: "POST", headers: H, body: JSON.stringify(mv) });
    if (!r3.ok) throw new Error("재고반영 " + r3.status + ": " + (await r3.text()).slice(0, 150));
    msg.style.color = "#166534"; msg.textContent = "✓ 저장 + 재고 반영 완료 · 품목 " + lineRows.length + "건";
  } catch (e) {
    msg.style.color = "#b91c1c"; msg.textContent = "저장 실패: " + e.message;
  } finally { btn.disabled = false; }
});
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
function step(id, cls){ const el=document.getElementById(id); el.className = cls||""; }

// 이력번호 → 축산물통합이력정보 조회 (앱 내 패널로 표시)
const TRACE_FN = "https://pkrsiqjzllyiafwpskll.functions.supabase.co/trace-lookup";
function _ymd(s){ s=String(s||""); return /^\d{8}$/.test(s) ? s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8) : s; }
function _trow(label,val){ return val ? "<div style='display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9'><span style='color:#6b7280'>"+label+"</span><b style='text-align:right'>"+esc(val)+"</b></div>" : ""; }
function _species(s){ return String(s||"").replace("PIG","돼지").replace("CATTLE","소").replace("|LOT_NO"," 묶음").replace("|PIG_NO"," 이력").replace("|CATTLE_NO"," 개체"); }
function _importBody(t,i){
  const warn=(i.salePrhibt==="Y"||i.recallTarget==="Y")?"<div style='background:#fee2e2;color:#b91c1c;border-radius:10px;padding:10px;font-weight:800;margin-bottom:8px'>⚠️ 판매금지·회수대상 이력입니다. 판매 전 확인하세요."+(i.recallContent?"<div style='font-weight:600;font-size:13px;margin-top:4px'>"+esc(i.recallContent)+"</div>":"")+"</div>":"";
  return "<div style='font-size:15px;font-weight:800;margin-bottom:2px'>이력번호 "+esc(t)+"</div>"+
    "<div style='display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;margin-bottom:8px'>🌍 수입 축산물</div>"+warn+
    _trow("품목", i.itemNm)+_trow("부위", i.partNm)+
    _trow("🌍 원산지", i.nationNm)+
    _trow("🔪 도축장", i.butcheryPlaceNm)+_trow("도축기간", i.butcheryYmd)+
    _trow("🏭 가공장", i.processPlaceNm)+_trow("가공기간", i.processYmd)+
    _trow("수출업체", i.exporterNm)+_trow("수입업체", i.importerNm)+
    _trow("B/L 번호", i.blNo)+_trow("소비기한", i.consumeYmd)+
    "<div style='margin-top:10px'><a href='https://www.meatwatch.go.kr' target='_blank' style='color:#2563eb;font-size:13px'>MEATWATCH 공식 조회 ›</a></div>";
}
function _traceModal(){
  let m=document.getElementById("trace-modal");
  if(!m){
    m=document.createElement("div"); m.id="trace-modal";
    m.style.cssText="position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px";
    m.innerHTML="<div style='background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:85vh;overflow:auto;padding:16px'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'><b style='font-size:17px'>🔎 축산물 이력정보</b><span style='display:flex;gap:6px'><button id='trace-print' onclick='_printTrace()' style='border:none;background:#2563eb;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700'>🖨️ 출력</button><button id='trace-close' style='border:none;background:#e5e7eb;border-radius:8px;padding:6px 12px;font-weight:700'>닫기</button></span></div><div id='trace-body'></div></div>";
    document.body.appendChild(m);
    m.addEventListener("click",function(e){ if(e.target===m) m.style.display="none"; });
    m.querySelector("#trace-close").addEventListener("click",function(){ m.style.display="none"; });
  }
  return m;
}
let _curTraceNo="", _curTraceInfo=null;
function _pv(v){ return (v==null||v==="")?"-":esc(v); }
function _printDoc(i){
  const now=new Date().toLocaleString("ko-KR",{year:"2-digit",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"});
  let inner;
  if(i.source==="import"){
    inner=
    "<div class='thead'><span>"+now+"</span><span>수입이력정보 조회</span></div>"+
    "<div class='tbox'><span class='tl'>이력번호</span><span class='tn'>"+_pv(i.traceNo)+"</span></div>"+
    "<div class='sc'>기본정보 <em>품목명은 수입신고시점의 품목정보입니다.</em></div>"+
    "<table><tr><th>이력번호</th><td>"+_pv(i.traceNo)+"</td><th>선하증권번호</th><td>"+_pv(i.blNo)+"</td></tr>"+
    "<tr><th>수입축산물 품목명</th><td colspan='3'>"+_pv(i.itemNm)+"</td></tr></table>"+
    "<div class='sc'>원산지정보</div>"+
    "<table><tr><th>원산지 국가</th><td colspan='3'>"+_pv(i.nationNm)+"</td></tr></table>"+
    "<div class='sc'>수입이력정보</div>"+
    "<table><tr><th>수출국 도축장</th><td>"+_pv(i.butcheryPlaceNm)+"</td><th>수출국 도축일자</th><td>"+_pv(_ymd(i.butcheryYmd))+"</td></tr>"+
    "<tr><th>수출국 가공장</th><td>"+_pv(i.processPlaceNm)+"</td><th>수출국 가공일자</th><td>"+_pv(i.processYmd)+"</td></tr>"+
    "<tr><th>수출업체</th><td>"+_pv(i.exporterNm)+"</td><th>수입업체</th><td>"+_pv(i.importerNm)+"</td></tr>"+
    "<tr><th>수입일자</th><td colspan='3'>"+_pv(i.importDt)+"</td></tr>"+
    "<tr><th>부위명(코드)</th><td colspan='3'>"+_pv(i.partNm)+(i.partCode?"("+esc(i.partCode)+")":"")+"</td></tr></table>"+
    "<p class='note'>※ 본 자료는 참고용 자료로서 법적 책임소재에 대한 증빙자료로 사용될 수 없습니다.</p>";
  } else {
    const sp=_species(i.species||"");
    inner=
    "<div class='thead'><span>"+now+"</span><span>이력번호 조회</span></div>"+
    "<div class='brand'><svg width='40' height='40' viewBox='0 0 100 100'><circle cx='50' cy='50' r='49' fill='#e60012'/><circle cx='50' cy='50' r='41' fill='none' stroke='#fff' stroke-width='2'/><text x='50' y='42' text-anchor='middle' fill='#fff' font-size='23' font-weight='900' font-family='sans-serif'>이력</text><text x='50' y='66' text-anchor='middle' fill='#fff' font-size='23' font-weight='900' font-family='sans-serif'>추적</text><text x='50' y='85' text-anchor='middle' fill='#fff' font-size='9' font-family='sans-serif'>Traceability</text></svg><span class='bt'>축산물이력제</span><span class='bsep'></span><span class='bsub'>"+_pv(sp)+" 이력번호 조회</span></div>"+
    "<div class='sc'>사육정보</div>"+
    "<table><tr><th>이력번호</th><td>"+_pv(i.traceNo)+"</td><th>농장식별번호</th><td>"+_pv(i.farmId)+"</td></tr>"+
    "<tr><th>농장경영자</th><td>"+_pv(i.farmerNm)+"</td><th>농장소재지</th><td>"+_pv(i.farmAddr)+"</td></tr>"+
    "<tr><th>축종</th><td colspan='3'>"+_pv(sp)+"</td></tr></table>"+
    "<div class='sc'>도축정보</div>"+
    "<table><tr><th>도축장</th><td>"+_pv(i.butcheryPlaceNm)+"</td><th>소재지</th><td>"+_pv(i.butcheryPlaceAddr)+"</td></tr>"+
    "<tr><th>도축일자</th><td>"+_pv(_ymd(i.butcheryYmd))+"</td><th>도축검사결과</th><td>"+(i.butcheryResult==="Y"?"합격":_pv(i.butcheryResult))+"</td></tr></table>"+
    ((i.grade||i.insfat)?("<div class='sc'>등급정보</div><table><tr><th>등급</th><td>"+_pv(i.grade)+"</td><th>근내지방도</th><td>"+_pv(i.insfat)+"</td></tr></table>"):"")+
    "<div class='sc'>식육포장처리 정보</div>"+
    "<table><tr><th>번호</th><th>업소명(등급)</th><th>소재지</th></tr>"+
    "<tr><td>1</td><td>"+_pv(i.processPlaceNm)+"</td><td>"+_pv(i.processPlaceAddr)+"</td></tr></table>"+
    "<div class='sc'>유통과정 정보</div>"+
    "<div class='flow'><span class='st'>사육</span><span class='ar'>›</span><span class='st'>도축</span><span class='ar'>›</span><span class='st'>가공</span><span class='ar'>›</span><span class='st cur'>판매</span></div>";
  }
  return "<style>"+
    "#trace-print-area{font-family:system-ui,'Malgun Gothic',sans-serif;color:#111827}"+
    "#trace-print-area .thead{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:14px}"+
    "#trace-print-area .tbox{display:flex;align-items:center;gap:16px;border:1px solid #cbd5e1;border-radius:6px;padding:14px 18px;margin-bottom:18px}"+
    "#trace-print-area .tbox .tl{color:#2563eb;font-weight:800;font-size:15px}"+
    "#trace-print-area .tbox .tn{border:2px solid #2563eb;border-radius:6px;padding:8px 22px;font-size:20px;font-weight:800;letter-spacing:1px}"+
    "#trace-print-area .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}"+
    "#trace-print-area .brand .bt{font-size:19px;font-weight:900;color:#1f2937}"+

let EXPIRY_POLICY = null;
async function loadExpiryPolicy(){
  if (EXPIRY_POLICY) return EXPIRY_POLICY;
  try {
    const r = await fetch(REST+"/expiry_policy?tenant_id=eq."+TENANT_ID+"&enabled=eq.true&select=species,part_name,storage_type,default_days",{headers:{apikey:ANON_KEY,Authorization:"Bearer "+ANON_KEY}});
    EXPIRY_POLICY = r.ok ? await r.json() : [];
  } catch(e){ EXPIRY_POLICY = []; }
  return EXPIRY_POLICY;
}
function normSpecies(s){ s=String(s||""); if(/돼지|돈|포크|pig/i.test(s)) return "돼지"; if(/한우|소|우|beef|cattle/i.test(s)) return "소"; if(/닭|계|치킨|chicken/i.test(s)) return "닭"; return ""; }
function normStorage(name){ return /냉동|frozen/i.test(String(name||"")) ? "냉동" : "냉장"; }
function expiryDays(policy, sp, storage, partText){
  const cands = (policy||[]).filter(p=>p.species===sp && p.storage_type===storage);
  const hit = cands.find(p=>p.part_name!=="전부위" && partText && partText.indexOf(p.part_name)>=0);
  if (hit) return hit.default_days;
  const generic = cands.find(p=>p.part_name==="전부위");
  if (generic) return generic.default_days;
  return storage==="냉동" ? (sp==="소"?365:180) : 10; // 기본값
}
function addDays(dateStr, days){ const d=new Date(dateStr+"T00:00:00"); if(isNaN(d)) return null; d.setDate(d.getDate()+Number(days||0)); return d.toISOString().slice(0,10); }
async function computeExpiryForLines(lines, invoiceDate){
  const policy = await loadExpiryPolicy();
  const slaughter = await Promise.all(lines.map(async (it)=>{
    if(!it.traceOrImportNo) return null;
    try {
      const r=await fetch(TRACE_FN+"?traceNo="+encodeURIComponent(it.traceOrImportNo),{headers:{Authorization:"Bearer "+ANON_KEY,apikey:ANON_KEY},signal:AbortSignal.timeout(12000)});
      const b=await r.json(); const y=b.info&&b.info.butcheryYmd;
      return (y&&/^\d{8}$/.test(y)) ? y.slice(0,4)+"-"+y.slice(4,6)+"-"+y.slice(6,8) : null;
    } catch(e){ return null; }
  }));
  return lines.map((it,i)=>{
    const base = slaughter[i] || (/^\d{4}-\d{2}-\d{2}$/.test(invoiceDate||"") ? invoiceDate : null);
    const sp = normSpecies(it.species || it.rawProductName);
    const storage = normStorage((it.rawProductName||"")+" "+(it.unit||"")+" "+(it.condition||""));
    const days = expiryDays(policy, sp, storage, (it.part||"")+" "+(it.rawProductName||""));
    return { slaughter_date: slaughter[i], expiry_date: base ? addDays(base, days) : null };
  });
}

document.getElementById("file").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  document.getElementById("resultCard").style.display = "none";
  step("s1","ok"); step("s2","wait"); ["s3","s4"].forEach(s=>step(s,""));
  let dataUrl;
  try { dataUrl = await downscale(file); step("s2","ok"); }
  catch(e){ step("s2","err"); alert("이미지 준비 실패: "+e.message); return; }
  recognize(dataUrl, file.name || "scan.jpg");
});

async function recognize(dataUrl, fileName) {
  FILE_NAME = fileName || "scan.jpg";
  document.getElementById("resultCard").style.display = "none";
  step("s1","ok"); step("s2","ok"); step("s4","");
  const img=document.getElementById("preview"); img.src=dataUrl; img.style.display="block";
  step("s3","wait");
  try {
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), TIMEOUT_MS);
    const res=await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+ANON_KEY,"apikey":ANON_KEY},signal:ctrl.signal,
      body:JSON.stringify({providerId:"gemini-2.5-flash",imageDataUrl:dataUrl,documentId:"scan",tenantId:"SMARTPD_DEV",supplierName:"",localOcrText:"",unresolvedFields:[]})});
    clearTimeout(to);
    const t=await res.text(); let b; try{b=JSON.parse(t);}catch{b={raw:t};}
    if(!res.ok || b.ok===false){ step("s3","err"); document.getElementById("raw").textContent=t; document.getElementById("resultCard").style.display="block"; alert("서버 오류 "+res.status+": "+(b.message||t).slice(0,150)); return; }
    step("s3","ok"); render(b.result||b);
  } catch(e){ step("s3","err"); alert(e.name==="AbortError"?"시간 초과":"실패: "+e.message); }
}

async function downscale(file){
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1, MAX_DIM/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*scale), h=Math.round(bmp.height*scale);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(bmp,0,0,w,h);
  return c.toDataURL("image/jpeg",0.85);
}

function render(result){
  const items = Array.isArray(result.lineItems)?result.lineItems:[];
  const f = result.documentFields||{};
  DOC = f;
  document.getElementById("saveMsg").textContent = "";
  document.getElementById("f-supplier").textContent = f.supplierName || "-";
  document.getElementById("f-date").textContent = f.invoiceDate || "-";
  const tbody = document.querySelector("#tbl tbody"); tbody.innerHTML="";
  LINES = items.map(it => ({ ...it }));
  LINES.forEach((it,i) => {
    const tr=document.createElement("tr"); tr.dataset.r=i;
    tr.innerHTML =
      "<td>"+(i+1)+"</td>"+
      "<td class='name' contenteditable='true' data-f='rawProductName' data-r='"+i+"'>"+esc(it.rawProductName||"")+"</td>"+
      "<td contenteditable='true' data-f='origin' data-r='"+i+"'>"+esc(it.origin||"")+"</td>"+
      "<td contenteditable='true' data-f='unit' data-r='"+i+"'>"+esc(it.unit||"")+"</td>"+
      "<td class='num' contenteditable='true' data-f='quantity' data-r='"+i+"'>"+(it.quantity!=null?esc(it.quantity):"")+"</td>"+
      "<td class='num' contenteditable='true' data-f='unitPrice' data-r='"+i+"'>"+won(it.unitPrice)+"</td>"+
      "<td class='num' contenteditable='true' data-f='supplyAmount' data-r='"+i+"'>"+won(it.supplyAmount)+"</td>"+
      "<td>"+(it.traceOrImportNo ? "<a href='#' class='tracelink' data-no=\""+esc(it.traceOrImportNo)+"\">"+esc(it.traceOrImportNo)+" 🔎</a>" : "-")+"</td>";
    tbody.appendChild(tr);
  });
  const total = Number(f.totalAmount)||0;
  document.getElementById("f-total").textContent = won(total);
  document.getElementById("f-note").textContent = "";
  document.getElementById("raw").textContent = JSON.stringify(result, null, 2);
  document.getElementById("resultCard").style.display = "block";
  step("s4","ok");
}
