<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>유통기한 기준 설정</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 4px; }
  .sub { color:#6b7280; font-size:13px; margin-bottom:12px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .bar a { flex:1; text-align:center; padding:12px; border-radius:10px; background:#e5e7eb; color:#111827; text-decoration:none; font-weight:700; }
  .twrap { background:#fff; border-radius:12px; overflow-x:auto; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; min-width:560px; }
  th,td { border-bottom:1px solid #eef2f7; padding:8px 6px; text-align:center; }
  th { background:#f8fafc; color:#374151; }
  td.name { text-align:left; }
  td input { width:64px; padding:6px; border:1px solid #d1d5db; border-radius:8px; text-align:right; font-size:14px; }
  .frozen { color:#0891b2; font-weight:700; } .chill { color:#2563eb; font-weight:700; }
  button.primary { display:block; width:100%; padding:16px; font-size:16px; font-weight:800; border:none; border-radius:12px; background:#16a34a; color:#fff; cursor:pointer; margin-bottom:10px; }
  button.recalc { background:#7c3aed; }
  .addbox { background:#fff; border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:12px; }
  .addbox input, .addbox select { padding:8px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; margin:3px; }
  .msg { padding:8px 4px; font-size:14px; }
  .muted { color:#6b7280; font-size:14px; padding:10px; }
</style>
</head>
<body>
  <h1>⚙️ 유통기한 기준 설정</h1>
  <div class="sub">축종·부위·보관방법별 권장 유통기한(일)과 경고/위험일을 정합니다. 바꾸면 새 저장분부터 적용되고, "전체 재계산"으로 기존분도 갱신됩니다.</div>
  <div class="bar"><a href="alerts.html">🔔 알림현황</a><a href="stock.html">📦 재고</a><a href="/">🏠 홈</a></div>

  <div class="twrap">
    <table><thead><tr><th>보관</th><th>축종</th><th>부위</th><th>유통기한(일)</th><th>경고일</th><th>위험일</th></tr></thead>
    <tbody id="tb"><tr><td colspan="6" class="muted">불러오는 중...</td></tr></tbody></table>
  </div>
  <button class="primary" id="saveBtn">💾 기준 저장</button>
  <div class="msg" id="saveMsg"></div>

  <div class="addbox">
    <div style="font-weight:800;margin-bottom:6px">＋ 기준 추가</div>
    <select id="a-storage"><option value="냉장">냉장</option><option value="냉동">냉동</option></select>
    <select id="a-species"><option value="소">소</option><option value="돼지">돼지</option><option value="닭">닭</option></select>
    <input id="a-part" placeholder="부위 (예: 삼겹, 전부위)" />
    <input id="a-days" type="number" placeholder="일수" style="width:80px" />
    <button class="primary" id="addBtn" style="margin-top:8px">추가</button>
    <div class="msg" id="addMsg"></div>
  </div>

  <button class="primary recalc" id="recalcBtn">🔄 전체 재계산 (기존 재고 유통기한 갱신)</button>
  <div class="msg" id="recalcMsg"></div>

<script>
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const ANON_KEY = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const TENANT_ID = "881f6cc1-b552-468c-b9b4-152edb464e61";
const H = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY };
const HW = { ...H, "Content-Type": "application/json" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

let POLICY = [];
async function load(){
  try{
    const r = await fetch(REST+"/expiry_policy?tenant_id=eq."+TENANT_ID+"&select=id,species,part_name,storage_type,default_days,warning_days,critical_days&order=storage_type,species,part_name&limit=200",{headers:H});
    if(!r.ok) throw new Error("HTTP "+r.status);
    POLICY = await r.json();
    render();
  }catch(e){ document.getElementById("tb").innerHTML="<tr><td colspan='6' class='muted'>불러오기 실패: "+esc(e.message)+"</td></tr>"; }
}
function render(){
  const tb=document.getElementById("tb");
  if(!POLICY.length){ tb.innerHTML="<tr><td colspan='6' class='muted'>기준이 없습니다. 아래에서 추가하세요.</td></tr>"; return; }
  tb.innerHTML = POLICY.map(p=>
    "<tr data-id='"+p.id+"'>"+
    "<td class='"+(p.storage_type==='냉동'?'frozen':'chill')+"'>"+esc(p.storage_type)+"</td>"+
    "<td>"+esc(p.species)+"</td><td class='name'>"+esc(p.part_name)+"</td>"+
    "<td><input type='number' data-f='default_days' value='"+(p.default_days??"")+"'></td>"+
    "<td><input type='number' data-f='warning_days' value='"+(p.warning_days??"")+"'></td>"+
    "<td><input type='number' data-f='critical_days' value='"+(p.critical_days??"")+"'></td></tr>"
  ).join("");
}
document.getElementById("saveBtn").addEventListener("click", async ()=>{
  const msg=document.getElementById("saveMsg"); msg.style.color="#6b7280"; msg.textContent="저장 중...";
  try{
    const rows=[...document.querySelectorAll("#tb tr[data-id]")];
    let n=0;
    for(const tr of rows){
      const id=tr.dataset.id; const body={};
      tr.querySelectorAll("input[data-f]").forEach(inp=>{ body[inp.dataset.f]=Number(inp.value)||0; });
      const r=await fetch(REST+"/expiry_policy?id=eq."+id,{method:"PATCH",headers:{...HW,Prefer:"return=minimal"},body:JSON.stringify(body)});
      if(r.ok) n++;
    }
    msg.style.color="#166534"; msg.textContent="✓ "+n+"개 기준 저장됨. (기존 재고 반영은 아래 '전체 재계산')";
  }catch(e){ msg.style.color="#b91c1c"; msg.textContent="저장 실패: "+e.message; }
});
document.getElementById("addBtn").addEventListener("click", async ()=>{
  const msg=document.getElementById("addMsg");
  const row={ tenant_id:TENANT_ID, storage_type:document.getElementById("a-storage").value, species:document.getElementById("a-species").value,
    part_name:(document.getElementById("a-part").value||"전부위").trim(), default_days:Number(document.getElementById("a-days").value)||0 };
  if(!row.default_days){ msg.style.color="#b91c1c"; msg.textContent="일수를 입력하세요."; return; }
  msg.style.color="#6b7280"; msg.textContent="추가 중...";
  try{
    const r=await fetch(REST+"/expiry_policy",{method:"POST",headers:{...HW,Prefer:"return=minimal,resolution=merge-duplicates"},body:JSON.stringify(row)});
    if(!r.ok) throw new Error((await r.text()).slice(0,120));
    msg.style.color="#166534"; msg.textContent="✓ 추가됨"; document.getElementById("a-part").value=""; document.getElementById("a-days").value="";
    load();
  }catch(e){ msg.style.color="#b91c1c"; msg.textContent="추가 실패: "+e.message; }
});

// 전체 재계산: raw_product_name으로 축종/보관 추정 + (도축일 or 입고일) + 기준일수
function normSpecies(name){ name=String(name||""); if(/삼겹|목살|미후지|앞다리|뒷다리|항정|등뼈|우삼겹|돼지|돈/.test(name)) return "돼지"; if(/한우|안심|채끝|양지|소\b|우삼/.test(name)) return "소"; if(/닭|계|치킨/.test(name)) return "닭"; return "돼지"; }
function normStorage(name){ return /냉동/.test(String(name||"")) ? "냉동" : "냉장"; }
function days(sp,st,name){ const c=POLICY.filter(p=>p.species===sp&&p.storage_type===st); const hit=c.find(p=>p.part_name!=="전부위"&&name.indexOf(p.part_name)>=0); if(hit) return hit.default_days; const g=c.find(p=>p.part_name==="전부위"); if(g) return g.default_days; return st==="냉동"?(sp==="소"?365:180):10; }
function addD(d,n){ const x=new Date(d+"T00:00:00"); if(isNaN(x)) return null; x.setDate(x.getDate()+Number(n||0)); return x.toISOString().slice(0,10); }
document.getElementById("recalcBtn").addEventListener("click", async ()=>{
  const msg=document.getElementById("recalcMsg"); msg.style.color="#6b7280"; msg.textContent="재계산 중...";
  try{
    if(!POLICY.length) await load();
    const rows=await (await fetch(REST+"/inventory_movement?tenant_id=eq."+TENANT_ID+"&select=id,raw_product_name,movement_date,slaughter_date&limit=2000",{headers:H})).json();
    let n=0;
    for(const m of rows){
      const base = m.slaughter_date || m.movement_date;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(String(base||""))) continue;
      const sp=normSpecies(m.raw_product_name), st=normStorage(m.raw_product_name);
      const exp=addD(base, days(sp,st,m.raw_product_name||""));
      const r=await fetch(REST+"/inventory_movement?id=eq."+m.id,{method:"PATCH",headers:{...HW,Prefer:"return=minimal"},body:JSON.stringify({expiry_date:exp})});
      if(r.ok) n++;
    }
    msg.style.color="#166534"; msg.textContent="✓ "+n+"건 재고 유통기한 재계산 완료";
  }catch(e){ msg.style.color="#b91c1c"; msg.textContent="재계산 실패: "+e.message; }
});

load();
</script>
</body>
</html>
