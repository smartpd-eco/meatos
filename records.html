<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>저장된 거래명세서</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 12px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .bar a { flex:1; text-align:center; padding:12px; border-radius:10px; background:#16a34a; color:#fff; text-decoration:none; font-weight:700; }
  .bar a.alt { background:#e5e7eb; color:#111827; }
  input#q { width:100%; padding:12px; border:1px solid #d1d5db; border-radius:10px; font-size:15px; margin-bottom:12px; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); cursor:pointer; }
  .row1 { display:flex; justify-content:space-between; align-items:baseline; }
  .sup { font-size:16px; font-weight:800; }
  .amt { font-size:16px; font-weight:800; color:#166534; }
  .meta { color:#6b7280; font-size:13px; margin-top:4px; }
  .muted { color:#6b7280; font-size:14px; }
  /* 명세서 상세 */
  .invoice { border:2px solid #b91c1c; border-radius:8px; overflow:hidden; margin-top:10px; }
  .invoice-title { background:#b91c1c; color:#fff; text-align:center; font-size:16px; font-weight:800; padding:6px; letter-spacing:3px; }
  .ihead { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid #e5e7eb; }
  .ihead > div { padding:8px 10px; font-size:13px; } .ihead > div + div { border-left:1px solid #f1f5f9; }
  .ihead b { display:block; color:#6b7280; font-weight:600; font-size:11px; }
  .twrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:620px; }
  th,td { border:1px solid #e5e7eb; padding:6px; text-align:center; white-space:nowrap; }
  th { background:#fef2f2; color:#7f1d1d; }
  td.name { text-align:left; white-space:normal; min-width:140px; } td.num { text-align:right; }
  tfoot td { font-weight:800; background:#f9fafb; }
  .back { margin:8px 0; display:inline-block; color:#2563eb; cursor:pointer; }
  .tracelink { color:#2563eb; text-decoration:none; font-weight:700; white-space:nowrap; }
  #trace-print-area { display:none; }
  @media print {
    body.trace-printing > *:not(#trace-print-area) { display:none !important; }
    #trace-print-area { display:block !important; padding:8px 4px; }
  }
</style>
</head>
<body>
  <h1>📋 저장된 거래명세서</h1>
  <div class="bar">
    <a href="scan.html">📷 새로 스캔</a>
    <a href="stock.html" class="alt">📦 재고</a>
    <a href="/" class="alt">🏠 홈</a>
  </div>

  <div id="listView">
    <input id="q" type="text" placeholder="공급자 또는 날짜로 검색 (예: 좋은축산 / 2026-07)" />
    <div id="list"><p class="muted">불러오는 중...</p></div>
  </div>

  <div id="detailView" style="display:none">
    <span class="back" id="back">‹ 목록으로</span>
    <div id="detail"></div>
  </div>

<script>
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const ANON_KEY = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const TENANT_ID = "881f6cc1-b552-468c-b9b4-152edb464e61"; // SMARTPD_DEV
const H = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY };

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

const won = (v) => v==null||v===""?"-":Number(v).toLocaleString("ko-KR");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));

// 이력번호 → 축산물통합이력정보 조회 (앱 내 패널로 표시)
const TRACE_FN = "https://pkrsiqjzllyiafwpskll.functions.supabase.co/trace-lookup";
function _ymd(s){ s=String(s||""); return /^\d{8}$/.test(s) ? s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8) : s; }
function _trow(label,val){ return val ? "<div style='display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9'><span style='color:#6b7280'>"+label+"</span><b style='text-align:right'>"+esc(val)+"</b></div>" : ""; }
function _species(s){ return String(s||"").replace("PIG","돼지").replace("CATTLE","소").replace("|LOT_NO"," 묶음").replace("|PIG_NO"," 이력").replace("|CATTLE_NO"," 개체"); }
function _importBody(t,i){
  const warn=(i.salePrhibt==="Y"||i.recallTarget==="Y")?"<div style='background:#fee2e2;color:#b91c1c;border-radius:10px;padding:10px;font-weight:800;margin-bottom:8px'>⚠️ 판매금지·회수대상 이력입니다. 판매 전 확인하세요."+(i.recallContent?"<div style='font-weight:600;font-size:13px;margin-top:4px'>"+esc(i.recallContent)+"</div>":"")+"</div>":"";
  return "<div style='font-size:15px;font-weight:800;margin-bottom:2px'>이력번호 "+esc(t)+"</div>"+
    "<div style='display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;margin-bottom:8px'>🌍 수입 축산물</div>"+warn+
    _trow("품목", i.itemNm)+_trow("부위", i.partNm)+
    _trow("🌍 원산지", i.nationNm)+
    _trow("🔪 도축장", i.butcheryPlaceNm)+_trow("도축기간", i.butcheryYmd)+
    _trow("🏭 가공장", i.processPlaceNm)+_trow("가공기간", i.processYmd)+
    _trow("수출업체", i.exporterNm)+_trow("수입업체", i.importerNm)+
    _trow("B/L 번호", i.blNo)+_trow("소비기한", i.consumeYmd)+
    "<div style='margin-top:10px'><a href='https://www.meatwatch.go.kr' target='_blank' style='color:#2563eb;font-size:13px'>MEATWATCH 공식 조회 ›</a></div>";
}
function _traceModal(){
  let m=document.getElementById("trace-modal");
  if(!m){
    m=document.createElement("div"); m.id="trace-modal";
    m.style.cssText="position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px";
    m.innerHTML="<div style='background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:85vh;overflow:auto;padding:16px'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'><b style='font-size:17px'>🔎 축산물 이력정보</b><span style='display:flex;gap:6px'><button id='trace-print' onclick='_printTrace()' style='border:none;background:#2563eb;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700'>🖨️ 출력</button><button id='trace-close' style='border:none;background:#e5e7eb;border-radius:8px;padding:6px 12px;font-weight:700'>닫기</button></span></div><div id='trace-body'></div></div>";
    document.body.appendChild(m);
    m.addEventListener("click",function(e){ if(e.target===m) m.style.display="none"; });
    m.querySelector("#trace-close").addEventListener("click",function(){ m.style.display="none"; });
  }
  return m;
}
let _curTraceNo="", _curTraceInfo=null;
function _pv(v){ return (v==null||v==="")?"-":esc(v); }
function _printDoc(i){
  const now=new Date().toLocaleString("ko-KR",{year:"2-digit",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"});
  let inner;
  if(i.source==="import"){
    inner=
    "<div class='thead'><span>"+now+"</span><span>수입이력정보 조회</span></div>"+
    "<div class='tbox'><span class='tl'>이력번호</span><span class='tn'>"+_pv(i.traceNo)+"</span></div>"+
    "<div class='sc'>기본정보 <em>품목명은 수입신고시점의 품목정보입니다.</em></div>"+
    "<table><tr><th>이력번호</th><td>"+_pv(i.traceNo)+"</td><th>선하증권번호</th><td>"+_pv(i.blNo)+"</td></tr>"+
    "<tr><th>수입축산물 품목명</th><td colspan='3'>"+_pv(i.itemNm)+"</td></tr></table>"+
    "<div class='sc'>원산지정보</div>"+
    "<table><tr><th>원산지 국가</th><td colspan='3'>"+_pv(i.nationNm)+"</td></tr></table>"+
    "<div class='sc'>수입이력정보</div>"+
    "<table><tr><th>수출국 도축장</th><td>"+_pv(i.butcheryPlaceNm)+"</td><th>수출국 도축일자</th><td>"+_pv(_ymd(i.butcheryYmd))+"</td></tr>"+
    "<tr><th>수출국 가공장</th><td>"+_pv(i.processPlaceNm)+"</td><th>수출국 가공일자</th><td>"+_pv(i.processYmd)+"</td></tr>"+
    "<tr><th>수출업체</th><td>"+_pv(i.exporterNm)+"</td><th>수입업체</th><td>"+_pv(i.importerNm)+"</td></tr>"+
    "<tr><th>수입일자</th><td colspan='3'>"+_pv(i.importDt)+"</td></tr>"+
    "<tr><th>부위명(코드)</th><td colspan='3'>"+_pv(i.partNm)+(i.partCode?"("+esc(i.partCode)+")":"")+"</td></tr></table>"+
    "<p class='note'>※ 본 자료는 참고용 자료로서 법적 책임소재에 대한 증빙자료로 사용될 수 없습니다.</p>";
  } else {
    const sp=_species(i.species||"");
    inner=
    "<div class='thead'><span>"+now+"</span><span>이력번호 조회</span></div>"+
    "<div class='brand'><svg width='40' height='40' viewBox='0 0 100 100'><circle cx='50' cy='50' r='49' fill='#e60012'/><circle cx='50' cy='50' r='41' fill='none' stroke='#fff' stroke-width='2'/><text x='50' y='42' text-anchor='middle' fill='#fff' font-size='23' font-weight='900' font-family='sans-serif'>이력</text><text x='50' y='66' text-anchor='middle' fill='#fff' font-size='23' font-weight='900' font-family='sans-serif'>추적</text><text x='50' y='85' text-anchor='middle' fill='#fff' font-size='9' font-family='sans-serif'>Traceability</text></svg><span class='bt'>축산물이력제</span><span class='bsep'></span><span class='bsub'>"+_pv(sp)+" 이력번호 조회</span></div>"+
    "<div class='sc'>사육정보</div>"+
    "<table><tr><th>이력번호</th><td>"+_pv(i.traceNo)+"</td><th>농장식별번호</th><td>"+_pv(i.farmId)+"</td></tr>"+
    "<tr><th>농장경영자</th><td>"+_pv(i.farmerNm)+"</td><th>농장소재지</th><td>"+_pv(i.farmAddr)+"</td></tr>"+
    "<tr><th>축종</th><td colspan='3'>"+_pv(sp)+"</td></tr></table>"+
    "<div class='sc'>도축정보</div>"+
    "<table><tr><th>도축장</th><td>"+_pv(i.butcheryPlaceNm)+"</td><th>소재지</th><td>"+_pv(i.butcheryPlaceAddr)+"</td></tr>"+
    "<tr><th>도축일자</th><td>"+_pv(_ymd(i.butcheryYmd))+"</td><th>도축검사결과</th><td>"+(i.butcheryResult==="Y"?"합격":_pv(i.butcheryResult))+"</td></tr></table>"+
    ((i.grade||i.insfat)?("<div class='sc'>등급정보</div><table><tr><th>등급</th><td>"+_pv(i.grade)+"</td><th>근내지방도</th><td>"+_pv(i.insfat)+"</td></tr></table>"):"")+
    "<div class='sc'>식육포장처리 정보</div>"+
    "<table><tr><th>번호</th><th>업소명(등급)</th><th>소재지</th></tr>"+
    "<tr><td>1</td><td>"+_pv(i.processPlaceNm)+"</td><td>"+_pv(i.processPlaceAddr)+"</td></tr></table>"+
    "<div class='sc'>유통과정 정보</div>"+
    "<div class='flow'><span class='st'>사육</span><span class='ar'>›</span><span class='st'>도축</span><span class='ar'>›</span><span class='st'>가공</span><span class='ar'>›</span><span class='st cur'>판매</span></div>";
  }
  return "<style>"+
    "#trace-print-area{font-family:system-ui,'Malgun Gothic',sans-serif;color:#111827}"+
    "#trace-print-area .thead{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:14px}"+
    "#trace-print-area .tbox{display:flex;align-items:center;gap:16px;border:1px solid #cbd5e1;border-radius:6px;padding:14px 18px;margin-bottom:18px}"+
    "#trace-print-area .tbox .tl{color:#2563eb;font-weight:800;font-size:15px}"+
    "#trace-print-area .tbox .tn{border:2px solid #2563eb;border-radius:6px;padding:8px 22px;font-size:20px;font-weight:800;letter-spacing:1px}"+
    "#trace-print-area .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}"+
    "#trace-print-area .brand .bt{font-size:19px;font-weight:900;color:#1f2937}"+
    "#trace-print-area .brand .bsep{width:1px;height:22px;background:#d1d5db}"+
    "#trace-print-area .brand .bsub{font-size:16px;font-weight:700;color:#374151}"+
    "#trace-print-area .sc{font-size:14px;font-weight:800;border-bottom:2px solid #16a34a;padding-bottom:5px;margin:16px 0 0}"+
    "#trace-print-area .sc em{font-size:11px;color:#ea580c;font-weight:600;font-style:normal;margin-left:6px}"+
    "#trace-print-area table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}"+
    "#trace-print-area th,#trace-print-area td{border:1px solid #e5e7eb;padding:8px 10px;text-align:left;vertical-align:middle}"+
    "#trace-print-area th{background:#f8fafc;color:#374151;font-weight:700;white-space:nowrap;width:120px}"+
    "#trace-print-area .note{color:#dc2626;font-size:11px;text-align:center;margin-top:18px}"+
    "#trace-print-area .flow{display:flex;align-items:center;justify-content:center;gap:6px;padding:22px 0}"+
    "#trace-print-area .flow .st{width:74px;height:74px;border-radius:50%;border:2px solid #cbd5e1;color:#6b7280;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}"+
    "#trace-print-area .flow .st.cur{background:#16a34a;border-color:#16a34a;color:#fff}"+
    "#trace-print-area .flow .ar{color:#9ca3af;font-size:22px;font-weight:800}"+
    "</style><div class='doc'>"+inner+"</div>";
}
function _printTrace(){
  const i=_curTraceInfo;
  if(!i || !(i.source==="import"||i.butcheryPlaceNm||i.farmerNm||i.processPlaceNm)){ alert("출력할 이력정보가 없습니다."); return; }
  let a=document.getElementById("trace-print-area");
  if(!a){ a=document.createElement("div"); a.id="trace-print-area"; document.body.appendChild(a); }
  a.innerHTML=_printDoc(i);
  const old=document.title;
  document.title="축산물이력_"+String(_curTraceNo||"").replace(/[^0-9A-Za-z]/g,"");
  document.body.classList.add("trace-printing");
  window.print();
  setTimeout(function(){ document.body.classList.remove("trace-printing"); document.title=old; }, 800);
}
async function openTrace(no){
  const t=String(no||"").trim(); if(!t) return; _curTraceNo=t;
  const m=_traceModal(), body=m.querySelector("#trace-body");
  body.innerHTML="<div style='color:#6b7280;padding:20px;text-align:center'>이력번호 "+esc(t)+"<br>조회 중...</div>";
  m.style.display="flex";
  try{
    const r=await fetch(TRACE_FN+"?traceNo="+encodeURIComponent(t),{headers:{Authorization:"Bearer "+ANON_KEY,apikey:ANON_KEY},signal:AbortSignal.timeout(30000)});
    const b=await r.json(), i=b.info||{}; _curTraceInfo=i;
    if((b.source||i.source)==="import"){ body.innerHTML=_importBody(t,i); return; }
    if(!b.ok){
      body.innerHTML="<div style='padding:6px 2px'>이 번호의 <b>국내</b> 축산물 이력정보가 없습니다.<div style='color:#6b7280;font-size:13px;margin-top:4px'>수입육이면 아래에서 조회하세요.</div></div>"+
        "<div style='margin-top:12px;display:flex;gap:8px'><a href='https://www.meatwatch.go.kr' target='_blank' style='flex:1;text-align:center;padding:12px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:700'>수입 이력 조회</a><a href='https://www.mtrace.go.kr/hstryinq/hstryInqCattle.do' target='_blank' style='flex:1;text-align:center;padding:12px;border-radius:10px;background:#e5e7eb;color:#111827;text-decoration:none;font-weight:700'>국내 이력제</a></div>";
      return;
    }
    body.innerHTML=
      "<div style='font-size:15px;font-weight:800;margin-bottom:6px'>이력번호 "+esc(t)+"</div>"+
      _trow("구분", i.kind)+_trow("축종", _species(i.species))+
      _trow("🔪 도축장", i.butcheryPlaceNm)+_trow("도축장 주소", i.butcheryPlaceAddr)+
      _trow("도축일자", _ymd(i.butcheryYmd))+_trow("도축검사", i.butcheryResult==="Y"?"합격":i.butcheryResult)+
      _trow("등급", i.grade)+_trow("근내지방도", i.insfat)+
      _trow("🏠 농장주소", i.farmAddr)+_trow("사육자", i.farmerNm)+
      _trow("포장처리업소", i.processPlaceNm)+_trow("수입국", i.nationNm)+
      "<div style='margin-top:10px'><a href='https://www.mtrace.go.kr/hstryinq/hstryInqPig.do' target='_blank' style='color:#2563eb;font-size:13px'>공식 축산물이력제에서 자세히 보기 ›</a></div>";
  }catch(e){
    body.innerHTML="<div style='padding:10px;color:#b91c1c'>조회 실패: "+esc(e.name==="TimeoutError"?"시간 초과":e.message)+"</div>";
  }
}
document.addEventListener("click", function(e){ const a=e.target.closest && e.target.closest(".tracelink"); if(a){ e.preventDefault(); openTrace(a.dataset.no); } });

let ALL = [];

async function load() {
  try {
    const url = REST + "/ocr_document?tenant_id=eq." + TENANT_ID +
      "&select=id,document_code,invoice_date,total_amount,document_status,parsed_json,created_at&order=created_at.desc&limit=200";
    const r = await fetch(url, { headers: H });
    if (!r.ok) throw new Error("HTTP " + r.status);
    ALL = await r.json();
    renderList(ALL);
  } catch (e) {
    document.getElementById("list").innerHTML = "<p class='muted'>불러오기 실패: " + esc(e.message) + "</p>";
  }
}

function supplierOf(d){ return (d.parsed_json && d.parsed_json.documentFields && d.parsed_json.documentFields.supplierName) || "-"; }
function itemsOf(d){ return (d.parsed_json && Array.isArray(d.parsed_json.lineItems)) ? d.parsed_json.lineItems : []; }
function dateOf(d){ return d.invoice_date || (d.created_at ? d.created_at.slice(0,10) : "-"); }

function renderList(rows) {
  const el = document.getElementById("list");
  if (!rows.length) { el.innerHTML = "<p class='muted'>저장된 명세서가 없습니다.</p>"; return; }
  el.innerHTML = rows.map((d) =>
    "<div class='card' data-id='" + d.id + "'>" +
      "<div class='row1'><span class='sup'>" + esc(supplierOf(d)) + "</span><span class='amt'>" + won(d.total_amount) + "원</span></div>" +
      "<div class='meta'>" + esc(dateOf(d)) + " · 품목 " + itemsOf(d).length + "건 · " + esc(d.document_code) + "</div>" +
    "</div>"
  ).join("");
  el.querySelectorAll(".card").forEach((c) => c.addEventListener("click", () => showDetail(c.dataset.id)));
}

function showDetail(id) {
  const d = ALL.find((x) => x.id === id); if (!d) return;
  const items = itemsOf(d);
  const rowsHtml = items.map((it,i) =>
    "<tr><td>"+(i+1)+"</td>"+
    "<td class='name'>"+esc([it.rawProductName, it.grade].filter(Boolean).join(" ")||"-")+"</td>"+
    "<td>"+esc(it.origin||"-")+"</td>"+
    "<td>"+esc(it.unit||"-")+"</td>"+
    "<td class='num'>"+(it.quantity!=null?esc(it.quantity):"-")+"</td>"+
    "<td class='num'>"+won(it.unitPrice)+"</td>"+
    "<td class='num'>"+won(it.supplyAmount)+"</td>"+
    "<td>"+(it.traceOrImportNo ? "<a href='#' class='tracelink' data-no=\""+esc(it.traceOrImportNo)+"\">"+esc(it.traceOrImportNo)+" 🔎</a>" : "-")+"</td></tr>"
  ).join("");
  document.getElementById("detail").innerHTML =
    "<div class='invoice'><div class='invoice-title'>거 래 명 세 서</div>" +
    "<div class='ihead'><div><b>공급자</b>"+esc(supplierOf(d))+"</div><div><b>거래일자</b>"+esc(dateOf(d))+"</div></div>" +
    "<div class='twrap'><table><thead><tr><th>No</th><th>상품명 및 등급</th><th>원산지</th><th>단위</th><th>중량(kg)</th><th>단가</th><th>공급가액</th><th>이력번호</th></tr></thead>" +
    "<tbody>"+rowsHtml+"</tbody>" +
    "<tfoot><tr><td colspan='6'>합계금액</td><td class='num'>"+won(d.total_amount)+"</td><td></td></tr></tfoot></table></div></div>" +
    "<p class='muted'>문서번호 "+esc(d.document_code)+" · 상태 <b id='doc-status'>"+esc(d.document_status)+"</b></p>" +
    "<button id='post-btn' style='display:block;width:100%;margin-top:8px;padding:15px;font-size:16px;font-weight:800;border:none;border-radius:12px;color:#fff;cursor:pointer'></button>" +
    "<div id='post-msg' class='muted' style='margin-top:8px'></div>";
  const posted = d.document_status === "POSTED";
  const btn = document.getElementById("post-btn");
  btn.textContent = posted ? "✓ 재고 반영 완료" : "📦 재고 반영";
  btn.disabled = posted;
  btn.style.background = posted ? "#9ca3af" : "#7c3aed";
  if (!posted) btn.addEventListener("click", () => postToInventory(d, items));
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "block";
  window.scrollTo(0,0);
}

async function postToInventory(d, items) {
  const btn = document.getElementById("post-btn"), msg = document.getElementById("post-msg");
  btn.disabled = true; msg.style.color = "#6b7280"; msg.textContent = "재고 반영 중...";
  const HW = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY, "Content-Type": "application/json" };
  const mv = items.map((it, i) => ({
    tenant_id: TENANT_ID, movement_type: "IN",
    raw_product_name: (it.rawProductName && String(it.rawProductName).trim()) || "-",
    origin: it.origin || null, unit: it.unit || null,
    quantity: Number(it.quantity) || 0, unit_price: Number(it.unitPrice) || 0, amount: Number(it.supplyAmount) || 0,
    trace_no: it.traceOrImportNo || null, supplier_name: supplierOf(d),
    ocr_document_id: d.id, ocr_line_no: i + 1, movement_date: dateOf(d)
  }));
  try {
    const r1 = await fetch(REST + "/inventory_movement", { method: "POST", headers: HW, body: JSON.stringify(mv) });
    if (!r1.ok) throw new Error(r1.status + ": " + (await r1.text()).slice(0, 150));
    await fetch(REST + "/ocr_document?id=eq." + d.id, { method: "PATCH", headers: { ...HW, Prefer: "return=minimal" }, body: JSON.stringify({ document_status: "POSTED" }) });
    d.document_status = "POSTED";
    const st = document.getElementById("doc-status"); if (st) st.textContent = "POSTED";
    btn.textContent = "✓ 재고 반영 완료"; btn.style.background = "#9ca3af";
    msg.style.color = "#166534"; msg.textContent = "✓ 재고에 반영했습니다 (" + mv.length + "개 품목 IN)";
  } catch (e) {
    msg.style.color = "#b91c1c"; msg.textContent = "재고 반영 실패: " + e.message; btn.disabled = false;
  }
}

document.getElementById("back").addEventListener("click", () => {
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display = "block";
});

document.getElementById("q").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderList(ALL); return; }
  renderList(ALL.filter((d) => (supplierOf(d)+" "+dateOf(d)+" "+d.document_code).toLowerCase().includes(q)));
});

load();
</script>
</body>
</html>
