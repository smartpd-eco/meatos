<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 12px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .bar a { flex:1; text-align:center; padding:12px; border-radius:10px; background:#16a34a; color:#fff; text-decoration:none; font-weight:700; }
  .bar a.alt { background:#e5e7eb; color:#111827; }
  input#q { width:100%; padding:12px; border:1px solid #d1d5db; border-radius:10px; font-size:15px; margin-bottom:12px; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); cursor:pointer; }
  .row1 { display:flex; justify-content:space-between; align-items:baseline; }
  .sup { font-size:16px; font-weight:800; }
  .amt { font-size:16px; font-weight:800; color:#166534; }
  .meta { color:#6b7280; font-size:13px; margin-top:4px; }
  .muted { color:#6b7280; font-size:14px; }
  /* 명세서 상세 */
  .invoice { border:2px solid #b91c1c; border-radius:8px; overflow:hidden; margin-top:10px; }
  .invoice-title { background:#b91c1c; color:#fff; text-align:center; font-size:16px; font-weight:800; padding:6px; letter-spacing:3px; }
  .ihead { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid #e5e7eb; }
  .ihead > div { padding:8px 10px; font-size:13px; } .ihead > div + div { border-left:1px solid #f1f5f9; }
  .ihead b { display:block; color:#6b7280; font-weight:600; font-size:11px; }
  .twrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:620px; }
  th,td { border:1px solid #e5e7eb; padding:6px; text-align:center; white-space:nowrap; }
  th { background:#fef2f2; color:#7f1d1d; }
  td.name { text-align:left; white-space:normal; min-width:140px; } td.num { text-align:right; }
  tfoot td { font-weight:800; background:#f9fafb; }
  .back { margin:8px 0; display:inline-block; color:#2563eb; cursor:pointer; }
  .tracelink { color:#2563eb; text-decoration:none; font-weight:700; white-space:nowrap; }
  /* 제목줄 + 출력 버튼 */
  .page-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 12px; }
  .page-head h1 { margin:0; }
  .export-btn { flex:none; padding:10px 14px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap; }
  /* 카드 아코디언 */
  .card-head { cursor:pointer; }
  .caret { font-size:12px; color:#9ca3af; display:inline-block; transition:transform .15s; }
  .card.expanded .caret { transform:rotate(180deg); }
  .detail-inline { margin-top:10px; border-top:1px dashed #e5e7eb; padding-top:10px; }
  /* 기간 조회 모달 */
  .export-modal { position:fixed; inset:0; z-index:100000; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:16px; }
  .export-box { background:#fff; border-radius:14px; max-width:420px; width:100%; padding:18px; }
  .export-box h3 { margin:0 0 4px; font-size:17px; }
  .export-box .desc { color:#6b7280; font-size:13px; margin-bottom:12px; }
  .export-row { display:flex; gap:8px; margin-bottom:10px; }
  .export-row label { flex:1; font-size:12px; color:#6b7280; font-weight:700; }
  .export-row input { width:100%; margin-top:4px; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; }
  .export-actions { display:flex; gap:8px; margin-top:6px; }
  .export-actions button { flex:1; min-height:46px; border:0; border-radius:10px; font-weight:800; font-size:15px; cursor:pointer; }
  .export-actions .go { background:#2563eb; color:#fff; } .export-actions .cancel { background:#e5e7eb; color:#374151; }
  .export-msg { font-size:13px; margin-top:8px; min-height:18px; }
  #trace-print-area { display:none; }
  @media print {
    body.trace-printing > *:not(#trace-print-area) { display:none !important; }

function supplierOf(d){ return (d.parsed_json && d.parsed_json.documentFields && d.parsed_json.documentFields.supplierName) || "-"; }

// ===== 축종/부위/등급 판별 (등급은 소만 표기) =====
function speciesCategory(name){ try { return PRODUCT_NAMES ? PRODUCT_NAMES.categoryOf(name || "", {}) : "기타"; } catch(e) { return "기타"; } }
function isBeef(name){ return speciesCategory(name) === "소고기"; }
function meatKind(name){
  const cat = speciesCategory(name), n = String(name || "");
  if (cat === "소고기") { if (/한우/.test(n)) return "쇠고기(한우)"; if (/육우/.test(n)) return "쇠고기(육우)"; if (/젖소|홀스타인|착유/.test(n)) return "쇠고기(젖소)"; return "쇠고기"; }
  if (cat === "돼지고기") return "돼지고기";
  if (cat === "닭고기") return "닭고기";
  return "";
}
function partName(name){ try { return (PRODUCT_NAMES ? (PRODUCT_NAMES.classify(name || "", {}).cut || "") : ""); } catch(e) { return ""; } }
function gradeOfItem(it){ return isBeef(it.rawProductName) ? (it.grade || "") : ""; }

// 이력번호 → 축산물이력 조회 결과 캐시 (등급/도축장명)
const traceInfoCache = new Map();
async function fetchTraceInfo(no){
  if (!no) return null;
  if (traceInfoCache.has(no)) return traceInfoCache.get(no);
  try {
    const r = await fetch(TRACE_FN + "?traceNo=" + encodeURIComponent(no), { headers: H, signal: AbortSignal.timeout(20000) });
    const b = await r.json(); const i = b.info || {};
    const info = { grade: i.grade || "", abattoir: i.butcheryPlaceNm || "", species: i.species || "" };
    traceInfoCache.set(no, info); return info;
  } catch (e) { traceInfoCache.set(no, null); return null; }
}
async function fetchTraceInfosConcurrent(nos, onProgress){
  const uniq = [...new Set(nos.filter(Boolean))];
  let done = 0, idx = 0; const limit = Math.min(5, uniq.length || 1);
  async function worker(){ while (idx < uniq.length) { const n = uniq[idx++]; await fetchTraceInfo(n); onProgress && onProgress(++done, uniq.length); } }
  await Promise.all(Array.from({ length: limit }, () => worker()));
}
async function runExport(){
  const from = document.getElementById("ex-from").value;
  const to = document.getElementById("ex-to").value;
  const msg = document.getElementById("ex-msg");
  const go = document.getElementById("ex-go");
  if (!from || !to) { msg.style.color = "#b91c1c"; msg.textContent = "시작일과 종료일을 선택하세요."; return; }
  if (from > to) { msg.style.color = "#b91c1c"; msg.textContent = "시작일이 종료일보다 늦습니다."; return; }
  const docs = ALL.filter((d) => { const dt = dateOf(d); return dt !== "-" && dt >= from && dt <= to; })
    .sort((a, b) => dateOf(a).localeCompare(dateOf(b)));
  const rows = [];
  docs.forEach((d) => itemsOf(d).forEach((it) => rows.push({
    name: it.rawProductName || "",
    date: dateOf(d), kind: meatKind(it.rawProductName),
    qty: (it.quantity != null && it.quantity !== "") ? it.quantity : "",
    origin: it.origin || "", part: partName(it.rawProductName),
    gradeOcr: gradeOfItem(it), grade: "", abattoir: "",
    trace: it.traceOrImportNo || "", supplier: supplierOf(d)
  })));
  if (!rows.length) { msg.style.color = "#b91c1c"; msg.textContent = "해당 기간에 매입 명세서가 없습니다."; return; }
  // 등급·도축장명은 OCR이 아니라 축산물이력에서 조회해 채운다.
  go.disabled = true; msg.style.color = "#6b7280"; msg.textContent = "축산물이력에서 등급·도축장 조회 중…";
  try {
    await fetchTraceInfosConcurrent(rows.map((r) => r.trace), (d, t) => { msg.textContent = "축산물이력 조회 중… " + d + "/" + t; });
  } catch (e) { /* 개별 실패는 무시하고 빈 값으로 진행 */ }
  rows.forEach((r) => {
    const info = r.trace ? traceInfoCache.get(r.trace) : null;
    const isBeefRow = isBeef(r.name) || (info && /소|한우|육우|젖소/.test(info.species));
    r.abattoir = (info && info.abattoir) || "";
    r.grade = isBeefRow ? ((info && info.grade) || r.gradeOcr || "") : "";
  });
  const gradeCnt = rows.filter((r) => r.grade).length, abbrCnt = rows.filter((r) => r.abattoir).length;
  downloadTransactionXls(rows, from, to);
  go.disabled = false;
  msg.style.color = "#166534";
  msg.textContent = "✓ " + rows.length + "건 출력 (등급 " + gradeCnt + "건 · 도축장 " + abbrCnt + "건 이력반영)";
}
