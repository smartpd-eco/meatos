function movementStatus(m) {

function _printTrace(){
  const i=_curTraceInfo;
  if(!i || !(i.source==="import"||i.butcheryPlaceNm||i.farmerNm||i.processPlaceNm)){ alert("출력할 이력정보가 없습니다."); return; }
  let a=document.getElementById("trace-print-area");
  if(!a){ a=document.createElement("div"); a.id="trace-print-area"; document.body.appendChild(a); }
  a.innerHTML=_printDoc(i);
  const old=document.title;
  document.title="축산물이력_"+String(_curTraceNo||"").replace(/[^0-9A-Za-z]/g,"");
  document.body.classList.add("trace-printing");
  window.print();
  setTimeout(function(){ document.body.classList.remove("trace-printing"); document.title=old; }, 800);
}

async function load() {
  try {
    const url = REST + "/inventory_movement?tenant_id=eq." + TENANT_ID +
      (STORE_ID ? "&store_id=eq." + encodeURIComponent(STORE_ID) : "") +
      "&select=raw_product_name,origin,unit,quantity,unit_price,amount,movement_type,movement_date,supplier_name,slaughter_date,expiry_date,ocr_document_id,memo,created_at&limit=5000";
    const inventoryRequest = getJson(url);
    await PRODUCT_NAME_LEARNING_READY;
    MOVES = await inventoryRequest;
    DOCUMENT_HINTS = buildDocumentHints(MOVES);
    const map = new Map();
    for (const m of MOVES) {
      const classification = classifyMovement(m);
      const key = classification.key;
      const name = classification.displayName;
      const e = map.get(key) || {
        key,
        name,
        category:classification.category,
        storage:classification.storage,
        cut:classification.cut,
        confidence:classification.confidence,
        reviewRequired:Boolean(classification.requiresReview) || classification.storage === "보관미상",
        sourceNames:new Set(),
        specification:"-",
        unit:"kg",
        qty:0,
        inQty:0,
        inAmount:0,
        count:0,
        lastIn:"",
        nearExpiry:false
      };
      if(classification.requiresReview){
        e.reviewRequired=true;
        e.confidence=Math.min(Number(e.confidence)||100,Number(classification.confidence)||100);
      }
      e.sourceNames.add(String(m.raw_product_name || "").trim());
      e.qty += sign(m) * (Number(m.quantity) || 0);
      if(m.movement_type === "IN"){
        e.inQty += Number(m.quantity)||0;
        e.inAmount += Number(m.amount)||0;
        const inboundDate=String(m.movement_date||m.created_at||"").slice(0,10);
        if(inboundDate > e.lastIn) e.lastIn=inboundDate;
        const days=m.expiry_date ? dLeft(m.expiry_date) : null;
        if(days !== null && days <= 3) e.nearExpiry=true;
      }
      e.count += 1;
      map.set(key, e);
    }
    map.forEach((e)=>{
      e.avgPrice=e.inQty>0?e.inAmount/e.inQty:0;
      e.amount=Math.max(e.qty,0)*e.avgPrice;
      e.sourceNameList=[...e.sourceNames].filter(Boolean).sort((a,b)=>a.localeCompare(b,"ko"));
      e.aliasCount=e.sourceNameList.length;
      delete e.sourceNames;
    });
    const categoryOrder = { "돼지고기":0, "소고기":1, "닭고기":2, "기타":3 };
    const storageOrder = { "냉장":0, "냉동":1, "보관미상":2 };
    GROUPS = [...map.values()].sort((a, b) =>
      (categoryOrder[a.category] ?? 9) - (categoryOrder[b.category] ?? 9)
      || (storageOrder[a.storage] ?? 9) - (storageOrder[b.storage] ?? 9)
      || a.cut.localeCompare(b.cut, "ko")
      || b.amount - a.amount
    );
    document.getElementById("k-items").textContent = GROUPS.length;
    document.getElementById("k-weight").textContent = kg(GROUPS.reduce((s, e) => s + e.qty, 0));
    document.getElementById("k-amount").textContent = won(GROUPS.reduce((s, e) => s + e.amount, 0));

    document.getElementById("tb").innerHTML = "<tr><td colspan='9' class='muted'>불러오기 실패: " + esc(e.message) + "<br><button type='button' onclick='load()' style='margin-top:10px;padding:9px 14px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700'>다시 시도</button></td></tr>";
  }
}

function buildDocumentHints(movements) {
  const documents = new Map();
  for (const movement of movements) {
    const documentId = String(movement.ocr_document_id || "");
    if (!documentId) continue;
    const entry = documents.get(documentId) || { categories:{ "돼지고기":0, "소고기":0, "닭고기":0 }, storage:{ "냉장":0, "냉동":0 }, rows:0 };
    const compactName = String(movement.raw_product_name || "").replace(/\s+/g, "");
    if (/돼지|돈육|돈뼈|등뼈|등갈비|쪽갈비|삼겹|목살|앞다리|뒷다리|후지|전지|항정|가브리|미박/.test(compactName)) entry.categories["돼지고기"] += 1;
    else if (/한우|육우|우육|소고기|우삼겹|우목심|차돌|채끝|소안심|우안심|소등심|우등심|우족|사골/.test(compactName)) entry.categories["소고기"] += 1;
    else if (/닭|계육/.test(compactName)) entry.categories["닭고기"] += 1;
    if (/냉장/.test(compactName)) entry.storage["냉장"] += 3;
    else if (/냉동/.test(compactName)) entry.storage["냉동"] += 3;
    else {
      const movementDate = Date.parse(movement.movement_date || movement.created_at || "");
      const expiryDate = Date.parse(movement.expiry_date || "");
      if (Number.isFinite(movementDate) && Number.isFinite(expiryDate) && movementDate <= expiryDate) entry.storage["냉장"] += 1;
    }
    entry.rows += 1;
    documents.set(documentId, entry);
  }
  return new Map([...documents].map(([documentId, entry]) => {
    const categories = Object.entries(entry.categories).sort((a,b)=>b[1]-a[1]);
    const storages = Object.entries(entry.storage).sort((a,b)=>b[1]-a[1]);
    const category = categories[0];
    const storage = storages[0];
    return [documentId, {
      category:category && category[1] >= 2 && category[1] > (categories[1]?.[1] || 0) ? category[0] : "",
      storage:storage && storage[1] > (storages[1]?.[1] || 0) && storage[1] >= Math.ceil(entry.rows / 2) ? storage[0] : ""
    }];
  }));
}

async function resolveStockRegistrationName(){
  const typedName=document.getElementById("stock-name").value.trim();
  const storage=document.getElementById("stock-storage").value;
  const baseName=typedName.replace(/^(냉장|냉동|넥장|넹장|냉쟝|넥동|넹동|냉돔)\s*/,"");
  if(!baseName)return null;
  await PRODUCT_NAME_LEARNING_READY;
  const sourceName=storage+" "+baseName;
  const context={
    supplierName:document.getElementById("stock-supplier").value.trim(),
    origin:document.getElementById("stock-origin").value.trim(),
    movementDate:document.getElementById("stock-date").value||todayStr(),
    expiryDate:document.getElementById("stock-expiry").value||null
  };
  const suggestion=PRODUCT_NAMES.suggest(sourceName,context);
  const classification=suggestion.classification;
  const standardName=suggestion.candidateFound
    ? suggestion.suggestedName
    : "";
  return {
    sourceName,
    standardName,
    classification,
    suggestion,
    changed:Boolean(standardName)&&PRODUCT_NAMES.fingerprint(sourceName)!==PRODUCT_NAMES.fingerprint(standardName)
  };
}

  catch(error){ stockRegisterMsg.style.color="#b91c1c"; stockRegisterMsg.textContent="품목 자동치환을 확인하지 못했습니다. 다시 시도해주세요."; return; }
  if(!resolvedName?.standardName){ stockRegisterMsg.style.color="#b91c1c"; stockRegisterMsg.textContent="정육 표준품목 후보를 확인해주세요."; return; }
  if(resolvedName.suggestion.requiresConfirmation&&confirmedSuggestionKey!==suggestionConfirmationKey(resolvedName)){
    stockRegisterMsg.style.color="#b91c1c";
    stockRegisterMsg.textContent="AI 추천 품목을 먼저 확인하고 학습해주세요.";
    return;
  }
  const row={
    tenant_id:TENANT_ID, company_id:TENANT_ID, store_id:STORE_ID,
    movement_type:"IN", raw_product_name:resolvedName.standardName,
    origin:document.getElementById("stock-origin").value.trim()||null,
    unit:"kg", quantity, unit_price:price, amount:Math.round(quantity*price),
    movement_date:document.getElementById("stock-date").value||todayStr(),
    expiry_date:document.getElementById("stock-expiry").value||null,
    supplier_name:document.getElementById("stock-supplier").value.trim()||null,
    memo:"재고 직접등록"+(resolvedName.changed?" · AI확정 입력명: "+resolvedName.sourceName:"")
  };
  const saveButton=document.getElementById("stock-register-save");
  saveButton.disabled=true; stockRegisterMsg.style.color="#6b7280"; stockRegisterMsg.textContent="등록 중…";
  try{
    const response=await fetch(REST+"/inventory_movement",{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(row)});
    if(!response.ok) throw new Error((await response.text()).slice(0,180)||"HTTP "+response.status);
    stockRegisterMsg.style.color="#166534"; stockRegisterMsg.textContent="✓ "+resolvedName.standardName+"(으)로 등록되었습니다.";
    ["stock-name","stock-origin","stock-quantity","stock-price","stock-expiry","stock-supplier"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("stock-date").value=todayStr();
    renderStockNamePreview();
    await load();
    setTimeout(closeStockRegister,650);
  }catch(error){
    stockRegisterMsg.style.color="#b91c1c"; stockRegisterMsg.textContent="등록 실패: "+error.message;
  }finally{ saveButton.disabled=false; }
});
// ===================== 거래명세서 기준 일괄(최대 20개) 재고등록 =====================
// 신규 페이지 없이 기존 재고등록 모달을 확장한다. 저장은 기존 inventory_movement에
// 배열(1회 요청)로 INSERT 하고, 표준상품은 기존 PRODUCT_NAMES.suggest 를 재사용한다.
const BATCH_MAX = 20;
const BATCH_DEFAULT_ROWS = 5;
const BATCH_STORAGE_PREFIX_RE = /^(냉장|냉동|넥장|넹장|냉쟝|넥동|넹동|냉돔)\s*/;
let batchItems = [];
let batchRowSeq = 0;
const batchSuggestTimers = new Map();

function batchCommon(){
  return {
    storage:document.getElementById("batch-storage").value,
    origin:document.getElementById("batch-origin").value.trim(),
    supplier:document.getElementById("batch-supplier").value.trim(),
    date:document.getElementById("batch-date").value || todayStr()
  };
}
function newBatchItem(rawName){
  return { rowId:++batchRowSeq, rawProductName:rawName||"", sourceName:"", standardName:"", manualStd:false,
    quantity:"", unitPrice:"", lotNo:"", expiryDate:"", suggestion:null, confirmed:false, error:"" };
}
function findBatchItem(rowId){ return batchItems.find(x=>x.rowId===rowId); }
function batchStatusOf(item){
  const hasName=String(item.rawProductName||"").trim().length>0;
  if(item.manualStd && String(item.standardName||"").trim()) return "CONFIRMED";
  if(!hasName) return "EMPTY";
  const s=item.suggestion;
  if(!s || !s.candidateFound) return "UNRESOLVED";
  if(!s.requiresConfirmation) return s.learned ? "CONFIRMED" : "AUTO_MATCHED";
  return item.confirmed ? "CONFIRMED" : "SUGGESTED";
}
function batchStatusMeta(status){
  switch(status){
    case "CONFIRMED": return { cls:"ok", label:"확인완료" };
    case "AUTO_MATCHED": return { cls:"auto", label:"자동매칭" };
    case "SUGGESTED": return { cls:"sug", label:"확인 필요" };
    case "UNRESOLVED": return { cls:"unres", label:"표준상품 없음" };
    default: return { cls:"empty", label:"미입력" };
  }
}
function batchAllowed(status){ return status==="CONFIRMED" || status==="AUTO_MATCHED"; }
function batchDisplayStd(item){
  if(item.manualStd) return item.standardName||"";
  return (item.suggestion && item.suggestion.candidateFound) ? item.suggestion.suggestedName : "";
}
function batchRowAmount(item){ return Math.round((Number(item.quantity)||0)*(Number(item.unitPrice)||0)); }
async function resolveBatchSuggestion(item){
  const base=String(item.rawProductName||"").trim().replace(BATCH_STORAGE_PREFIX_RE,"");
  if(!base){ item.suggestion=null; item.sourceName=""; return; }
  await PRODUCT_NAME_LEARNING_READY;
  const c=batchCommon();
  const sourceName=c.storage+" "+base;
  item.sourceName=sourceName;
  item.suggestion=PRODUCT_NAMES.suggest(sourceName,{ supplierName:c.supplier, origin:c.origin, movementDate:c.date, expiryDate:item.expiryDate||null });
}
function batchActiveItems(){
  return batchItems.filter(it=>String(it.rawProductName||"").trim() || (it.manualStd&&String(it.standardName||"").trim()) || String(it.quantity||"").trim());
}
function renderBatch(){
  const wrap=document.getElementById("batch-rows");
  wrap.innerHTML=batchItems.map((it,idx)=>{
    const std=batchDisplayStd(it);
    const meta=batchStatusMeta(batchStatusOf(it));
    return "<div class=\"brow\" id=\"b-row-"+it.rowId+"\">"+
      "<div class=\"brow-grid\">"+
        "<div class=\"no\">"+(idx+1)+"</div>"+
        "<div class=\"col col-name\"><span class=\"lbl\">원문 상품명</span><input id=\"b-name-"+it.rowId+"\" type=\"text\" value=\""+esc(it.rawProductName)+"\" placeholder=\"예: 냉장 항정(장터)\" /></div>"+
        "<div class=\"col col-std\"><span class=\"lbl\">표준상품</span><input id=\"b-std-"+it.rowId+"\" type=\"text\" value=\""+esc(std)+"\" placeholder=\"자동 추천 / 직접 입력\" /></div>"+
        "<div class=\"col\"><span class=\"lbl\">수량(kg)</span><input id=\"b-qty-"+it.rowId+"\" type=\"number\" min=\"0.001\" step=\"0.001\" value=\""+esc(it.quantity)+"\" placeholder=\"0\" /></div>"+
        "<div class=\"col\"><span class=\"lbl\">단가(원)</span><input id=\"b-price-"+it.rowId+"\" type=\"number\" min=\"0\" step=\"1\" value=\""+esc(it.unitPrice)+"\" placeholder=\"선택\" /></div>"+
        "<button class=\"del\" id=\"b-del-"+it.rowId+"\" type=\"button\" title=\"행 삭제\">✕</button>"+
      "</div>"+
      "<div class=\"brow-foot\">"+
        "<span class=\"fld\">금액 <span class=\"amt\" id=\"b-amt-"+it.rowId+"\">"+won(batchRowAmount(it))+"</span>원</span>"+
        "<span class=\"fld\">유통기한 <input id=\"b-exp-"+it.rowId+"\" type=\"date\" value=\""+esc(it.expiryDate)+"\" /></span>"+
        "<span class=\"fld\">LOT/이력번호 <input id=\"b-lot-"+it.rowId+"\" type=\"text\" value=\""+esc(it.lotNo)+"\" placeholder=\"선택\" maxlength=\"40\" style=\"width:150px\" /></span>"+
        "<span class=\"bstat "+meta.cls+"\" id=\"b-stat-"+it.rowId+"\">"+meta.label+"</span>"+
        "<button class=\"confirm\" id=\"b-confirm-"+it.rowId+"\" type=\"button\" style=\"display:none\">이 상품 확인</button>"+
        "<span class=\"rowerr\" id=\"b-err-"+it.rowId+"\"></span>"+
      "</div>"+
    "</div>";
  }).join("");
  batchItems.forEach(it=>attachBatchRow(it.rowId));
  batchItems.forEach(it=>refreshBatchRow(it.rowId));
  updateBatchSummary();
}
function attachBatchRow(rowId){
  const it=findBatchItem(rowId); if(!it) return;
  const nameEl=document.getElementById("b-name-"+rowId);
  const stdEl=document.getElementById("b-std-"+rowId);
  const qtyEl=document.getElementById("b-qty-"+rowId);
  const priceEl=document.getElementById("b-price-"+rowId);
  const expEl=document.getElementById("b-exp-"+rowId);
  const lotEl=document.getElementById("b-lot-"+rowId);
  const delEl=document.getElementById("b-del-"+rowId);
  const confirmEl=document.getElementById("b-confirm-"+rowId);
  nameEl.addEventListener("input",()=>{ it.rawProductName=nameEl.value; it.confirmed=false; it.manualStd=false; it.error=""; scheduleBatchSuggest(rowId); });
  stdEl.addEventListener("input",()=>{ it.standardName=stdEl.value; it.manualStd=stdEl.value.trim().length>0; it.confirmed=false; it.error=""; refreshBatchRow(rowId,{skipStd:true}); updateBatchSummary(); });
  qtyEl.addEventListener("input",()=>{ it.quantity=qtyEl.value; it.error=""; updateBatchAmount(rowId); updateBatchSummary(); });
  priceEl.addEventListener("input",()=>{ it.unitPrice=priceEl.value; it.error=""; updateBatchAmount(rowId); updateBatchSummary(); });
  expEl.addEventListener("change",()=>{ it.expiryDate=expEl.value; });
  lotEl.addEventListener("input",()=>{ it.lotNo=lotEl.value; it.error=""; });
  delEl.addEventListener("click",()=>{ batchItems=batchItems.filter(x=>x.rowId!==rowId); if(!batchItems.length) batchItems.push(newBatchItem("")); renderBatch(); });
  confirmEl.addEventListener("click",()=>{ it.confirmed=true; it.error=""; refreshBatchRow(rowId); updateBatchSummary(); });
}
function scheduleBatchSuggest(rowId){
  clearTimeout(batchSuggestTimers.get(rowId));
  batchSuggestTimers.set(rowId,setTimeout(async()=>{
    const it=findBatchItem(rowId); if(!it) return;
    await resolveBatchSuggestion(it);
    refreshBatchRow(rowId); updateBatchSummary();
  },200));
}
function updateBatchAmount(rowId){
  const it=findBatchItem(rowId); if(!it) return;
  const amtEl=document.getElementById("b-amt-"+rowId);
  if(amtEl) amtEl.textContent=won(batchRowAmount(it));
}
function refreshBatchRow(rowId,opts={}){
  const it=findBatchItem(rowId); if(!it) return;
  const stdEl=document.getElementById("b-std-"+rowId);
  if(stdEl && !opts.skipStd && !it.manualStd && document.activeElement!==stdEl) stdEl.value=batchDisplayStd(it);
  const status=batchStatusOf(it), meta=batchStatusMeta(status);
  const statEl=document.getElementById("b-stat-"+rowId);
  if(statEl){ statEl.className="bstat "+meta.cls; statEl.textContent=meta.label; }
  const confirmEl=document.getElementById("b-confirm-"+rowId);
  if(confirmEl) confirmEl.style.display = status==="SUGGESTED" ? "" : "none";
  const errEl=document.getElementById("b-err-"+rowId);
  if(errEl) errEl.textContent=it.error||"";
  const rowEl=document.getElementById("b-row-"+rowId);
  if(rowEl) rowEl.classList.toggle("err",Boolean(it.error));
  updateBatchAmount(rowId);
}
function updateBatchSummary(){
  const active=batchActiveItems();
  let done=0,review=0,qty=0,amount=0;
  active.forEach(it=>{ if(batchAllowed(batchStatusOf(it))) done++; else review++; qty+=Number(it.quantity)||0; amount+=batchRowAmount(it); });
  document.getElementById("bs-items").textContent=active.length;
  document.getElementById("bs-done").textContent=done;
  document.getElementById("bs-review").textContent=review;
  document.getElementById("bs-qty").textContent=kg(qty);
  document.getElementById("bs-amount").textContent=won(amount);
  const saveBtn=document.getElementById("batch-save");
  if(saveBtn) saveBtn.disabled=active.length===0;
}
function setBatchMsg(text,color){ const m=document.getElementById("batch-msg"); m.style.color=color||"#6b7280"; m.textContent=text; }
function addBatchRow(){
  if(batchItems.length>=BATCH_MAX){ setBatchMsg("한 번에 최대 20개 상품까지 등록할 수 있습니다.","#b45309"); return; }
  batchItems.push(newBatchItem("")); renderBatch();
}
function fillBatchTo20(){
  const need=BATCH_MAX-batchItems.length;
  if(need<=0){ setBatchMsg("이미 20개 행입니다.","#b45309"); return; }
  for(let i=0;i<need;i++) batchItems.push(newBatchItem(""));
  renderBatch();
}
function resetBatch(){
  batchItems=[]; for(let i=0;i<BATCH_DEFAULT_ROWS;i++) batchItems.push(newBatchItem(""));
  const pasteEl=document.getElementById("batch-paste"); if(pasteEl) pasteEl.value="";
  renderBatch(); setBatchMsg("","#6b7280");
}
function applyBatchPaste(){
  const text=document.getElementById("batch-paste").value||"";
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ setBatchMsg("붙여넣을 상품명이 없습니다.","#b91c1c"); return; }
  const over=lines.length>BATCH_MAX;
  const take=over?lines.slice(0,BATCH_MAX):lines;
  batchItems=take.map(n=>newBatchItem(n));
  renderBatch();
  batchItems.forEach(it=>scheduleBatchSuggest(it.rowId));
  document.getElementById("batch-paste").value="";
  setBatchMsg(over?"한 번에 최대 20개 상품까지 등록할 수 있습니다. 앞 20개만 채웠습니다.":(take.length+"개 행을 채웠습니다."), over?"#b45309":"#166534");
}
async function saveBatch(){
  if(!WORKSPACE.isBusiness){
    if(confirm("일괄 재고 저장은 기업 로그인 후 가능합니다. 로그인하시겠어요?")) location.assign("login.html?next="+encodeURIComponent(location.pathname));
    return;
  }
  const active=batchActiveItems();
  if(!active.length){ setBatchMsg("등록할 상품을 입력하세요.","#b91c1c"); return; }
  for(const it of active){ if(!it.manualStd && !it.suggestion){ await resolveBatchSuggestion(it); } }
  active.forEach(it=>{ it.error=""; });
  const errors=[]; const lotMap=new Map();
  active.forEach(it=>{
    const no=batchItems.indexOf(it)+1;
    const status=batchStatusOf(it);
    if(!batchAllowed(status)){
      it.error = status==="UNRESOLVED" ? "표준상품 확인 필요 (직접 입력하거나 상품명을 수정하세요)" : "표준상품을 확인해 주세요";
      errors.push(no+"번 행: "+it.error);
    } else if(!(Number(it.quantity)>0)){
      it.error="수량을 입력해주세요"; errors.push(no+"번 행: 수량을 입력해주세요");
    } else if(Number(it.unitPrice)<0){
      it.error="단가는 음수일 수 없습니다"; errors.push(no+"번 행: 단가는 음수일 수 없습니다");
    } else {
      const lot=String(it.lotNo||"").trim();
      if(lot){ if(lotMap.has(lot)){ it.error="같은 LOT/이력번호가 중복됩니다"; errors.push(no+"번 행: 같은 LOT/이력번호가 중복됩니다"); } else lotMap.set(lot,no); }
    }
  });
  batchItems.forEach(it=>refreshBatchRow(it.rowId));
  updateBatchSummary();
  if(errors.length){
    setBatchMsg("저장 중단 · "+errors.length+"개 행을 확인하세요. ("+errors.slice(0,3).join(" / ")+(errors.length>3?" …":"")+")","#b91c1c");
    const first=active.find(it=>it.error);
    if(first){ const el=document.getElementById("b-row-"+first.rowId); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"center"}); }
    return;
  }
  const c=batchCommon();
  const rows=active.map(it=>{
    const std=it.manualStd?String(it.standardName||"").trim():(it.suggestion?it.suggestion.suggestedName:"");
    const q=Number(it.quantity)||0, p=Number(it.unitPrice)||0;
    const changed=it.sourceName && PRODUCT_NAMES.fingerprint(it.sourceName)!==PRODUCT_NAMES.fingerprint(std);
    return {
      tenant_id:TENANT_ID, company_id:TENANT_ID, store_id:STORE_ID,
      movement_type:"IN", raw_product_name:std,
      origin:c.origin||null, unit:"kg", quantity:q, unit_price:p, amount:Math.round(q*p),
      movement_date:c.date||todayStr(), expiry_date:it.expiryDate||null,
      trace_no:String(it.lotNo||"").trim()||null, supplier_name:c.supplier||null,
      memo:"거래명세서 일괄등록"+(it.manualStd?" · 직접지정":(changed?" · AI확정 입력명: "+it.sourceName:""))
    };
  });
  const btn=document.getElementById("batch-save");
  btn.disabled=true; setBatchMsg(rows.length+"개 상품을 등록 중…","#6b7280");
  try{
    const response=await fetch(REST+"/inventory_movement",{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(rows)});
    if(!response.ok) throw new Error((await response.text()).slice(0,180)||("HTTP "+response.status));
    setBatchMsg("✓ "+rows.length+"개 상품을 재고에 등록했습니다.","#166534");
    resetBatch();
    await load();
    setTimeout(closeStockRegister,700);
  }catch(error){ setBatchMsg("등록 실패: "+error.message,"#b91c1c"); }
  finally{ btn.disabled=false; }
}
function setStockMode(mode){
  const single=document.getElementById("stock-mode-single");
  const batch=document.getElementById("stock-mode-batch");
  const box=document.getElementById("stock-register-box");
  const title=document.getElementById("stock-register-title");
  const isBatch=mode==="batch";
  single.style.display=isBatch?"none":"";
  batch.style.display=isBatch?"":"none";
  box.classList.toggle("batch-wide",isBatch);
  title.textContent=isBatch?"＋ 거래명세서 기준 여러 상품 등록":"＋ 재고 직접등록";
  document.querySelectorAll("#stock-mode-tabs label").forEach(l=>{
    const on=l.querySelector("input").value===mode; l.classList.toggle("active",on); l.querySelector("input").checked=on;
  });
  if(isBatch){
    if(!document.getElementById("batch-date").value) document.getElementById("batch-date").value=todayStr();
    if(!batchItems.length) resetBatch(); else renderBatch();
  }
}
document.querySelectorAll('input[name="stock-mode"]').forEach(radio=>radio.addEventListener("change",()=>setStockMode(radio.value)));
document.getElementById("batch-add").addEventListener("click",addBatchRow);
document.getElementById("batch-fill20").addEventListener("click",fillBatchTo20);
document.getElementById("batch-reset").addEventListener("click",resetBatch);
document.getElementById("batch-cancel").addEventListener("click",closeStockRegister);
document.getElementById("batch-save").addEventListener("click",saveBatch);
document.getElementById("batch-paste-apply").addEventListener("click",applyBatchPaste);
["batch-storage","batch-origin","batch-supplier"].forEach(id=>document.getElementById(id).addEventListener(id==="batch-storage"?"change":"input",()=>{
  batchItems.forEach(it=>{ if(!it.manualStd && String(it.rawProductName||"").trim()) scheduleBatchSuggest(it.rowId); });
}));

function openAct(kind){
  if(!CURRENT) return;
  const isAdj = kind === "adj";
  const f = document.getElementById("actform");
  f.style.display = "block";
  f.innerHTML =
    "<div style='font-weight:800;margin-bottom:6px'>" + (isAdj ? "🧮 재고 실사(조정)" : "➖ 판매 출고") + " · " + colorName(CURRENT.name) + "</div>" +
    (isAdj
      ? "<div style='color:#6b7280;font-size:13px'>현재 재고 <b>" + kg(CURRENT.qty) + "kg</b>. 실제 남은 수량을 입력하면 차이만큼 자동 반영됩니다.</div><label>실제 남은 수량(kg)<input id='a-val' type='number' step='0.01' placeholder='" + kg(CURRENT.qty) + "'></label>"
      : "<div style='color:#6b7280;font-size:13px'>현재 재고 <b>" + kg(CURRENT.qty) + "kg</b>. 판매/폐기 등으로 나간 수량을 입력하세요.</div><label>출고 수량(kg)<input id='a-val' type='number' step='0.01' placeholder='0'></label>") +
    "<label>날짜<input id='a-date' type='date'></label>" +
    "<label>메모<input id='a-memo' type='text' placeholder='" + (isAdj ? "재고 실사" : "판매 출고") + "'></label>" +
    "<button class='save' id='a-save'>저장</button><div class='amsg' id='a-msg'></div>";
  document.getElementById("a-date").value = todayStr();
  document.getElementById("a-save").addEventListener("click", () => saveAct(kind));
  f.scrollIntoView({ behavior: "smooth", block: "center" });
}
async function saveAct(kind){
  const msg = document.getElementById("a-msg");
  const val = Number(document.getElementById("a-val").value);
  if (isNaN(val) || val < 0) { msg.style.color = "#b91c1c"; msg.textContent = "수량을 입력하세요."; return; }
  const date = document.getElementById("a-date").value || todayStr();
  const memo = (document.getElementById("a-memo").value || "").trim() || (kind === "adj" ? "재고 실사" : "판매 출고");
  let type, qty;
  if (kind === "adj") {
    const diff = CURRENT.qty - val;                 // (+)=줄어듦, (-)=늘어남
    if (Math.abs(diff) < 1e-9) { msg.style.color = "#166534"; msg.textContent = "변동 없음."; return; }
    type = diff > 0 ? "OUT" : "IN"; qty = Math.abs(diff);
  } else { type = "OUT"; qty = val; }
  if (type === "OUT" && qty > CURRENT.qty + 1e-9) {
    if (!confirm("출고 수량이 현재고(" + kg(CURRENT.qty) + "kg)보다 많습니다. 계속할까요?")) return;
  }
  const price = Math.round(CURRENT.avg || 0);
  const row = { tenant_id: TENANT_ID, company_id:TENANT_ID, store_id:STORE_ID, movement_type: type, raw_product_name: CURRENT.name, origin: CURRENT.origin,
    unit: CURRENT.unit || "kg", quantity: qty, unit_price: price, amount: Math.round(qty * (CURRENT.avg || 0)),
    movement_date: date, memo: memo };
  msg.style.color = "#6b7280"; msg.textContent = "저장 중…";
  try {
    const r = await fetch(REST + "/inventory_movement", { method: "POST", headers: { ...H, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify(row) });
    if (!r.ok) throw new Error(r.status + ": " + (await r.text()).slice(0, 150));
    msg.style.color = "#166534"; msg.textContent = "✓ 반영 완료";
    const key = CURRENT.key;
    await load(); showDetail(key, { historyMode: "replace" });
  } catch (e) { msg.style.color = "#b91c1c"; msg.textContent = "실패: " + e.message; }
}
document.getElementById("btn-out").addEventListener("click", () => openAct("out"));
document.getElementById("btn-adj").addEventListener("click", () => openAct("adj"));

load();
</script>
