<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>재고 현황</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 4px; }
  .sub { color:#6b7280; font-size:13px; margin-bottom:12px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .bar a { flex:1; text-align:center; padding:12px; border-radius:10px; background:#16a34a; color:#fff; text-decoration:none; font-weight:700; }
  .bar a.alt { background:#e5e7eb; color:#111827; }
  input#q { width:100%; padding:12px; border:1px solid #d1d5db; border-radius:10px; font-size:15px; margin-bottom:12px; }
  .summary { display:flex; gap:8px; margin-bottom:12px; }
  .kpi { flex:1; background:#fff; border-radius:12px; padding:12px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .kpi b { display:block; font-size:17px; } .kpi span { color:#6b7280; font-size:12px; }
  .twrap { background:#fff; border-radius:12px; overflow-x:auto; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  table { width:100%; border-collapse:collapse; font-size:14px; min-width:480px; }
  th,td { border-bottom:1px solid #eef2f7; padding:10px 8px; text-align:left; white-space:nowrap; }
  th { background:#f8fafc; color:#374151; }
  td.num,th.num { text-align:right; }
  td.name { white-space:normal; min-width:150px; font-weight:600; }
  tr.clickable { cursor:pointer; } tr.clickable:hover td { background:#f9fafb; }
  .chill { color:#2563eb; font-weight:700; } .frozen { color:#0891b2; font-weight:700; }
  .muted { color:#6b7280; font-size:14px; padding:10px; }
  .back { margin:4px 0 10px; display:inline-block; color:#2563eb; cursor:pointer; font-weight:700; }
  .in { color:#166534; font-weight:700; } .out { color:#b91c1c; font-weight:700; }
  .tracelink { color:#2563eb; text-decoration:none; font-weight:700; white-space:nowrap; }
  .prodhead { font-size:18px; font-weight:800; margin:4px 0 10px; }
</style>
</head>
<body>
  <h1>📦 재고 현황</h1>
  <div class="sub">매입 저장 시 자동으로 반영됩니다. 품목을 누르면 입고/출고 내역을 볼 수 있습니다.</div>
  <div class="bar"><a href="scan.html">📷 새로 스캔</a><a href="records.html" class="alt">📋 명세서 목록</a><a href="/" class="alt">🏠 홈</a></div>

  <div id="listView">
    <div class="summary">
      <div class="kpi"><b id="k-items">-</b><span>품목 종류</span></div>
      <div class="kpi"><b id="k-weight">-</b><span>총 중량(kg)</span></div>
      <div class="kpi"><b id="k-amount">-</b><span>총 금액(원)</span></div>
    </div>
    <input id="q" type="text" placeholder="품목명 검색" />
    <div class="twrap">
      <table><thead><tr><th>품목</th><th class="num">현재고(kg)</th><th class="num">재고 금액</th><th class="num">건수</th></tr></thead>
      <tbody id="tb"><tr><td colspan="4" class="muted">불러오는 중...</td></tr></tbody></table>
    </div>
  </div>

  <div id="detailView" style="display:none">
    <span class="back" id="back">‹ 재고 목록</span>
    <div class="prodhead" id="d-name"></div>
    <div class="summary">
      <div class="kpi"><b id="d-qty">-</b><span>현재고(kg)</span></div>
      <div class="kpi"><b id="d-amt">-</b><span>재고 금액</span></div>
      <div class="kpi"><b id="d-cnt">-</b><span>입출고 건수</span></div>
    </div>
    <div class="twrap">
      <table><thead><tr><th>날짜</th><th>구분</th><th class="num">중량(kg)</th><th class="num">단가</th><th class="num">금액</th><th>유통기한</th><th>공급처</th><th>품질이력</th></tr></thead>
      <tbody id="d-tb"></tbody></table>
    </div>
  </div>

<script>
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const ANON_KEY = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const TENANT_ID = "881f6cc1-b552-468c-b9b4-152edb464e61";
const H = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY };
const won = (v) => Number(v||0).toLocaleString("ko-KR");
const kg = (v) => (Math.round((Number(v)||0)*100)/100).toLocaleString("ko-KR");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
function dLeft(exp){ const d=new Date(exp+"T00:00:00"); if(isNaN(d)) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function expiryCell(exp){
  if(!exp) return "<span style='color:#9ca3af'>-</span>";
  const n=dLeft(exp); if(n===null) return esc(exp);
  let bg,txt,label;
  if(n<0){ bg="#fee2e2";txt="#b91c1c";label="만료 "+(-n)+"일"; }
  else if(n<=1){ bg="#ffedd5";txt="#c2410c";label="D-"+n; }
  else if(n<=3){ bg="#fef9c3";txt="#a16207";label="D-"+n; }
  else { bg="#dcfce7";txt="#166534";label="D-"+n; }
  return "<span style='background:"+bg+";color:"+txt+";padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap;font-size:12px'>"+esc(exp)+" · "+label+"</span>";
}

// 품질이력(이력번호) → 축산물통합이력정보 조회 (앱 내 패널로 표시)
const TRACE_FN = "https://pkrsiqjzllyiafwpskll.functions.supabase.co/trace-lookup";
function _ymd(s){ s=String(s||""); return /^\d{8}$/.test(s) ? s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8) : s; }
function _trow(label,val){ return val ? "<div style='display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9'><span style='color:#6b7280'>"+label+"</span><b style='text-align:right'>"+esc(val)+"</b></div>" : ""; }
function _species(s){ return String(s||"").replace("PIG","돼지").replace("CATTLE","소").replace("|LOT_NO"," 묶음").replace("|PIG_NO"," 이력").replace("|CATTLE_NO"," 개체"); }
function _importBody(t,i){
  const warn=(i.salePrhibt==="Y"||i.recallTarget==="Y")?"<div style='background:#fee2e2;color:#b91c1c;border-radius:10px;padding:10px;font-weight:800;margin-bottom:8px'>⚠️ 판매금지·회수대상 이력입니다. 판매 전 확인하세요."+(i.recallContent?"<div style='font-weight:600;font-size:13px;margin-top:4px'>"+esc(i.recallContent)+"</div>":"")+"</div>":"";
  return "<div style='font-size:15px;font-weight:800;margin-bottom:2px'>이력번호 "+esc(t)+"</div>"+
    "<div style='display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;margin-bottom:8px'>🌍 수입 축산물</div>"+warn+
    _trow("품목", i.itemNm)+_trow("부위", i.partNm)+
    _trow("🌍 원산지", i.nationNm)+
    _trow("🔪 도축장", i.butcheryPlaceNm)+_trow("도축기간", i.butcheryYmd)+
    _trow("🏭 가공장", i.processPlaceNm)+_trow("가공기간", i.processYmd)+
    _trow("수출업체", i.exporterNm)+_trow("수입업체", i.importerNm)+
    _trow("B/L 번호", i.blNo)+_trow("소비기한", i.consumeYmd)+
    "<div style='margin-top:10px'><a href='https://www.meatwatch.go.kr' target='_blank' style='color:#2563eb;font-size:13px'>MEATWATCH 공식 조회 ›</a></div>";
}
function _traceModal(){
  let m=document.getElementById("trace-modal");
  if(!m){
    m=document.createElement("div"); m.id="trace-modal";
    m.style.cssText="position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px";
    m.innerHTML="<div style='background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:85vh;overflow:auto;padding:16px'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'><b style='font-size:17px'>🔎 축산물 이력정보</b><button id='trace-close' style='border:none;background:#e5e7eb;border-radius:8px;padding:6px 12px;font-weight:700'>닫기</button></div><div id='trace-body'></div></div>";
    document.body.appendChild(m);
    m.addEventListener("click",function(e){ if(e.target===m) m.style.display="none"; });
    m.querySelector("#trace-close").addEventListener("click",function(){ m.style.display="none"; });
  }
  return m;
}
async function openTrace(no){
  const t=String(no||"").trim(); if(!t) return;
  const m=_traceModal(), body=m.querySelector("#trace-body");
  body.innerHTML="<div style='color:#6b7280;padding:20px;text-align:center'>이력번호 "+esc(t)+"<br>조회 중...</div>";
  m.style.display="flex";
  try{
    const r=await fetch(TRACE_FN+"?traceNo="+encodeURIComponent(t),{headers:{Authorization:"Bearer "+ANON_KEY,apikey:ANON_KEY},signal:AbortSignal.timeout(30000)});
    const b=await r.json(), i=b.info||{};
    if((b.source||i.source)==="import"){ body.innerHTML=_importBody(t,i); return; }
    if(!b.ok){
      body.innerHTML="<div style='padding:6px 2px'>이 번호의 <b>국내</b> 축산물 이력정보가 없습니다.<div style='color:#6b7280;font-size:13px;margin-top:4px'>수입육이면 아래에서 조회하세요.</div></div>"+
        "<div style='margin-top:12px;display:flex;gap:8px'><a href='https://www.meatwatch.go.kr' target='_blank' style='flex:1;text-align:center;padding:12px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:700'>수입 이력 조회</a><a href='https://www.mtrace.go.kr/hstryinq/hstryInqCattle.do' target='_blank' style='flex:1;text-align:center;padding:12px;border-radius:10px;background:#e5e7eb;color:#111827;text-decoration:none;font-weight:700'>국내 이력제</a></div>";
      return;
    }
    body.innerHTML=
      "<div style='font-size:15px;font-weight:800;margin-bottom:6px'>이력번호 "+esc(t)+"</div>"+
      _trow("구분", i.kind)+_trow("축종", _species(i.species))+
      _trow("🔪 도축장", i.butcheryPlaceNm)+_trow("도축장 주소", i.butcheryPlaceAddr)+
      _trow("도축일자", _ymd(i.butcheryYmd))+_trow("도축검사", i.butcheryResult==="Y"?"합격":i.butcheryResult)+
      _trow("등급", i.grade)+_trow("근내지방도", i.insfat)+
      _trow("🏠 농장주소", i.farmAddr)+_trow("사육자", i.farmerNm)+
      _trow("포장처리업소", i.processPlaceNm)+_trow("수입국", i.nationNm)+
      "<div style='margin-top:10px'><a href='https://www.mtrace.go.kr/hstryinq/hstryInqPig.do' target='_blank' style='color:#2563eb;font-size:13px'>공식 축산물이력제에서 자세히 보기 ›</a></div>";
  }catch(e){
    body.innerHTML="<div style='padding:10px;color:#b91c1c'>조회 실패: "+esc(e.name==="TimeoutError"?"시간 초과":e.message)+"</div>";
  }
}
document.addEventListener("click", function(e){ const a=e.target.closest && e.target.closest(".tracelink"); if(a){ e.preventDefault(); openTrace(a.dataset.no); } });

const ORIGIN_WORDS = /^(국내산|미국산|수입산|수입|호주산|캐나다산|브라질산|덴마크산|스페인산|칠레산|네덜란드산|멕시코산)$/;
// 냉동/냉장 구분은 유지하고, 뒤에 붙은 원산지 꼬리표만 제거해 동일 품목을 하나로 묶는다.
function normName(s) {
  return String(s || "").split(/\s+/).filter((t) => t && !ORIGIN_WORDS.test(t)).join(" ").trim() || "(미인식)";
}

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

let MOVES = [];      // 원장 전체
let GROUPS = [];     // 정규화 품목별 집계

function sign(m){ return m.movement_type === "OUT" ? -1 : 1; }

async function load() {
  try {
    const url = REST + "/inventory_movement?tenant_id=eq." + TENANT_ID +
      "&select=raw_product_name,origin,unit,quantity,unit_price,amount,movement_type,movement_date,supplier_name,trace_no,slaughter_date,expiry_date,created_at&limit=5000";
    const r = await fetch(url, { headers: H });
    if (!r.ok) throw new Error("HTTP " + r.status);
    MOVES = await r.json();
    const map = new Map();
    for (const m of MOVES) {
      const key = normName(m.raw_product_name);
      const e = map.get(key) || { key, name: key, qty: 0, amount: 0, count: 0 };
      e.qty += sign(m) * (Number(m.quantity) || 0);
      e.amount += sign(m) * (Number(m.amount) || 0);
      e.count += 1;
      map.set(key, e);
    }
    GROUPS = [...map.values()].sort((a, b) => b.amount - a.amount);
    document.getElementById("k-items").textContent = GROUPS.length;
    document.getElementById("k-weight").textContent = kg(GROUPS.reduce((s, e) => s + e.qty, 0));
    document.getElementById("k-amount").textContent = won(GROUPS.reduce((s, e) => s + e.amount, 0));
    renderList(GROUPS);
  } catch (e) {
    document.getElementById("tb").innerHTML = "<tr><td colspan='4' class='muted'>불러오기 실패: " + esc(e.message) + "</td></tr>";
  }
}

function colorName(name) {
  if (name.indexOf("냉동") === 0) return "<span class='frozen'>냉동</span>" + esc(name.slice(2));
  if (name.indexOf("냉장") === 0) return "<span class='chill'>냉장</span>" + esc(name.slice(2));
  return esc(name);
}

function renderList(list) {
  const tb = document.getElementById("tb");
  if (!list.length) { tb.innerHTML = "<tr><td colspan='4' class='muted'>반영된 재고가 없습니다.</td></tr>"; return; }
  tb.innerHTML = list.map((e) =>
    "<tr class='clickable' data-key=\"" + esc(e.key) + "\"><td class='name'>" + colorName(e.name) + "</td>" +
    "<td class='num'>" + kg(e.qty) + "</td><td class='num'>" + won(e.amount) + "</td><td class='num'>" + e.count + "</td></tr>"
  ).join("");
  tb.querySelectorAll("tr.clickable").forEach((tr) => tr.addEventListener("click", () => showDetail(tr.dataset.key)));
}

function showDetail(key) {
  const rows = MOVES.filter((m) => normName(m.raw_product_name) === key)
    .sort((a, b) => String(b.movement_date || b.created_at || "").localeCompare(String(a.movement_date || a.created_at || "")));
  const qty = rows.reduce((s, m) => s + sign(m) * (Number(m.quantity) || 0), 0);
  const amt = rows.reduce((s, m) => s + sign(m) * (Number(m.amount) || 0), 0);
  document.getElementById("d-name").innerHTML = colorName(key);
  document.getElementById("d-qty").textContent = kg(qty);
  document.getElementById("d-amt").textContent = won(amt);
  document.getElementById("d-cnt").textContent = rows.length;
  document.getElementById("d-tb").innerHTML = rows.map((m) =>
    "<tr><td>" + esc(m.movement_date || (m.created_at ? m.created_at.slice(0,10) : "-")) + "</td>" +
    "<td class='" + (m.movement_type === "OUT" ? "out" : "in") + "'>" + (m.movement_type === "OUT" ? "출고" : "입고") + "</td>" +
    "<td class='num'>" + kg(m.quantity) + "</td><td class='num'>" + won(m.unit_price) + "</td>" +
    "<td class='num'>" + won(m.amount) + "</td><td>" + expiryCell(m.expiry_date) + "</td><td>" + esc(m.supplier_name || m.origin || "-") + "</td>" +
    "<td>" + (m.trace_no ? "<a href='#' class='tracelink' data-no=\"" + esc(m.trace_no) + "\">" + esc(m.trace_no) + " 🔎</a>" : "-") + "</td></tr>"
  ).join("");
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "block";
  window.scrollTo(0, 0);
}

document.getElementById("back").addEventListener("click", () => {
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display = "block";
});

document.getElementById("q").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  renderList(q ? GROUPS.filter((x) => x.name.toLowerCase().includes(q)) : GROUPS);
});

load();
</script>
</body>
</html>
