<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>정육비서</title>
<style>
  /* 첫 화면 (2026-11 개편): 토스·캐시노트 톤 — 흰 카드, 큰 숫자, 분홍 포인트 */
  :root { --pk:#E5536B; --pk-dark:#C23A52; --pk-soft:#FFF1F3; --ink:#191F28; --ink2:#4E5968; --mute:#8B95A1; --line:#F2F4F6; --bg:#F2F4F6; }
  * { box-sizing:border-box; }
  html, body { background:var(--bg) !important; }
  body { margin:0; font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; color:var(--ink); }
  .home { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .hc { display:block; background:#fff; border-radius:22px; padding:20px; text-decoration:none; color:inherit; }
  a.hc:active { transform:scale(.99); }
  .hc-top { display:flex; align-items:center; justify-content:space-between; color:var(--ink2); font-size:15px; font-weight:700; }
  .hc-top .chev { color:#B0B8C1; font-size:20px; line-height:1; }
  .big { display:block; font-size:30px; font-weight:800; letter-spacing:-.03em; margin:6px 0 0; font-variant-numeric:tabular-nums; }
  .num { font-variant-numeric:tabular-nums; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:15px; color:var(--ink2); }
  .row b { font-size:17px; color:var(--ink); }
  .mini { margin-top:6px; font-size:13.5px; color:var(--mute); min-height:18px; }

  .quick { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:#fff; border-radius:22px; padding:16px 8px 14px; }
  .q { display:flex; flex-direction:column; align-items:center; gap:7px; border:0; background:transparent; font:inherit; color:var(--ink); text-decoration:none; cursor:pointer; padding:4px 0; }
  body.mt-app-shell .q { min-height:0; }
  .q .qi { width:52px; height:52px; border-radius:17px; display:flex; align-items:center; justify-content:center; background:var(--line); color:var(--ink2); }
  .q.main .qi { background:var(--pk); color:#fff; box-shadow:0 6px 14px rgba(229,83,107,.28); }
  .q span.ql { font-size:13.5px; font-weight:700; line-height:1.25; text-align:center; }

  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .two div { background:var(--line); border-radius:16px; padding:14px; }
  .two div.hl { background:var(--pk-soft); }
  .two span { display:block; font-size:13px; color:var(--ink2); font-weight:600; }
  .two b { display:block; font-size:21px; font-weight:800; margin-top:4px; letter-spacing:-.02em; }
  .two div.hl b { color:var(--pk-dark); }
  .nexts { margin-top:12px; }
  .nx { display:flex; justify-content:space-between; padding:8px 2px; font-size:14.5px; color:var(--ink2); }
  .nx b { color:var(--ink); }
  .connect { display:flex; align-items:center; gap:12px; margin-top:12px; padding:14px; border-radius:16px; background:var(--pk-soft); color:var(--pk-dark); font-weight:700; font-size:14.5px; line-height:1.45; }

  .san { display:flex; align-items:center; gap:14px; }
  .san .si { flex:none; width:48px; height:48px; border-radius:15px; display:flex; align-items:center; justify-content:center; background:#EEF4FF; color:#2F6FEB; }
  .san .st { flex:1; min-width:0; }
  .san .st b { display:block; font-size:16.5px; font-weight:800; }
  .san .st small { display:block; font-size:13.5px; color:var(--mute); margin-top:2px; }
  .pill { flex:none; padding:8px 14px; border-radius:999px; font-size:14px; font-weight:800; background:var(--pk); color:#fff; white-space:nowrap; }
  .pill.done { background:#E8F7EE; color:#178B4C; }
  .san-sub { display:flex; gap:16px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .san-sub a { font-size:14px; font-weight:700; color:var(--ink2); text-decoration:none; }

  .setup h2 { margin:0; font-size:18px; font-weight:800; }
  .setup .sub2 { font-size:14px; color:var(--mute); margin:4px 0 12px; }
  .bar { height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-bottom:6px; }
  .bar i { display:block; height:100%; background:var(--pk); border-radius:999px; }
  .step { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); text-decoration:none; color:inherit; }
  .step:first-of-type { border-top:0; }
  .step .sc { flex:none; width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center; background:var(--line); color:var(--ink2); }
  .step.done .sc { background:#E8F7EE; color:#178B4C; }
  .step .sx { flex:1; min-width:0; }
  .step .sx b { display:block; font-size:15.5px; font-weight:700; }
  .step .sx small { display:block; font-size:13px; color:var(--mute); margin-top:1px; line-height:1.4; }
  .step .sa { flex:none; font-size:13.5px; font-weight:800; color:var(--pk-dark); }
  .step.done .sa { color:#178B4C; }
  .step.done .sx b { color:var(--mute); }
  .warnline { font-size:13.5px; color:#B45309; background:#FFF7E6; border-radius:12px; padding:10px 12px; margin-top:10px; display:none; }
  @media (max-width:360px){ .big { font-size:26px; } .two b { font-size:18px; } .q .qi { width:46px; height:46px; } }
</style>
</head>
<body>
<script src="header.js"></script>
<main class="home">

  <!-- 자주 쓰는 기능: 정육비서의 강점(명세서 촬영 입고)을 맨 앞에 -->
  <nav class="quick" aria-label="자주 쓰는 기능">
    <button type="button" class="q main" id="q-cam"><span class="qi" data-ic="camera"></span><span class="ql">명세서<br>찍기</span></button>
    <a class="q" href="sell.html"><span class="qi" data-ic="scan"></span><span class="ql">판매<br>스캔</span></a>
    <a class="q" href="sanitation.html"><span class="qi" data-ic="clip"></span><span class="ql">위생<br>일지</span></a>
    <a class="q" href="stock.html"><span class="qi" data-ic="box"></span><span class="ql">재고</span></a>
  </nav>

  <!-- 매출 -->
  <a class="hc" href="sales.html" aria-label="매출 자세히 보기">
    <div class="hc-top"><span>오늘 매출</span><span class="chev">›</span></div>
    <b class="big" id="s-today">-</b>
    <div class="mini" id="s-chan">&nbsp;</div>
    <div class="row"><span>이번 달 누적</span><b class="num" id="s-month">-</b></div>
    <div class="warnline" id="dup-note"></div>
  </a>

  <!-- 카드 입금 -->
  <a class="hc" href="settlement.html" aria-label="카드 입금 자세히 보기">
    <div class="hc-top"><span>카드 입금 예정</span><span class="chev">›</span></div>
    <div class="two">
      <div class="hl"><span>오늘 들어올 돈</span><b class="num" id="c-today">-</b></div>
      <div><span>남은 입금 (오늘 포함)</span><b class="num" id="c-left">-</b></div>
    </div>
    <div class="nexts" id="c-next"></div>
    <div class="connect" id="c-connect" style="display:none"><span data-ic="card"></span><span>카드매출 조회를 한 번 연결하면 언제·얼마 들어오는지 자동으로 보여 드려요</span></div>
  </a>

  <!-- 위생일지 -->
  <div class="hc">
    <a class="san" href="sanitation.html" style="text-decoration:none;color:inherit">
      <span class="si" data-ic="clip"></span>
      <span class="st"><b>오늘 위생 점검표</b><small id="san-desc">축산물 일일 위생 점검</small></span>
      <span class="pill" id="san-pill">작성하기</span>
    </a>
    <div class="san-sub"><a href="sanitation-list.html">월별 점검표 보기 ›</a><a href="overview.html">유통기한·재고 한눈에 ›</a></div>
  </div>

  <!-- 시작하기: 무엇을 하면 어떤 숫자가 자동으로 채워지는지 -->
  <section class="hc setup" id="setup" style="display:none" aria-labelledby="setup-title">
    <h2 id="setup-title">정육비서 시작하기</h2>
    <div class="sub2" id="setup-sub"></div>
    <div class="bar"><i id="setup-bar" style="width:0"></i></div>
    <div id="setup-steps"></div>
  </section>

</main>
<script>
const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const H = window.MEATOS_API_HEADERS || {};
const HJ = { ...H, "Content-Type": "application/json" };
const CTX = window.MEATOS_CONTEXT || {};
const TENANT = window.MEATOS_TENANT;
const STORE = CTX.storeId || null;
const BIZ = Boolean(window.MEATOS_CAN_PERSIST);
const IC = window.MEATOS_ICON || (() => "");
const won = (v) => Math.round(Number(v)||0).toLocaleString("ko-KR") + "원";
const WD = ["일","월","화","수","목","금","토"];
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function plus(n){ const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); }
const TODAY = ymd(new Date());
function md(iso){ const d=new Date(iso+"T00:00:00"); return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")"; }
const CHANNEL_NAMES = { STORE:"매장", COUPANG:"쿠팡이츠", BAEMIN:"배민", YOGIYO:"요기요", MEATBONGA:"정육본가", ETC:"기타" };

document.querySelectorAll("[data-ic]").forEach(el => { el.innerHTML = IC(el.dataset.ic, el.closest(".q") ? 26 : 24); });
document.getElementById("q-cam").addEventListener("click", () => { if (window.MEATOS_OPEN_CAPTURE) window.MEATOS_OPEN_CAPTURE(); else location.assign("scan.html?pick=1"); });

async function rpc(name){ const r = await fetch(REST+"/rpc/"+name, { method:"POST", headers:HJ, body:"{}" }); const b = await r.json().catch(()=>null); if(!r.ok) throw new Error((b&&(b.message||b.code))||("HTTP "+r.status)); return b; }
async function rows(path){ try{ const r = await fetch(REST+path, { headers:H }); return r.ok ? await r.json() : []; }catch(e){ return []; } }

// ── 매출: 오늘 / 이번 달 누적 ──
function renderSales(today, month, channels){
  document.getElementById("s-today").textContent = won(today);
  document.getElementById("s-month").textContent = won(month);
  const t = channels || [];
  document.getElementById("s-chan").textContent = t.length > 1 || (t.length === 1 && t[0].channel !== "STORE")
    ? t.map(x => (CHANNEL_NAMES[x.channel]||x.channel)+" "+won(x.amount)).join(" · ") : "";
}
// ── 카드 입금: 오늘 / 남은(오늘 포함) / 다가오는 3일 ──
function renderCard(list, connected){
  const sched = list.filter(r => r.status === "SCHEDULED" && r.deposit_date >= TODAY);
  const sum = a => a.reduce((s,r)=>s+(Number(r.deposit_amt)||0),0);
  document.getElementById("c-today").textContent = won(sum(sched.filter(r=>r.deposit_date===TODAY)));
  document.getElementById("c-left").textContent = won(sum(sched));
  const byDay = {};
  sched.forEach(r => { byDay[r.deposit_date] = (byDay[r.deposit_date]||0) + (Number(r.deposit_amt)||0); });
  const days = Object.keys(byDay).sort().slice(0,3);
  document.getElementById("c-next").innerHTML = days.map(d => "<div class='nx'><span>"+md(d)+(d===TODAY?" · 오늘":"")+"</span><b class='num'>"+won(byDay[d])+"</b></div>").join("");
  document.getElementById("c-connect").style.display = connected ? "none" : "flex";
}
// ── 위생일지 ──
function renderSanitation(done){
  const pill = document.getElementById("san-pill");
  pill.textContent = done ? "작성 완료" : "작성하기";
  pill.classList.toggle("done", done);
  document.getElementById("san-desc").textContent = done ? "오늘 점검을 마쳤어요" : "아직 안 썼어요 · 체크만 하면 1분";
}
// ── 시작하기 ──
function renderSetup(st){
  const steps = [
    { done:st.biz, icon:"store", title:"사업장 연동", desc:"사업자번호만 넣으면 내 가게 데이터로 바뀌어요", href: st.loggedIn ? "business-verify.html" : "login.html", action: st.loggedIn ? "연동하기" : "로그인" },
    { done:st.pos, icon:"pos", title:"POS 연결", desc:"계산대에서 찍은 라벨이 오늘 매출로 자동 기록돼요", href:"connect.html", action:"연결하기" },
    { done:st.card, icon:"card", title:"카드매출 조회 연결", desc:"카드 대금이 언제·얼마 들어오는지 자동으로 보여요", href:"settlement.html", action:"연결하기" },
    { done:st.intake, icon:"camera", title:"첫 거래명세서 찍기", desc:"품목·중량·이력번호가 입고와 재고로 들어가요", href:"#cam", action:"찍어보기" }
  ];
  const n = steps.filter(s=>s.done).length;
  const box = document.getElementById("setup");
  if (n === steps.length) { box.style.display = "none"; return; }
  box.style.display = "";
  document.getElementById("setup-sub").textContent = steps.length+"단계 중 "+n+"단계 완료 · 다 하면 매출·카드·재고가 저절로 채워져요";
  document.getElementById("setup-bar").style.width = Math.round(n/steps.length*100)+"%";
  document.getElementById("setup-steps").innerHTML = steps.map(s =>
    "<a class='step"+(s.done?" done":"")+"' href='"+s.href+"'><span class='sc'>"+IC(s.done?"clip":s.icon,22)+"</span>"+
    "<span class='sx'><b>"+s.title+"</b><small>"+s.desc+"</small></span><span class='sa'>"+(s.done?"완료":s.action+" ›")+"</span></a>").join("");
  document.querySelectorAll(".step[href='#cam']").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById("q-cam").click(); }));
}

async function load(){
  if (!BIZ) {
    // 체험(샘플) 화면
    renderSales(412300, 18452000, [{channel:"STORE",amount:356100},{channel:"COUPANG",amount:56200}]);
    renderCard([
      { deposit_date:plus(0), deposit_amt:812300, status:"SCHEDULED" },
      { deposit_date:plus(1), deposit_amt:1043200, status:"SCHEDULED" },
      { deposit_date:plus(3), deposit_amt:1039000, status:"SCHEDULED" }
    ], true);
    renderSanitation(false);
    renderSetup({ loggedIn: CTX.mode === "MEMBER_DEMO", biz:false, pos:false, card:false, intake:false });
    return;
  }
  const storeFilter = STORE ? "&store_id=eq."+encodeURIComponent(STORE) : "";
  const [brief, chans, cards, san, pos, intake] = await Promise.all([
    rpc("get_money_brief").catch(() => null),
    rpc("get_channel_sales").catch(() => null),
    rows("/card_settlement?company_id=eq."+TENANT+storeFilter+"&status=eq.SCHEDULED&deposit_date=gte."+TODAY+"&select=deposit_date,deposit_amt,status&order=deposit_date.asc&limit=3000"),
    rows("/daily_sanitation_logs?tenant_id=eq."+TENANT+"&work_date=eq."+TODAY+"&select=id&limit=1"),
    rows("/sales_record?tenant_id=eq."+TENANT+"&source=eq.local-agent&select=id&limit=1"),
    rows("/inventory_movement?tenant_id=eq."+TENANT+"&movement_type=eq.IN&select=id&limit=1")
  ]);
  renderSales(brief?.today?.amount, brief?.month?.sales, chans?.today);
  const cardConnected = Boolean(brief?.cardDeposits?.hasData) || cards.length > 0;
  renderCard(cards, cardConnected);
  renderSanitation(san.length > 0);
  renderSetup({ loggedIn:true, biz:true, pos:pos.length > 0, card:cardConnected, intake:intake.length > 0 });
  const dups = chans?.possibleDuplicates || [];
  const note = document.getElementById("dup-note");
  if (dups.length) {
    note.style.display = "block";
    note.textContent = "배달로 찍은 라벨 "+dups.length+"건이 POS에서도 같은 시간대에 찍혔어요. 같은 상품이면 매출현황에서 한 건을 판매취소해 주세요.";
  }
}
load();
</script>
</body>
</html>
