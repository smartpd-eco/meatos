<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>기업회원 인증</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 4px; }
  .sub { color:#6b7280; font-size:13px; margin-bottom:12px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:15px; margin:0 0 10px; }
  label { font-size:12px; color:#6b7280; display:block; margin-top:10px; }
  input.f, select.f { width:100%; padding:11px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; margin-top:4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button.primary { width:100%; margin-top:14px; padding:14px; font-size:16px; font-weight:800; border:none; border-radius:12px; background:#16a34a; color:#fff; cursor:pointer; }
  .msg { font-size:13px; margin-top:8px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; font-weight:800; font-size:13px; }
  .b-sub{background:#dbeafe;color:#1e40af;} .b-ok{background:#dcfce7;color:#166534;} .b-rej{background:#fee2e2;color:#b91c1c;} .b-none{background:#f3f4f6;color:#374151;}
  .warn { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:10px; padding:10px 12px; font-size:13px; }
</style>
</head>
<body>
  <h1>🏢 기업회원 인증</h1>
  <div class="sub">간편로그인은 개인 계정 확인일 뿐입니다. 정육점 사업체 인증을 완료해야 매입·재고·POS·정산 기능을 정식 사용할 수 있습니다.</div>

  <div class="card">
    <div>현재 상태: <span class="badge b-none" id="status">확인 중…</span></div>
    <div class="msg" id="status-msg"></div>
  </div>

  <div class="card" id="form-card">
    <h2>사업체 정보 신청</h2>
    <label>사업자등록번호(10자리)<input class="f" id="f-bizno" inputmode="numeric" placeholder="0000000000" /></label>
    <div class="row2">
      <div><label>상호<input class="f" id="f-name" placeholder="예: 벽산정육점" /></label></div>
      <div><label>대표자명<input class="f" id="f-rep" placeholder="대표자" /></label></div>
    </div>
    <label>사업장 주소<input class="f" id="f-addr" placeholder="도로명 주소" /></label>
    <div class="row2">
      <div><label>신청 유형<select class="f" id="f-type"><option value="OWNER">대표자</option><option value="EMPLOYEE">직원</option><option value="AGENT">대리인</option></select></label></div>
      <div><label>영업 종류<select class="f" id="f-lic">
        <option value="MEAT_RETAIL">식육판매업</option>
        <option value="MEAT_PROCESSING_RETAIL">식육즉석판매가공업</option>
        <option value="MEAT_BYPRODUCT_RETAIL">식육부산물전문판매업</option>
        <option value="LIVESTOCK_DISTRIBUTION">축산물유통전문판매업</option>
        <option value="OTHER">기타</option>
      </select></label></div>
    </div>
    <label>축산물 영업신고번호<input class="f" id="f-licno" placeholder="신고번호" /></label>
    <button class="primary" id="submit">인증 신청 제출</button>
    <div class="msg" id="msg"></div>
    <div class="warn" style="margin-top:12px">서류(사업자등록증·영업신고필증) 업로드와 관리자 심사·자동 진위확인은 다음 단계에서 추가됩니다. 지금은 신청 정보만 접수됩니다.</div>
  </div>

<script src="header.js"></script>
<script>
const REST="https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
const ANON="sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const H={apikey:ANON,Authorization:"Bearer "+ANON};
const HW={...H,"Content-Type":"application/json"};
const esc=(s)=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
let USER=null; try{USER=JSON.parse(localStorage.getItem("meatos_user_cache")||"null");}catch(e){}

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

const STAT={ BUSINESS_SUBMITTED:["b-sub","신청 접수됨 · 심사 대기"], UNDER_REVIEW:["b-sub","심사 중"], SUPPLEMENT_REQUIRED:["b-rej","보완 요청"], APPROVED:["b-ok","승인 완료"], REJECTED:["b-rej","반려"], };
function paint(row){
  const el=document.getElementById("status");
  if(!row){ el.className="badge b-none"; el.textContent="미신청"; document.getElementById("status-msg").textContent="아래에서 사업체 인증을 신청하세요."; return; }
  const s=STAT[row.status]||["b-none",row.status];
  el.className="badge "+s[0]; el.textContent=s[1];
  document.getElementById("status-msg").innerHTML = "신청: <b>"+esc(row.business_name)+"</b> ("+esc(row.business_number)+") · "+ (row.submitted_at||"").slice(0,10) + (row.rejection_note?(" · 사유: "+esc(row.rejection_note)):"");
  if(row.status==="APPROVED"){ document.getElementById("form-card").style.display="none"; }
  // 폼 미리채움
  document.getElementById("f-bizno").value=row.business_number||""; document.getElementById("f-name").value=row.business_name||"";
  document.getElementById("f-rep").value=row.representative_name||""; document.getElementById("f-addr").value=row.business_address||"";
}
async function load(){
  if(USER&&USER.company_name){ document.getElementById("f-name").value=USER.company_name; }
  if(!USER||!USER.id){ document.getElementById("status-msg").innerHTML="<b>로그인 후</b> 신청할 수 있습니다. <a href='login.html'>로그인 →</a>"; return; }
  try{
    const r=await fetch(REST+"/business_verification?applicant_user_id=eq."+USER.id+"&select=*&order=submitted_at.desc&limit=1",{headers:H});
    const rows=r.ok?await r.json():[];
    paint(rows[0]||null);
  }catch(e){ paint(null); }
}
load();

document.getElementById("submit").addEventListener("click", async ()=>{
  const msg=document.getElementById("msg");
  const bizno=(document.getElementById("f-bizno").value||"").replace(/\D/g,"");
  const name=(document.getElementById("f-name").value||"").trim();
  const rep=(document.getElementById("f-rep").value||"").trim();
  if(bizno.length!==10){ msg.style.color="#b91c1c"; msg.textContent="사업자등록번호 10자리를 정확히 입력하세요."; return; }
  if(!name||!rep){ msg.style.color="#b91c1c"; msg.textContent="상호·대표자명을 입력하세요."; return; }
  if(!USER||!USER.id){ msg.style.color="#b91c1c"; msg.textContent="로그인이 필요합니다."; return; }
  const row={ applicant_user_id:USER.id, company_id:USER.company_id||null, business_number:bizno, business_name:name,
    representative_name:rep, business_address:(document.getElementById("f-addr").value||"").trim()||null,
    applicant_type:document.getElementById("f-type").value, license_type:document.getElementById("f-lic").value,
    license_number:(document.getElementById("f-licno").value||"").trim()||null,
    requested_role: document.getElementById("f-type").value==="OWNER"?"COMPANY_OWNER":"EMPLOYEE",
    status:"BUSINESS_SUBMITTED" };
  msg.style.color="#6b7280"; msg.textContent="제출 중…";
  try{
    const r=await fetch(REST+"/business_verification",{method:"POST",headers:{...HW,Prefer:"return=minimal"},body:JSON.stringify(row)});
    if(!r.ok) throw new Error(r.status+": "+(await r.text()).slice(0,150));
    // 계정 상태 갱신
    fetch(REST+"/account?auth_user_id=eq."+USER.id,{method:"PATCH",headers:{...HW,Prefer:"return=minimal"},body:JSON.stringify({member_status:"BUSINESS_SUBMITTED"})}).catch(()=>{});
    msg.style.color="#166534"; msg.textContent="✓ 인증 신청이 접수되었습니다. 심사 후 알려드립니다.";
    load();
  }catch(e){ msg.style.color="#b91c1c"; msg.textContent="제출 실패: "+e.message; }
});
</script>
</body>
</html>
