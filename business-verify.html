<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>사업장 연동 · 정육비서</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f3f4f6; color:#111827; padding:14px; }
  h1 { font-size:19px; margin:2px 0 4px; }
  .sub { color:#6b7280; font-size:13px; margin-bottom:12px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:15px; margin:0 0 10px; }
  label { font-size:12px; color:#6b7280; display:block; margin-top:10px; }
  input.f, select.f { width:100%; padding:11px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; margin-top:4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .inline { display:flex; gap:8px; margin-top:4px; }
  .inline input { flex:1; }
  button.b { border:none; border-radius:8px; padding:11px 14px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .b-check { background:#2563eb; color:#fff; }
  button.primary { width:100%; margin-top:14px; padding:14px; font-size:16px; font-weight:800; border:none; border-radius:12px; background:#16a34a; color:#fff; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; font-weight:800; font-size:13px; }
  .b-ok{background:#dcfce7;color:#166534;} .b-no{background:#fee2e2;color:#b91c1c;} .b-none{background:#f3f4f6;color:#374151;}
  .msg { font-size:13px; margin-top:8px; }
  .consent { display:flex; gap:10px; align-items:flex-start; margin-top:14px; padding:13px; border:1px solid #bbf7d0; border-radius:10px; background:#f0fdf4; }
  .consent input { width:20px; height:20px; margin:1px 0 0; flex:0 0 auto; }
  .consent strong { display:block; font-size:14px; margin-bottom:4px; }
  .consent span { display:block; color:#4b5563; font-size:12px; line-height:1.55; }
</style>
</head>
<body>
  <h1>사업장 연동</h1>
  <div class="sub">사업자등록번호를 조회해 <b>계속사업자</b>로 확인되면 바로 사업장이 연동됩니다. 별도 심사·서류 제출은 없습니다.</div>

  <div class="card">
    <div>연동 상태: <span class="badge b-none" id="status">확인 중…</span></div>
    <div class="msg" id="status-msg"></div>
  </div>

  <div class="card" id="form-card">
    <h2>사업자 정보</h2>
    <label for="f-bizno">사업자등록번호(10자리)</label>
    <div class="inline">
      <input class="f" id="f-bizno" inputmode="numeric" placeholder="0000000000" />
      <button class="b b-check" id="check">사업자 인증</button>
    </div>
    <div class="msg" id="chk-msg"></div>

    <div class="row2">
      <div><label>상호<input class="f" id="f-name" placeholder="예: 벽산정육점" /></label></div>
      <div><label>대표자명<input class="f" id="f-rep" placeholder="대표자" /></label></div>
    </div>

    <label for="f-addr">사업장 주소</label>
    <div class="inline">
      <input class="f" id="f-addr" placeholder="주소 검색을 눌러주세요" readonly />
      <button class="b b-check" id="addr-btn" style="background:#374151">주소 검색</button>
    </div>
    <input class="f" id="f-addr2" aria-label="사업장 상세주소" placeholder="상세주소(선택)" style="margin-top:6px" />

    <div class="row2">
      <div><label>영업 종류<select class="f" id="f-lic">
        <option value="MEAT_RETAIL">식육판매업</option>
        <option value="MEAT_PROCESSING_RETAIL">식육즉석판매가공업</option>
        <option value="MEAT_BYPRODUCT_RETAIL">식육부산물전문판매업</option>
        <option value="LIVESTOCK_DISTRIBUTION">축산물유통전문판매업</option>
        <option value="OTHER">기타</option>
      </select></label></div>
      <div><label>축산물 영업신고번호<input class="f" id="f-licno" placeholder="선택" /></label></div>
    </div>

    <label class="consent">
      <input type="checkbox" id="tenant-consent" />
      <span>
        <strong>회사 전용 데이터 공간으로 전환하는 데 동의합니다.</strong>
        체험 데이터는 회사 공간으로 복사되지 않으며, 매입·재고·매출·OCR 기록은 이 사업장 전용 공간에 새로 저장됩니다.
      </span>
    </label>

    <button class="primary" id="link" disabled>사업장 연동하기</button>
    <div class="msg" id="msg"></div>
  </div>

<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script>
const SB_URL="https://pkrsiqjzllyiafwpskll.supabase.co";
const REST=SB_URL+"/rest/v1";
const ANON="sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
const BIZ_FN="https://pkrsiqjzllyiafwpskll.functions.supabase.co/biz-status";
const sbClient=supabase.createClient(SB_URL,ANON,{auth:{persistSession:true,detectSessionInUrl:true}});
const H=window.MEATOS_API_HEADERS;
const HW={...H,"Content-Type":"application/json"};
const esc=(s)=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
let USER=null; try{USER=JSON.parse(localStorage.getItem("meatos_user_cache")||"null");}catch(e){}
let VERIFIED=false;
const consent=document.getElementById("tenant-consent");
const linkButton=document.getElementById("link");
function refreshLinkState(){ linkButton.disabled=!(VERIFIED && consent.checked); }
consent.addEventListener("change", refreshLinkState);

async function requireOk(response, label){
  let body=null;
  const text=await response.text();
  try{ body=text ? JSON.parse(text) : null; }catch(e){ body=text; }
  if(response.ok) return body;
  const error=new Error(label+" 처리에 실패했습니다");
  error.status=response.status;
  error.body=body;
  throw error;
}

function safeDiagnostic(value){
  let text="";
  try{ text=typeof value==="string" ? value : JSON.stringify(value); }catch(e){ text=String(value||""); }
  return text
    .replace(/[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}/g,"[TOKEN]")
    .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,"[EMAIL]")
    .replace(/\b\d{10}\b/g,"[BUSINESS_NO]")
    .slice(0,500);
}

function logLinkError(error){
  console.error("[business-link] request failed",{
    status:Number(error&&error.status)||null,
    responseBody:safeDiagnostic(error&&error.body),
    message:safeDiagnostic(error&&error.message)
  });
}

function errorCode(error){
  const body=error&&error.body;
  return String((body&&typeof body==="object"&&(body.code||body.message||body.details))||error&&error.message||"");
}

function showLinkError(error,msg){
  const code=errorCode(error);
  msg.style.color="#b91c1c";
  if(Number(error&&error.status)===401||/AUTH_REQUIRED|JWT|session/i.test(code)){
    msg.textContent="로그인 세션이 만료되었습니다. 다시 로그인해 주세요.";
    setTimeout(()=>location.assign("login.html?next="+encodeURIComponent("/business-verify.html")),700);
    return;
  }
  if(/BUSINESS_ALREADY_REGISTERED|duplicate|23505/i.test(code)){
    msg.textContent="이미 등록된 사업자번호입니다. 해당 회사의 관리자 승인이 필요합니다.";
    return;
  }
  if(Number(error&&error.status)===403||/42501|permission|policy|RLS/i.test(code)){
    msg.textContent="사업장 생성 권한이 없습니다. 관리자에게 문의해 주세요.";
    return;
  }
  msg.textContent="사업장 연동 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
}

async function getCurrentSession(writeDiagnostic=true){
  const {data:{session}={},error:sessionError}=await sbClient.auth.getSession();
  if(writeDiagnostic){
    console.info("[business-link] session",{
      hasSession:Boolean(session),
      userId:session&&session.user&&session.user.id,
      email:session&&session.user&&session.user.email,
      sessionError:sessionError ? safeDiagnostic(sessionError.message) : null
    });
  }
  return {session,sessionError};
}

async function loadCurrentAccount(userId){
  const {data,error}=await sbClient.from("account").select("*").eq("auth_user_id",userId).maybeSingle();
  if(error){
    const accountError=new Error("ACCOUNT_LOOKUP_FAILED");
    accountError.status=error.status||null;
    accountError.body={code:error.code,message:error.message,details:error.details};
    throw accountError;
  }
  return data;
}

(async () => { try {
  if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
} catch(e){} })();

function paintStatus(){
  const el=document.getElementById("status"), sm=document.getElementById("status-msg");
  document.getElementById("form-card").style.display="";
  if(!USER||!USER.id){ el.className="badge b-none"; el.textContent="로그인 필요"; sm.innerHTML="<a href='login.html'>로그인 →</a> 후 이용하세요."; document.getElementById("form-card").style.display="none"; return; }
  if(USER.member_status==="APPROVED" && USER.company_name){
    el.className="badge b-ok";
    el.textContent="회사 전용 공간 사용 중";
    sm.innerHTML="사업장: <b>"+esc(USER.company_name)+"</b> · 체험 데이터와 분리되어 있습니다. <a href='/'>회사 화면으로 이동 →</a>";
    document.getElementById("form-card").style.display="none";
    return;
  }
  else { el.className="badge b-none"; el.textContent="미연동"; sm.textContent="사업자번호를 조회하고 연동해 주세요."; }
  if(USER.company_name) document.getElementById("f-name").value=USER.company_name;
}
paintStatus();

(async function restoreSessionAccount(){
  try{
    const {session}=await getCurrentSession(false);
    if(!session||!session.user||!session.user.id) return;
    const account=await loadCurrentAccount(session.user.id);
    USER={...(USER||{}),id:session.user.id,email:session.user.email||"",...(account||{})};
    localStorage.setItem("meatos_user_cache",JSON.stringify(USER));
    paintStatus();
  }catch(error){
    logLinkError(error);
  }
})();

// 주소 간편검색 (Daum 우편번호)
document.getElementById("addr-btn").addEventListener("click", ()=>{
  new daum.Postcode({ oncomplete:function(d){
    const addr=d.roadAddress || d.jibunAddress || d.address;
    document.getElementById("f-addr").value=addr;
    document.getElementById("f-addr2").focus();
  }}).open();
});

// 국세청 사업자 상태 조회
document.getElementById("check").addEventListener("click", async ()=>{
  const m=document.getElementById("chk-msg");
  const bno=(document.getElementById("f-bizno").value||"").replace(/\D/g,"");
  if(bno.length!==10){ m.style.color="#b91c1c"; m.textContent="사업자번호 10자리를 입력하세요."; return; }
  m.style.color="#6b7280"; m.textContent="사업자 인증 중…"; VERIFIED=false; refreshLinkState();
  try{
    const r=await fetch(BIZ_FN,{method:"POST",headers:HW,body:JSON.stringify({b_no:bno})});
    const j=await r.json();
    if(!j.ok){ m.style.color="#b91c1c"; m.textContent="인증 서비스 오류: "+(j.message||"키/승인 확인 필요"); return; }
    if(j.active){ m.style.color="#166534"; m.textContent="✓ 사업자 인증 완료 · 계속사업자 ("+(j.tax_type||"")+"). 아래 정보 확인 후 연동하세요."; VERIFIED=true; refreshLinkState(); }
    else { m.style.color="#b91c1c"; m.textContent="⚠ "+(j.b_stt||"휴업/폐업 또는 미등록")+" — 연동할 수 없습니다."; }
  }catch(e){ m.style.color="#b91c1c"; m.textContent="인증 오류(함수 배포/키 확인): "+e.message; }
});

// 사업장 연동
document.getElementById("link").addEventListener("click", async ()=>{
  const msg=document.getElementById("msg");
  if(!VERIFIED){ msg.style.color="#b91c1c"; msg.textContent="먼저 국세청 조회로 확인하세요."; return; }
  if(!consent.checked){ msg.style.color="#b91c1c"; msg.textContent="회사 전용 데이터 공간 전환에 동의해 주세요."; return; }
  const name=(document.getElementById("f-name").value||"").trim();
  const rep=(document.getElementById("f-rep").value||"").trim();
  const bno=(document.getElementById("f-bizno").value||"").replace(/\D/g,"");
  if(!name||!rep){ msg.style.color="#b91c1c"; msg.textContent="상호·대표자명을 입력하세요."; return; }
  const addr=((document.getElementById("f-addr").value||"")+" "+(document.getElementById("f-addr2").value||"")).trim();
  msg.style.color="#6b7280"; msg.textContent="연동 중…";
  try{
    const {session,sessionError}=await getCurrentSession();
    if(sessionError||!session||!session.user||!session.user.id){
      msg.style.color="#b91c1c";
      msg.textContent="로그인 세션이 만료되었습니다. 다시 로그인해 주세요.";
      setTimeout(()=>location.assign("login.html?next="+encodeURIComponent("/business-verify.html")),700);
      return;
    }
    localStorage.setItem("meatos_access_token",session.access_token||"");
    const linkHeaders={
      apikey:ANON,
      Authorization:"Bearer "+session.access_token,
      "Content-Type":"application/json"
    };

    const account=await loadCurrentAccount(session.user.id);
    USER={...(USER||{}),id:session.user.id,email:session.user.email||"",...(account||{})};
    if(account&&account.member_status==="APPROVED"&&account.company_id){
      msg.style.color="#166534";
      msg.textContent="이미 회사 전용 공간을 사용 중입니다. 기존 데이터는 유지됩니다.";
      return;
    }
    if(!account||!account.company_id){
      msg.textContent="아직 연결된 사업장이 없습니다. 인증된 사업장으로 새 회사 공간을 생성합니다.";
    }

    const result=await requireOk(await fetch(REST+"/rpc/activate_own_business_tenant",{method:"POST",headers:linkHeaders,body:JSON.stringify({
      p_business_name:name,
      p_business_number:bno,
      p_representative_name:rep,
      p_business_address:addr||null,
      p_license_type:document.getElementById("f-lic").value,
      p_license_number:(document.getElementById("f-licno").value||"").trim()||null
    })}), "회사 전용 공간 생성");
    const linkedAccount=Array.isArray(result)?result[0]:result;
    if(!linkedAccount||!linkedAccount.company_id){
      const invalidResult=new Error("INVALID_LINK_RESULT");
      invalidResult.status=500;
      invalidResult.body={code:"INVALID_LINK_RESULT"};
      throw invalidResult;
    }
    // 캐시 갱신(헤더에 사업자명 표시)
    USER={...USER,...linkedAccount,company_name:name,member_status:"APPROVED"};
    localStorage.setItem("meatos_user_cache", JSON.stringify(USER));
    window.MEATOS_TENANT=USER.company_id;
    msg.style.color="#166534"; msg.textContent="✓ 회사 전용 공간이 준비되었습니다. 체험 데이터는 이전하지 않았습니다.";
    setTimeout(()=>location.assign("/"), 800);
  }catch(e){ logLinkError(e); showLinkError(e,msg); }
});
</script>
</body>
</html>
