<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="모든 정육점 POS를 연결하는 AI 축산물 유통 SCM 플랫폼"
    />
    <title>MEATOS AI SCM</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="주요 메뉴">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <strong>MEATOS</strong>
            <span>AI SCM Standard</span>
          </div>
        </div>
        <nav class="nav-list">
          <button class="nav-item active" data-view="dashboard">통합현황</button>
          <button class="nav-item" data-view="alias">AI관리</button>
          <button class="nav-item" data-view="pos">POS관리</button>
          <button class="nav-item" data-view="inventory">재고관리</button>
          <button class="nav-item" data-view="sales">판매관리</button>
          <button class="nav-item" data-view="orders">발주관리</button>
          <button class="nav-item" data-view="analytics">분석관리</button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Universal POS Adapter & AI Inventory Platform</p>
            <h1 id="view-title">AI 축산물 유통 SCM 플랫폼</h1>
          </div>
          <div class="top-actions">
            <span class="status-dot"></span>
            <span>Adapter 정상</span>
            <button class="primary-button" id="run-health-check">POS Health Check</button>
          </div>
        </header>

        <section class="hero-band" aria-labelledby="hero-title">
          <div>
            <p class="eyebrow">대한민국 정육점 표준 SCM</p>
            <h2 id="hero-title">POS는 그대로, 재고와 발주는 하나의 표준으로.</h2>
            <p>
              OKPOS, POSMASTER, POPS, CSV, DB, 수기 판매까지 모든 판매 데이터를
              표준 상품과 재고 Ledger로 변환합니다.
            </p>
          </div>
          <div class="adapter-map" aria-label="Adapter 연결 흐름">
            <span>OKPOS</span>
            <span>CSV</span>
            <span>DB</span>
            <strong>Universal Adapter</strong>
            <span>Alias Engine</span>
            <span>Inventory</span>
            <span>AI 발주</span>
          </div>
        </section>

        <section id="app-view" class="content-grid"></section>
      </main>
    </div>

    <div class="mobile-tabbar" aria-label="모바일 빠른 메뉴">
      <button class="mobile-tab active" data-view="dashboard">현황</button>
      <button class="mobile-tab" data-view="alias">AI</button>
      <button class="mobile-tab" data-view="pos">POS</button>
      <button class="mobile-tab" data-view="inventory">재고</button>
      <button class="mobile-tab" data-view="orders">발주</button>
    </div>

    <template id="toast-template">
      <div class="toast" role="status"></div>
    </template>

    <script src="app.js" type="module"></script>
  </body>
</html>
