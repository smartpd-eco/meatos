<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16a34a" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta name="description" content="정육점 사장님을 위한 AI 업무비서 · 고기장터 MEATOS" />
  <title>고기장터</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: #111827; padding: 14px; }
    .banner { background: #16a34a; color: #fff; border-radius: 18px; padding: 34px 20px; text-align: center; cursor: pointer; margin: 8px 0 16px; box-shadow: 0 4px 14px rgba(22,163,74,.28); }
    .banner h2 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
    .banner p { margin: 0; font-size: 14px; opacity: .95; }
    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .kcard { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; border: none; text-align: left; }
    .kcard .khead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .kcard .ktitle { font-size: 15px; font-weight: 800; }
    .kcard .ktag { font-size: 11px; color: #9ca3af; }
    .kcard .kval { font-size: 28px; font-weight: 800; line-height: 1.15; }
    .kcard .ksub { font-size: 12px; color: #6b7280; margin-top: 8px; }
    .kcard .kline { height: 4px; border-radius: 999px; margin-top: 10px; background: #e5e7eb; }
    .kcard.sales .kline { background: #16a34a; } .kcard.purchase .kline { background: #f59e0b; }
    .kcard.inventory .kline { background: #2563eb; } .kcard.alert .kline { background: #f59e0b; }
    .kcard.alert .kval.warn { color: #b91c1c; }
    @media (min-width: 720px) { .cards { grid-template-columns: repeat(4, 1fr); } }
    .foot { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 22px; }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <h2>🥩 고기가 들어왔어요!</h2>
    <p>사진 찍기 · 파일 불러오기 · 자동 인식</p>
  </div>

  <div class="cards">
    <button class="kcard sales" data-go="sales.html">
      <div class="khead"><span class="ktitle">매출현황</span><span class="ktag">이번 달</span></div>
      <div class="kval" id="k-sales">-</div>
      <div class="ksub" id="k-sales-sub">불러오는 중…</div>
      <div class="kline"></div>
    </button>
    <button class="kcard purchase" data-go="purchases.html">
      <div class="khead"><span class="ktitle">매입현황</span><span class="ktag">이번 달</span></div>
      <div class="kval" id="k-buy">-</div>
      <div class="ksub" id="k-buy-sub">불러오는 중…</div>
      <div class="kline"></div>
    </button>
    <button class="kcard inventory" data-go="stock.html">
      <div class="khead"><span class="ktitle">재고현황</span><span class="ktag">전체</span></div>
      <div class="kval" id="k-stock">-</div>
      <div class="ksub" id="k-stock-sub">불러오는 중…</div>
      <div class="kline"></div>
    </button>
    <button class="kcard alert" data-go="alerts.html">
      <div class="khead"><span class="ktitle">알림현황</span><span class="ktag">유통기한</span></div>
      <div class="kval" id="k-alert">-</div>
      <div class="ksub" id="k-alert-sub">불러오는 중…</div>
      <div class="kline"></div>
    </button>
  </div>

  <div class="foot">© 2026 MEATOS · 고기장터</div>

  <script src="header.js"></script>
  <script>
    (async () => { try {
      if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x => x.unregister())); }
      if (window.caches) { const k = await caches.keys(); await Promise.all(k.map(x => caches.delete(x))); }
    } catch (e) {} })();

    const REST = "https://pkrsiqjzllyiafwpskll.supabase.co/rest/v1";
    const ANON = "sb_publishable_BuLdLube8Tfkf7hEhFESWg_6tSLGBLh";
    const TENANT = window.MEATOS_TENANT || "881f6cc1-b552-468c-b9b4-152edb464e61";
    const H = { apikey: ANON, Authorization: "Bearer " + ANON };
    const won = (v) => Number(v || 0).toLocaleString("ko-KR");
    function localToday() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    function monthStart() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-01"; }

    document.querySelectorAll(".kcard[data-go]").forEach(c => c.addEventListener("click", () => location.assign(c.dataset.go)));

    // 배너 → 카메라/파일 선택 → 스캔
    async function downscale(file) {
      const MAX = 1600; const bmp = await createImageBitmap(file);
      const s = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(bmp, 0, 0, w, h);
      return c.toDataURL("image/jpeg", 0.85);
    }
    function makeInput(cam) {
      const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
      if (cam) i.setAttribute("capture", "environment"); i.style.display = "none";
      i.addEventListener("change", async () => {
        const f = i.files && i.files[0]; if (!f) return;
        try { sessionStorage.setItem("meatos_pending_image", await downscale(f)); sessionStorage.setItem("meatos_pending_name", f.name || "scan.jpg"); } catch (e) {}
        location.assign("scan.html");
      });
      document.body.appendChild(i); return i;
    }
    const camIn = makeInput(true), fileIn = makeInput(false);
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px";
    ov.innerHTML = "<div style='background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px'>" +
      "<div style='font-size:18px;font-weight:800;margin-bottom:6px'>거래명세서 입력</div>" +
      "<div style='color:#6b7280;font-size:13px;margin-bottom:14px'>입력 방식을 선택하세요</div>" +
      "<button id='oc' style='display:block;width:100%;padding:18px;margin-bottom:10px;font-size:17px;font-weight:800;border:none;border-radius:12px;background:#16a34a;color:#fff'>📷 사진 찍기</button>" +
      "<button id='of' style='display:block;width:100%;padding:18px;margin-bottom:10px;font-size:17px;font-weight:800;border:none;border-radius:12px;background:#2563eb;color:#fff'>📁 파일 불러오기</button>" +
      "<button id='ox' style='display:block;width:100%;padding:12px;font-size:15px;border:none;border-radius:12px;background:#e5e7eb;color:#111827'>닫기</button></div>";
    document.body.appendChild(ov);
    document.getElementById("banner").addEventListener("click", () => ov.style.display = "flex");
    ov.addEventListener("click", e => { if (e.target === ov) ov.style.display = "none"; });
    ov.querySelector("#oc").addEventListener("click", () => { ov.style.display = "none"; camIn.value = ""; camIn.click(); });
    ov.querySelector("#of").addEventListener("click", () => { ov.style.display = "none"; fileIn.value = ""; fileIn.click(); });
    ov.querySelector("#ox").addEventListener("click", () => ov.style.display = "none");

    // 대시보드 카드 — 집계 요약(Phase 2) 우선, 실패 시 원본 폴백
    async function jget(path) { try { const r = await fetch(REST + path, { headers: H }); return r.ok ? await r.json() : null; } catch (e) { return null; } }
    (async function loadCards() {
      const today = localToday(), m0 = monthStart(), ym = today.slice(0, 7);

      // 매출: monthly_sales_summary → 폴백 sales_record
      let ms = await jget("/monthly_sales_summary?company_id=eq." + TENANT + "&ym=eq." + ym + "&select=order_cnt,amount");
      if (ms && ms.length) {
        const cnt = ms.reduce((s, r) => s + (r.order_cnt || 0), 0), amt = ms.reduce((s, r) => s + (Number(r.amount) || 0), 0);
        document.getElementById("k-sales").textContent = cnt + "건";
        document.getElementById("k-sales-sub").textContent = "이번 달 " + won(amt) + "원";
      } else {
        const sr = await jget("/sales_record?tenant_id=eq." + TENANT + "&sale_date=gte." + m0 + "&select=amount");
        if (sr) { const amt = sr.reduce((s, r) => s + (Number(r.amount) || 0), 0); document.getElementById("k-sales").textContent = sr.length + "건"; document.getElementById("k-sales-sub").textContent = "이번 달 " + won(amt) + "원"; }
        else { document.getElementById("k-sales").textContent = "0건"; document.getElementById("k-sales-sub").textContent = "판매 입력 없음"; }
      }

      // 매입: monthly_purchase_summary → 폴백 ocr_document
      let mp = await jget("/monthly_purchase_summary?company_id=eq." + TENANT + "&ym=eq." + ym + "&select=doc_cnt,amount");
      if (mp && mp.length) {
        const cnt = mp.reduce((s, r) => s + (r.doc_cnt || 0), 0), amt = mp.reduce((s, r) => s + (Number(r.amount) || 0), 0);
        document.getElementById("k-buy").textContent = cnt + "건";
        document.getElementById("k-buy-sub").textContent = "이번 달 " + won(amt) + "원";
      } else {
        const docs = await jget("/ocr_document?tenant_id=eq." + TENANT + "&document_status=eq.POSTED&select=total_amount,invoice_date,created_at&order=created_at.desc&limit=500") || [];
        const md = docs.filter(d => ((d.invoice_date || (d.created_at || "").slice(0, 10)) >= m0));
        const amt = md.reduce((s, d) => s + (Number(d.total_amount) || 0), 0);
        document.getElementById("k-buy").textContent = md.length + "건";
        document.getElementById("k-buy-sub").textContent = "이번 달 " + won(amt) + "원";
      }

      // 재고: inventory_summary → 폴백 inventory_movement
      let inv = await jget("/inventory_summary?company_id=eq." + TENANT + "&select=on_hand_qty,low_stock");
      if (inv) {
        const low = inv.filter(r => r.low_stock).length;
        document.getElementById("k-stock").textContent = inv.length + "개 품목";
        document.getElementById("k-stock-sub").textContent = low > 0 ? ("부족 " + low + "개") : "정상";
      } else {
        const mv = await jget("/inventory_movement?tenant_id=eq." + TENANT + "&select=raw_product_name,movement_type,quantity&limit=5000") || [];
        const bal = {}; mv.forEach(m => { const k = m.raw_product_name || "-"; const q = Number(m.quantity) || 0; bal[k] = (bal[k] || 0) + (m.movement_type === "OUT" ? -q : q); });
        const names = Object.keys(bal), low = names.filter(k => bal[k] <= 0).length;
        document.getElementById("k-stock").textContent = names.length + "개 품목";
        document.getElementById("k-stock-sub").textContent = low > 0 ? ("부족 " + low + "개") : "정상";
      }

      // 알림: 정육일지 미작성 / 유통기한 (원본 유지)
      const logs = await jget("/daily_sanitation_logs?tenant_id=eq." + TENANT + "&work_date=eq." + today + "&select=id&limit=1");
      const alertEl = document.getElementById("k-alert"), subEl = document.getElementById("k-alert-sub");
      if (!logs || !logs.length) { alertEl.textContent = "미작성"; alertEl.classList.add("warn"); subEl.textContent = "정육일지 작성 필요"; }
      else {
        const lim = new Date(Date.now() + 3 * 86400000).toISOString().slice(0, 10);
        const exp = await jget("/inventory_movement?tenant_id=eq." + TENANT + "&expiry_date=not.is.null&expiry_date=lte." + lim + "&select=id") || [];
        alertEl.textContent = exp.length + "건"; subEl.textContent = exp.length ? "임박·만료 확인" : "임박·만료 없음";
      }
    })();
  </script>
</body>
</html>
