<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="Core Engine 기반 AI 축산물 Universal SCM Platform"
    />
    <title>고기장터</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@paddleocr/paddleocr-js": "/node_modules/@paddleocr/paddleocr-js/dist/index.mjs",
          "@paddleocr/paddleocr-js/viz": "/node_modules/@paddleocr/paddleocr-js/dist/viz.mjs",
          "@techstark/opencv-js": "/src/vendor/opencv-wrapper.mjs",
          "clipper-lib": "/src/vendor/clipper-wrapper.mjs",
          "js-yaml": "/node_modules/js-yaml/dist/js-yaml.mjs",
          "onnxruntime-web": "/node_modules/onnxruntime-web/dist/ort.min.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="주요 메뉴">
        <div class="brand">
          <div class="brand-mark">고</div>
          <div>
            <strong>고기장터</strong>
            <span>Powered by Eco SmartPD  MEATOS</span>
          </div>
        </div>
        <nav class="nav-list">
          <button class="nav-item active" data-view="dashboard">입력</button>
          <button class="nav-item" data-view="inventory">재고</button>
          <button class="nav-item" data-view="sales">매출</button>
          <button class="nav-item" data-view="more">더보기</button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-back-button" id="mobile-back-button" type="button" aria-label="고기장터 홈으로 돌아가기">‹</button>
          <div>
            <p class="eyebrow">AI 업무비서</p>
            <h1 id="view-title">고기장터</h1>
          </div>
          <div class="top-actions">
            <span class="status-dot"></span>
            <span>사진 찍고 확인하면 끝</span>
            <button class="secondary-button" id="run-supabase-check">연결 확인</button>
            <button class="primary-button" id="run-health-check">업무 점검</button>
          </div>
        </header>

        <section class="hero-band" aria-labelledby="hero-title">
          <div>
            <p class="eyebrow">사진 찍기  확인  완료</p>
            <h2 id="hero-title">정육점 사장님의 계산대 옆 AI 비서입니다.</h2>
            <p>
              사용자는 복잡한 ERP를 보지 않습니다. 가장 자주 쓰는 일만 크게 보여주고, 나머지는 뒤에서 자동으로 처리합니다.
            </p>
          </div>
          <div class="adapter-map" aria-label="핵심 메뉴">
            <span>입력</span>
            <span>재고</span>
            <span>매출</span>
            <strong>더보기</strong>
          </div>
        </section>

        <section id="app-view" class="content-grid"></section>
      </main>
    </div>

    <div class="mobile-tabbar" aria-label="모바일 빠른 메뉴">
      <button class="mobile-tab active" data-view="dashboard"><span aria-hidden="true">＋</span><strong>입력</strong></button>
      <button class="mobile-tab" data-view="inventory"><span aria-hidden="true">▣</span><strong>재고</strong></button>
      <button class="mobile-tab" data-view="sales"><span aria-hidden="true">▥</span><strong>매출</strong></button>
      <button class="mobile-tab" data-view="more"><span aria-hidden="true">•••</span><strong>더보기</strong></button>
    </div>

    <template id="toast-template">
      <div class="toast" role="status"></div>
    </template>

    <script src="runtime-config.js"></script>
    <script src="app.js" type="module"></script>
    <script>
      // 대시보드 진입점 연결. "고기가 들어왔어요"는 카메라/파일창을 즉시 열고(한 번 탭),
      // 선택하면 스캔 화면으로 넘어가 자동 인식한다. 카드들은 목록/재고로 이동.
      (function () {
        var input = document.createElement("input");
        input.type = "file"; input.accept = "image/*"; input.setAttribute("capture", "environment");
        input.style.display = "none";
        document.body.appendChild(input);

        async function downscale(file) {
          var MAX = 1600;
          var bmp = await createImageBitmap(file);
          var scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
          var w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
          var c = document.createElement("canvas"); c.width = w; c.height = h;
          c.getContext("2d").drawImage(bmp, 0, 0, w, h);
          return c.toDataURL("image/jpeg", 0.85);
        }

        input.addEventListener("change", async function () {
          var file = input.files && input.files[0];
          if (!file) return;
          try {
            var dataUrl = await downscale(file);
            sessionStorage.setItem("meatos_pending_image", dataUrl);
            sessionStorage.setItem("meatos_pending_name", file.name || "scan.jpg");
          } catch (e) { /* fall through to manual pick on scan page */ }
          window.location.assign("scan.html");
        });

        document.addEventListener("click", function (e) {
          var el = e.target;
          if (!el || !el.closest) return;
          if (el.closest("[data-ocr-input-open]")) {         // "고기가 들어왔어요" · 입력
            e.preventDefault(); e.stopImmediatePropagation();
            input.value = ""; input.click();                 // 카메라/파일창 즉시 오픈 (사용자 제스처 내)
            return;
          }
          var dest = null;
          if (el.closest(".mobile-kpi-card.purchase")) dest = "records.html";   // 매입현황 → 저장 목록
          else if (el.closest(".mobile-kpi-card.inventory")) dest = "stock.html"; // 재고현황 → 재고 현황
          if (dest) { e.preventDefault(); e.stopImmediatePropagation(); window.location.assign(dest); }
        }, true);
      })();
    </script>
  </body>
</html>
